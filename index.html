const BUBBLE_VS = `attribute vec2 aPos; varying vec2 vUv;
void main() { vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;

const BUBBLE_FS = `precision highp float;
varying vec2 vUv;
uniform sampler2D uEnv;
uniform float uTime, uScale, uSpeed, uView, uPx;
uniform vec3 uTint, uPal1, uPal2, uPal3;
uniform float uRag;
uniform vec4 uBurst;
float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
}
float fbm(vec2 p) {
  float a = 0.5, s = 0.0;
  for (int i = 0; i < 4; i++) { s += a * noise(p); p = p * 2.03 + vec2(1.7, 9.2); a *= 0.5; }
  return s;
}
vec3 env(vec3 d) {
  float u = atan(d.x, -d.z) / 6.2831853 + 0.5 + uTime * 0.004;
  float v = acos(clamp(d.y, -1.0, 1.0)) / 3.1415927;
  vec3 real = texture2D(uEnv, vec2(u, v)).rgb;
  vec3 sky = texture2D(uEnv, vec2(u, acos(abs(d.y)) / 3.1415927 * 0.85)).rgb;
  return mix(real, sky, 0.6) * 1.25; // больше неба — пузырь чище
}
float thickness(vec3 n) {
  vec2 q = vec2(n.x * 1.7 + n.z * 0.8, n.y * 2.4 + n.z * 0.5); // без atan — нет шва
  float t = uTime * uSpeed;
  float sw = fbm(q * 0.9 + vec2(t * 0.05, -t * 0.13)) + 0.5 * fbm(q * 2.1 - vec2(t * 0.09, t * 0.05));
  return mix(1100.0, 250.0, n.y * 0.5 + 0.5) * (0.55 + 0.75 * sw);
}
vec3 film(float d, float c) {
  float ct = sqrt(1.0 - (1.0 - c * c) / 1.769);
  vec3 ph = 12.566371 * 1.33 * d * ct / vec3(650.0, 532.0, 450.0);
  vec3 f = 0.5 - 0.5 * cos(ph);
  // переливы в палитре состояния: каждая «полоса» интерференции получает свой цвет
  vec3 t = uPal1 * f.r + uPal2 * f.g + uPal3 * f.b;
  t *= max(f.r, max(f.g, f.b)) / max(max(t.r, max(t.g, t.b)), 0.001);
  return mix(f, t, 0.65);
}
// 1 — плёнка цела, 0 — дыра. Чем ниже состояние, тем больше дыр; они медленно ползут
float holes(vec3 m, out float edge) {
  edge = 0.0;
  if (uRag <= 0.001) return 1.0;
  float h = fbm(m.xy * 2.2 + m.z * 1.3 + vec2(uTime * 0.03, -uTime * 0.02));
  float th = 1.0 - uRag * 0.42;
  float keep = smoothstep(th + 0.01, th - 0.01, h);
  edge = keep * smoothstep(0.06, 0.0, th - h); // светится только край уцелевшей плёнки
  return keep;
}
void main() {
  vec2 p = (vUv * 2.0 - 1.0) * uView;
  float ang = atan(p.y, p.x);
  vec2 dirP = p / max(length(p), 0.0001);
  float wob = 0.012 * sin(ang * 3.0 + uTime * 1.3) + 0.008 * sin(ang * 5.0 - uTime * 1.7);
  // рваный, дрожащий силуэт при низком состоянии
  wob += uRag * (0.07 * (noise(dirP * 2.5 + uTime * 0.6) - 0.5) + 0.04 * (noise(dirP * 9.0 + uTime * 1.4) - 0.5));
  float rad = uScale * (1.0 + wob);
  float r = length(p) / max(rad, 0.001);
  if (r >= 1.0 || uScale <= 0.0) { gl_FragColor = vec4(0.0); return; }
  vec3 n = vec3(p / rad, sqrt(1.0 - r * r));
  vec3 nb = vec3(n.xy, -n.z);
  float c = n.z;
  float F = 0.035 + 0.965 * pow(1.0 - c, 3.0);
  float front = 1.0, back = 1.0, rim = 0.0;
  if (uBurst.w > 0.0) {
    vec3 dir = normalize(uBurst.xyz);
    float edge = uBurst.w * 3.4 + (noise(n.xy * 9.0 + 3.0) - 0.5) * 0.35;
    float af = acos(clamp(dot(n, dir), -1.0, 1.0)) - edge;
    float ab = acos(clamp(dot(nb, dir), -1.0, 1.0)) - edge;
    front = step(0.0, af);
    back = step(0.0, ab);
    rim = front * smoothstep(0.14, 0.0, af) + back * smoothstep(0.14, 0.0, ab) * 0.6;
  }
  float ef, eb;
  float hf = holes(n, ef), hb = holes(nb, eb);
  rim += (ef * front + eb * back * 0.6) * 0.8;
  front *= hf;
  back *= hb;
  vec3 cf = env(reflect(vec3(0.0, 0.0, -1.0), n)) * film(thickness(n), c);
  vec3 cb = env(reflect(vec3(0.0, 0.0, -1.0), -nb)) * film(thickness(nb), c);
  vec3 col = (cf * front + cb * back * 0.6) * F * 2.1;
  vec3 key = normalize(vec3(-0.45, 0.55, 0.7));
  col += vec3(1.0) * pow(max(dot(reflect(vec3(0.0, 0.0, -1.0), n), key), 0.0), 90.0) * 1.6 * front;
  col += vec3(1.0) * pow(max(dot(reflect(vec3(0.0, 0.0, -1.0), -nb), key), 0.0), 60.0) * 0.5 * back;
  col += uTint * pow(1.0 - c, 3.0) * 0.45 * max(front, back);
  col += mix(vec3(1.0), uPal1, 0.45) * rim * 0.9;
  col = col / (1.0 + col * 0.35);
  float a = clamp(max(max(col.r, col.g), col.b) * 1.05, 0.0, 1.0);
  float aa = smoothstep(1.0, 1.0 - 1.5 * uPx / max(rad, 0.001), r); // мягкая кромка без лесенки
  gl_FragColor = vec4(min(col, vec3(a)), a) * aa;
}`;

const bubble = { cur: null, target: null, ok: null, canvas: null, drops: null, gl: null, u: null, raf: 0, t0: performance.now(), burst: null, grow: null, pulse: null, parts: [], energy: 3, score: null };

function bubbleInit() {
  if (bubble.ok !== null) return bubble.ok;
  bubble.ok = false;
  const canvas = document.createElement('canvas');
  canvas.className = 'bubble-gl';
  canvas.setAttribute('aria-label', 'Пузырь состояния — нажми, чтобы лопнуть');
  const gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: true });
  if (!gl) return false;
  const shader = (type, src) => {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    return gl.getShaderParameter(sh, gl.COMPILE_STATUS) ? sh : null;
  };
  const vs = shader(gl.VERTEX_SHADER, BUBBLE_VS);
  const fs = shader(gl.FRAGMENT_SHADER, BUBBLE_FS);
  if (!vs || !fs) return false;
  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return false;
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([150, 170, 190, 255]));
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const img = new Image();
  img.onload = () => {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  };
  img.src = BUBBLE_ENV;
  bubble.u = Object.fromEntries(['uTime', 'uScale', 'uSpeed', 'uView', 'uPx', 'uTint', 'uPal1', 'uPal2', 'uPal3', 'uRag', 'uBurst', 'uEnv'].map((k) => [k, gl.getUniformLocation(prog, k)]));
  canvas.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    bubble.ok = false;
    canvas.remove();
    if (bubble.drops) bubble.drops.remove();
    document.querySelectorAll('.orb-core.gl').forEach((c) => c.classList.remove('gl'));
  });
  canvas.addEventListener('click', bubbleTap);
  const drops = document.createElement('canvas');
  drops.className = 'bubble-drops';
  Object.assign(bubble, { ok: true, canvas, drops, gl });
  return true;
}

const BUBBLE_VIEW = 1.9; // холст больше пузыря — чтобы брызгам было куда лететь

/** Вставляет холст пузыря в новую разметку сферы (после каждой отрисовки вкладки). */
function mountBubble(root) {
  const core = root.querySelector('.orb-core');
  if (!core || !bubbleInit()) return;
  const rgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
  const pal = (core.dataset.orbPal || '#66d0ff,#4f7dff,#b99bff').split(',').map(rgb);
  const scoreNow = Number(core.dataset.orbScore) || 0;
  // рваность: до 80% пузырь цел, к нулю — весь в дырах
  bubble.target = { pal, tint: pal[0], rag: Math.min(1, Math.max(0, (80 - scoreNow) / 80)) ** 1.2 };
  if (!bubble.cur) bubble.cur = { pal: pal.map((c) => c.slice()), tint: pal[0].slice(), rag: bubble.target.rag };
  bubble.energy = Number(core.dataset.orbEnergy) || 3;
  const score = Number(core.dataset.orbScore);
  if (bubble.score !== null && score > bubble.score) bubble.pulse = performance.now();
  bubble.score = score;
  core.classList.add('gl');
  core.insertBefore(bubble.drops, core.querySelector('.orb'));
  core.insertBefore(bubble.canvas, bubble.drops);
  if (!bubble.raf) bubble.raf = requestAnimationFrame(bubbleFrame);
}

function bubbleTap(e) {
  if (bubble.burst || bubble.grow || reducedMotion.matches) return;
  const rect = bubble.canvas.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width * 2 - 1) * BUBBLE_VIEW;
  const y = -((e.clientY - rect.top) / rect.height * 2 - 1) * BUBBLE_VIEW;
  const r2 = x * x + y * y;
  const dir = r2 < 1 ? [x, y, Math.sqrt(1 - r2)] : [0.2, 0.3, 0.93];
  bubble.burst = { t0: performance.now(), dir, spawned: 0 };
  Sound.play('pop');
  haptic(12);
}

/** Капли с кромки разрыва: точки на кромке разлетаются от места разрыва и падают. */
function spawnDrops(dir, edge, count) {
  const [dx, dy, dz] = dir;
  // базис вокруг направления разрыва
  let ux = -dy, uy = dx, uz = 0;
  const ul = Math.hypot(ux, uy) || 1;
  ux /= ul; uy /= ul;
  const vx = dy * uz - dz * uy, vy = dz * ux - dx * uz, vz = dx * uy - dy * ux;
  for (let i = 0; i < count; i++) {
    const phi = Math.random() * Math.PI * 2;
    const ca = Math.cos(edge), sa = Math.sin(edge);
    const px = dx * ca + (ux * Math.cos(phi) + vx * Math.sin(phi)) * sa;
    const py = dy * ca + (uy * Math.cos(phi) + vy * Math.sin(phi)) * sa;
    const pz = dz * ca + (uz * Math.cos(phi) + vz * Math.sin(phi)) * sa;
    if (pz < -0.2 && Math.random() < 0.6) continue; // задняя стенка видна хуже
    const out = 0.35 + Math.random() * 0.9;
    bubble.parts.push({ x: px, y: py, vx: (px - dx * 0.5) * out, vy: (py - dy * 0.5) * out + 0.25, life: 0, max: 0.6 + Math.random() * 0.6, r: 0.6 + Math.random() * 1.6 });
  }
}

function bubbleFrame(now) {
  const { canvas, drops, gl, u } = bubble;
  if (!bubble.ok || !canvas.isConnected || document.hidden) {
    bubble.raf = 0;
    return;
  }
  const dpr = Math.min(2, devicePixelRatio || 1);
  const w = Math.round(canvas.clientWidth * dpr);
  if (canvas.width !== w) {
    canvas.width = canvas.height = w;
    drops.width = drops.height = w;
  }
  const t = (now - bubble.t0) / 1000;
  let scale = 1;
  let burstW = 0;
  if (bubble.burst) {
    const b = bubble.burst;
    const k = (now - b.t0) / 420;
    burstW = Math.min(1, k);
    // капли рождаются на кромке, пока она бежит по пузырю
    const edge = burstW * 3.4;
    const want = Math.floor(burstW * 90);
    if (want > b.spawned && edge < Math.PI) {
      spawnDrops(b.dir, edge, want - b.spawned);
      b.spawned = want;
    }
    if (k >= 1) scale = 0;
    if (k >= 2.2) {
      bubble.burst = null;
      bubble.grow = now;
    }
  }
  if (bubble.grow) {
    const k = Math.min(1, (now - bubble.grow) / 750);
    const c1 = 1.70158, c3 = c1 + 1;
    scale = k <= 0 ? 0 : 1 + c3 * (k - 1) ** 3 + c1 * (k - 1) ** 2; // ease-out-back
    if (k >= 1) bubble.grow = null;
  }
  if (bubble.pulse) {
    const k = (now - bubble.pulse) / 900;
    if (k >= 1) bubble.pulse = null;
    else scale *= 1 + 0.07 * Math.sin(k * Math.PI) * (1 - k);
  }
  const speed = 0.5 + bubble.energy * 0.3;
  // цвет и рваность плавно перетекают к новому состоянию
  const cur = bubble.cur;
  const tg = bubble.target;
  const ease = (a, b) => a + (b - a) * 0.04;
  cur.rag = ease(cur.rag, tg.rag);
  cur.pal = cur.pal.map((c, i) => c.map((v, j) => ease(v, tg.pal[i][j])));
  cur.tint = cur.pal[0];
  // с рваных краёв срываются капли
  if (!bubble.burst && !bubble.grow && cur.rag > 0.25 && Math.random() < cur.rag * 0.05) {
    const a = Math.random() * Math.PI * 2;
    bubble.parts.push({ x: Math.cos(a), y: Math.sin(a), vx: Math.cos(a) * 0.25, vy: Math.sin(a) * 0.25 - 0.1, life: 0, max: 0.7 + Math.random() * 0.5, r: 0.5 + Math.random() * 1.1 });
  }
  gl.viewport(0, 0, w, w);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform1f(u.uTime, reducedMotion.matches ? 4 : t);
  gl.uniform1f(u.uScale, scale);
  gl.uniform1f(u.uSpeed, speed);
  gl.uniform1f(u.uView, BUBBLE_VIEW);
  gl.uniform1f(u.uPx, (2 * BUBBLE_VIEW) / w);
  gl.uniform3fv(u.uTint, cur.tint);
  gl.uniform3fv(u.uPal1, cur.pal[0]);
  gl.uniform3fv(u.uPal2, cur.pal[1]);
  gl.uniform3fv(u.uPal3, cur.pal[2]);
  gl.uniform1f(u.uRag, cur.rag);
  gl.uniform4f(u.uBurst, ...(bubble.burst ? bubble.burst.dir : [0, 0, 1]), burstW);
  gl.uniform1i(u.uEnv, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // брызги
  const ctx = drops.getContext('2d');
  ctx.clearRect(0, 0, w, w);
  const half = w / 2;
  const unit = half / BUBBLE_VIEW;
  const dt = 1 / 60;
  bubble.parts = bubble.parts.filter((p) => (p.life += dt) < p.max);
  for (const p of bubble.parts) {
    p.vy -= 1.6 * dt; // тяжесть
    p.vx *= 0.985;
    p.x += p.vx * dt * 1.8;
    p.y += p.vy * dt * 1.8;
    const a = 1 - p.life / p.max;
    const x = half + p.x * unit;
    const y = half - p.y * unit;
    const r = p.r * dpr * (0.6 + a * 0.6);
    const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, 0, x, y, r);
    g.addColorStop(0, `rgba(255,255,255,${0.95 * a})`);
    g.addColorStop(0.6, `rgba(${cur.tint.map((c) => Math.round(150 + c * 105)).join(',')},${0.55 * a})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  // без анимаций — один кадр
  bubble.raf = reducedMotion.matches && !bubble.burst && !bubble.parts.length ? 0 : requestAnimationFrame(bubbleFrame);
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && bubble.ok && bubble.canvas.isConnected && !bubble.raf) bubble.raf = requestAnimationFrame(bubbleFrame);
});

/* ---------- Сфера состояния ----------
   Цвет — состояние дня (опоры и сливы), скорость переливов и свечение — энергия.
   Линии слева ведут к тому, что держит, справа — к сливам и несделанным опорам. */

const ORB_COLORS = {
  full: ['#6dffc0', '#66d0ff', '#b99bff'],
  good: ['#66d0ff', '#4f7dff', '#b99bff'],
  mid: ['#ffc56b', '#ff7ab0', '#8a6bff'],
  low: ['#ff5f7a', '#a43bff', '#2a1650'],
};

const shortTitle = (t) => {
  const s = t.split(/[:(—]/)[0].trim() || t;
  return s.length > 22 ? s.slice(0, 21) + '…' : s;
};

/** Что держит состояние сегодня и что тянет вниз. */
function orbFactors() {
  const { state } = session;
  const done = completionIndex();
  const today = dayData(dayKey(new Date()));
  const now = new Date();
  const daysLeft = 7 - ((now.getDay() + 6) % 7); // включая сегодня
  const plus = [];
  const minus = [];
  for (const dr of state.drains) if (today.drains.includes(dr.id)) minus.push({ t: shortTitle(dr.title), s: `слив · −${DRAIN_PENALTY}%`, kind: 'drain' });
  for (const q of supports()) {
    const t = shortTitle(q.title);
    if (q.repeat === 'daily') {
      if (done.has(q.id)) plus.push({ t, s: 'сегодня ✓' });
      else minus.push({ t, s: 'ещё не сегодня', kind: 'miss' });
    } else if (q.repeat === 'xweek') {
      const n = weekCount(q, now);
      if (done.has(q.id)) plus.push({ t, s: `${n} из ${q.times} за неделю` });
      else if (n < q.times && q.times - n >= daysLeft) minus.push({ t, s: `${n} из ${q.times} — не успеваешь`, kind: 'miss' });
    }
  }
  const cap = (list) => (list.length <= 3 ? list : list.slice(0, 2).concat({ t: `и ещё ${list.length - 2}`, s: list.slice(2).map((x) => x.t).join(', '), kind: list[2].kind }));
  return { plus: cap(plus), minus: cap(minus) };
}

function orbHtml(s, cls, word, energy) {
  const [c1, c2, c3] = ORB_COLORS[cls];
  const { plus, minus } = orbFactors();
  const lbl = (x) => `<div class="orb-lbl k-${x.kind || 'plus'}" data-lbl="${x.kind || 'plus'}"><b>${esc(x.t)}</b><small>${esc(x.s)}</small></div>`;
  const spin = energy ? 24 - energy * 3 : 15; // энергия 5 — быстрые переливы, 1 — медленные
  const glow = energy ? (0.35 + energy * 0.13).toFixed(2) : 0.6;
  const surge = ui.orbScore !== undefined && s.score > ui.orbScore;
  ui.orbScore = s.score;
  return `<section class="panel orb-panel" style="--c1:${c1};--c2:${c2};--c3:${c3};--spin:${spin}s;--glow:${glow}">
      <div class="orb-head"><small>Состояние сейчас</small></div>
      <div class="orb-wrap" data-orb>
        <svg class="orb-lines" aria-hidden="true"></svg>
        <div class="orb-side l"><span class="orb-cap">Держит</span>${plus.length ? plus.map(lbl).join('') : lbl({ t: 'Пусто', s: 'отметь опору — сфера засветится', kind: 'empty' })}</div>
        <div class="orb-core${surge ? ' surge' : ''}" data-orb-energy="${energy || 3}" data-orb-tint="${c1}" data-orb-pal="${c1},${c2},${c3}" data-orb-score="${s.score}">
          <span class="orb-halo"></span><span class="orb-ring"></span><span class="orb-ring r2"></span>
          <div class="orb" role="img" aria-label="Состояние ${s.score}%, ${word}${energy ? `, энергия ${energy} из 5` : ''}">
            <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
            <span class="orb-txt"><b>${s.score}%</b><small>${word}</small>${energy ? `<em>⚡ ${energy}/5</em>` : ''}</span>
          </div>
        </div>
        <div class="orb-side r"><span class="orb-cap">Тянет вниз</span>${minus.length ? minus.map(lbl).join('') : lbl({ t: 'Ничего', s: 'всё по плану ✓', kind: 'calm' })}</div>
      </div>
      <span class="goal-sub"><span>Опоры: ${s.dailyDone} из ${s.daily}${s.weeklyDone ? ` · недельных +${s.weeklyDone}` : ''}</span><span>${s.drains ? `сливы: ${s.drains} · −${s.drains * DRAIN_PENALTY}%` : ''}</span></span>
      ${energy ? '' : '<p class="hint">Оцени энергию ниже — от неё зависит, как ярко и быстро переливается сфера.</p>'}
    </section>`;
}

/** Линии от сферы к подписям: считаются по реальным размерам, поэтому после отрисовки и при повороте экрана. */
function layoutOrb(root) {
  const wrap = root.querySelector('[data-orb]');
  if (!wrap) return;
  mountBubble(wrap);
  const svg = wrap.querySelector('.orb-lines');
  const core = wrap.querySelector('.orb-core');
  const cx = core.offsetLeft + core.offsetWidth / 2;
  const cy = core.offsetTop + core.offsetHeight / 2;
  const r = core.offsetWidth / 2 + 2;
  svg.setAttribute('viewBox', `0 0 ${wrap.clientWidth} ${wrap.clientHeight}`);
  let out = '';
  wrap.querySelectorAll('[data-lbl]').forEach((el, i) => {
    const side = el.parentElement;
    const left = side.classList.contains('l');
    const ax = left ? side.offsetLeft + side.offsetWidth + 4 : side.offsetLeft - 4;
    const ay = side.offsetTop + el.offsetTop + 9;
    const ex = left ? ax + 8 : ax - 8;
    const d = Math.hypot(ex - cx, ay - cy) || 1;
    const px = (cx + ((ex - cx) / d) * r).toFixed(1);
    const py = (cy + ((ay - cy) / d) * r).toFixed(1);
    const kind = el.dataset.lbl;
    out += `<polyline class="k-${kind}" points="${px},${py} ${ex},${ay} ${ax},${ay}" style="animation-delay:${i * 90}ms"/><circle class="k-${kind}" cx="${px}" cy="${py}" r="2.5"/>`;
  });
  svg.innerHTML = out;
}

addEventListener('resize', () => {
  if (session && ui.tab === 'state') layoutOrb(app);
});

function stateView() {
  const { state } = session;
  const list = supports();
  const now = new Date();
  const todayKey = dayKey(now);
  const doneToday = completionIndex();
  if (!list.length) {
    return `<div class="section-h">Состояние</div>

const STOPWORDS = new Set(['на', 'за', 'для', 'и', 'в', 'во', 'от', 'по', 'с', 'со', 'к', 'у', 'тг', 'тенге']);
const money = (n) => `${fmt(Math.round(n))} ₸`;

const fin = () => session.state.finance;
const dayStart = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();

/** «кофе 1500», «такси 2к», «1 500 продукты» → { amount, text }; null — если суммы нет. */
function parseExpense(raw) {
  const re = /(\d[\d\s]*(?:[.,]\d+)?)\s*(к|k|тыс\.?)?(?![a-zа-яё])/gi;
  let best = null;
  for (const m of raw.matchAll(re)) {
    let amount = parseFloat(m[1].replace(/\s/g, '').replace(',', '.'));
    if (m[2]) amount *= 1000;
    if (amount > 0 && (!best || amount > best.amount)) best = { amount: Math.round(amount), index: m.index, len: m[0].length };
  }
  if (!best) return null;
  const text = (raw.slice(0, best.index) + ' ' + raw.slice(best.index + best.len))
    .replace(/₸/g, ' ')
    .replace(/(^|\s)(тг|тенге)(?=\s|$)/gi, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .replace(/^(на|за)\s+/i, '');
  return { amount: best.amount, text: text || 'Трата' };
}

function tokens(text) {
  return text.toLowerCase().split(/[^a-zа-яё0-9-]+/i).filter((w) => w.length >= 3 && !STOPWORDS.has(w));
}

/** Категория по выученным словам, затем по словарю; null — если не понятно. */
function guessCategory(text) {
  const { rules } = fin();
  for (const w of tokens(text)) if (rules[w]) return rules[w];
  const low = ` ${text.toLowerCase()} `;
  for (const c of FIN_CATS) if (c.words.some((w) => low.includes(w))) return c.id;
  return null;
}

function learnCategory(text, cat) {
  const [first] = tokens(text);
  if (first) fin().rules[first] = cat;
}

function finBudget() {
  const f = fin();
  return { expected: f.expected || 0, fixed: f.fixed.reduce((a, x) => a + x.amount, 0), savePct: f.savePct };
}

/** Сколько потрачено за [from, to) без обязательных платежей. */
function spentBetween(from, to, except) {
  return fin().expenses.reduce((a, e) => a + (!e.fixed && e !== except && e.at >= from && e.at < to ? e.amount : 0), 0);
}

function daysInMonth(d) {
  return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
}

/** Сколько от поступления остаётся на жизнь после накоплений. */
const netIncome = (amount) => Math.round(amount * (1 - (fin().savePct + (fin().joyPct || 0)) / 100));

function incomesBetween(from, to, net) {
  return fin().incomes.reduce((a, i) => a + (i.at >= from && i.at < to ? (net && !i.adjust ? netIncome(i.amount) : i.amount) : 0), 0);
}

/** Обязательные платежи, списанные к моменту t: каждый месяц в его начале, в первый — пропорционально дням. */
function fixedChargedBy(t) {
  const f = fin();
  const total = finBudget().fixed;
  if (!total || !f.since) return 0;
  const since = new Date(f.since);
  let sum = 0;
  for (let m = new Date(since.getFullYear(), since.getMonth(), 1); m.getTime() <= t; m = new Date(m.getFullYear(), m.getMonth() + 1, 1)) {
    const days = daysInMonth(m);
    const first = m.getFullYear() === since.getFullYear() && m.getMonth() === since.getMonth();
    sum += first ? Math.round((total * (days - since.getDate() + 1)) / days) : total;
  }
  return sum;
}

/** Свободные деньги к моменту t. */
function availableAt(t) {
  return incomesBetween(0, t, true) - fixedChargedBy(t) - spentBetween(0, t);
}

/** Лимит на день date (или null, если поступлений ещё не было). */
function dayLimit(date) {
  if (!fin().incomes.length) return null;
  const from = dayStart(date);
  const pool = availableAt(from) + incomesBetween(from, dayStart(addDays(date, 1)), true);
  const left = daysInMonth(date) - date.getDate() + 1;
  return Math.max(0, Math.round(pool / left));
}

function limitsNow() {
  const now = new Date();
  const L = dayLimit(now);
  if (L === null) return null;
  const today = dayStart(now);
  const tomorrow = dayStart(addDays(now, 1));
  const spentToday = spentBetween(today, tomorrow);
  const weekFrom = dayStart(addDays(now, -((now.getDay() + 6) % 7)));
  const daysLeftMonth = daysInMonth(now) - now.getDate() + 1;
  const daysLeftWeek = Math.min(7 - ((now.getDay() + 6) % 7), daysLeftMonth);
  const spentWeekBefore = spentBetween(weekFrom, today);
  const monthFrom = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const spentMonthBefore = spentBetween(monthFrom, today);
  return {
    today: { limit: L, spent: spentToday },
    week: { limit: spentWeekBefore + L * daysLeftWeek, spent: spentWeekBefore + spentToday },
    month: { limit: spentMonthBefore + L * daysLeftMonth, spent: spentMonthBefore + spentToday },
    free: availableAt(Date.now() + 1),
  };
}

function incomesThisMonth() {
  const now = new Date();
  return incomesBetween(new Date(now.getFullYear(), now.getMonth(), 1).getTime(), dayStart(addDays(now, 1)), false);
}

function addIncome(raw) {
  const parsed = parseExpense(raw);

  const f = fin();
  const inc = { id: uid(), at: Date.now(), amount: parsed.amount, text: parsed.text === 'Трата' ? 'Поступление' : parsed.text };
  f.incomes.push(inc);
  if (!f.since) f.since = inc.at;
  save();
  render();
  Sound.play('quest');
  haptic([20, 40, 20]);
  const lim = limitsNow();
  const saved = Math.round((inc.amount * f.savePct) / 100);
  const joy = Math.round((inc.amount * (f.joyPct || 0)) / 100);
  toast({
    title: '[Поступление]',
    main: `+${money(inc.amount)}`,
    sub: `${saved ? `в накопления ${money(saved)} · ` : ''}${joy ? `в фонд радостей ${money(joy)} · ` : ''}на сегодня можно ${money(Math.max(0, lim.today.limit - lim.today.spent))}`,
    kind: 'up',
    ms: 5000,
  });
  return true;
}

    const amount = Math.round(Number(el.amount.value));
    if (!(amount > 0)) return sheetError(root, 'Укажите сумму.');
    if (el.date.value && el.date.value !== dayKey(d)) {
      const [y, m, dd] = el.date.value.split('-').map(Number);
      inc.at = new Date(y, m - 1, dd, 12).getTime();
    }
    Object.assign(inc, { text: el.text.value.trim() || inc.text, amount });
    if (f.since && inc.at < f.since) f.since = inc.at;
    save();
    closeSheet();
    render();
  });
  const del = root.querySelector('[data-action="delete"]');
  del.addEventListener('click', () => confirmPress(del, 'Точно удалить? Нажмите ещё раз', () => {
    f.incomes = f.incomes.filter((x) => x !== inc);
    save();
    closeSheet();
    render();
  }));
}

/** Превысила ли трата лимит своего дня. */
function computeOverLimit(e) {
  const d = new Date(e.at);
  const L = dayLimit(d);
  if (L === null) return false;
  const before = spentBetween(dayStart(d), e.at, e);
  return before + e.amount > L;
}

function expenseVerdict(e) {
  if (e.cat === 'unknown') return { icon: '❔', grade: 'meh', text: 'Неучтённая трата — нашлась при сверке' };
  if (e.fixed) return { icon: '📌', grade: 'fixed', text: 'Обязательный платёж — уже в бюджете' };
  if (e.cls === 'need') return { icon: '✅', grade: 'ok', text: 'Грамотная: необходимое' };
  if (e.cls === 'invest' && e.overLimit) return { icon: '⚠️', grade: 'meh', text: 'Вклад, но сверх лимита — убедись, что окупится' };
  if (e.cls === 'invest') return { icon: '✅', grade: 'ok', text: 'Грамотная: вклад в себя и дело' };
  if (e.overLimit) return { icon: '❌', grade: 'bad', text: 'Слив: хотелка сверх лимита' };
  if (e.planned === false) return { icon: '⚠️', grade: 'meh', text: 'Спорная: импульсивная хотелка' };
  if (e.planned === true) return { icon: '✅', grade: 'ok', text: 'В рамках: запланированная хотелка' };
  return { icon: '⚠️', grade: 'meh', text: 'Спорная: хотелка' };
}

function addExpense(raw) {
  if (/^\s*\+/.test(raw)) return addIncome(raw.replace(/^\s*\+/, ''));
  const parsed = parseExpense(raw);
  if (!parsed) return false;
  const f = fin();
  const cat = guessCategory(parsed.text);
  const e = {
    id: uid(),
    at: Date.now(),
    amount: parsed.amount,
    text: parsed.text,
    cat: cat || 'other',
    cls: FIN_CAT[cat || 'other'].cls,
    planned: null,
    fixed: false,
    asked: { cat: !!cat },
  };
  e.overLimit = computeOverLimit(e);
  f.expenses.push(e);
  delete f.noSpend[dayKey(new Date())];
  save();
  render();
  askNext(e);
  return true;
}

/** Задаёт следующий нужный вопрос или подводит итог. */
function askNext(e) {
  const f = fin();
  const ask = (question, options, onAnswer, cats) => {
    clearToasts(); // уведомления о прошлых тратах не должны закрывать вопрос
    const root = openSheet('Уточнение', `
      <p class="lead">${esc(e.text)} · ${money(e.amount)}</p>
      <p class="dim center">${question}</p>
      <div class="q-options${cats ? ' cats' : ''}">${options.map((o, i) => `<button class="btn" type="button" data-opt="${i}">${o.label}</button>`).join('')}</div>
      <button class="btn ghost" type="button" data-skip>Пропустить</button>`);
    root.querySelector('[data-skip]').addEventListener('click', () => {
      closeSheet();
      finishExpense(e);
    });
    root.querySelectorAll('[data-opt]').forEach((b) => b.addEventListener('click', () => {
      onAnswer(options[Number(b.dataset.opt)].value);
      closeSheet();
      save();
      askNext(e);
    }));
  };
  if (!e.asked.cat) {
    e.asked.cat = true;
    return ask('На что это? Запомню на будущее.', FIN_CATS.filter((c) => !['other', 'unknown', 'savings'].includes(c.id)).map((c) => ({ label: c.name, value: c.id })).concat({ label: 'Другое', value: 'other' }), (v) => {
      e.cat = v;
      e.cls = FIN_CAT[v].cls;
      if (v !== 'other') learnCategory(e.text, v);
    }, true);
  }
  if (e.cat === 'tech' && !e.asked.purpose) {
    e.asked.purpose = true;
    return ask('Это для дела или для себя?', [{ label: 'Для дела', value: 'invest' }, { label: 'Для себя', value: 'want' }], (v) => { e.cls = v; });
  }
  if (f.fixed.length && ['home', 'connect', 'subs'].includes(e.cat) && !e.asked.fixed) {
    e.asked.fixed = true;
    return ask(`Это обязательный платёж из бюджета (${f.fixed.map((x) => esc(x.title)).join(', ')})?`, [{ label: 'Да, обязательный', value: true }, { label: 'Нет, отдельная трата', value: false }], (v) => { e.fixed = v; });
  }
  if (e.cls === 'want' && !e.fixed && !e.asked.planned) {
    e.asked.planned = true;
    return ask('Это было запланировано?', [{ label: 'Да, запланировано', value: true }, { label: 'Нет, импульсивно', value: false }], (v) => { e.planned = v; });
  }
  if (e.cls === 'want' && !e.fixed && (e.planned === false || e.overLimit) && !e.asked.why) {
    e.asked.why = true;
    return ask('Что подтолкнуло? Честно — Система подберёт замену, а не запрет.', Object.entries(WHY).map(([id, w]) => ({ label: w.label, value: id })), (v) => { e.why = v; }, true);
  }
  finishExpense(e);
}

function finishExpense(e) {
  if (!session) return;
  if (e.cat === 'groceries' && e.amount >= 2000) groceryTripDone(true);
  const v = expenseVerdict(e);
  const lim = limitsNow();
  const left = lim ? lim.today.limit - lim.today.spent : null;
  save();
  render();
  if (v.grade === 'ok') Sound.play('quest');
  else if (v.grade === 'bad') Sound.play('undo');
  const x = !e.fixed && activeExperiment(e.cat);
  const xs = x ? experimentSpent(x) : 0;
  toast({
    title: '[Трата записана]',
    main: `${v.icon} −${money(e.amount)} · ${FIN_CAT[e.cat].name}`,
    sub: `${v.text}${left !== null ? ` · ${left >= 0 ? `осталось на сегодня ${money(left)}` : `сверх лимита на ${money(-left)}`}` : ''}${x ? ` · эксперимент: ${money(xs)} из ${money(x.cap)}${xs > x.cap ? ' — потолок пробит' : ''}` : ''}`,
    kind: v.grade === 'bad' || (x && xs > x.cap) ? 'minus' : undefined,
    action: e.why && !x ? { label: 'Чем заменить', run: () => openSwaps(e.cat, e.why) } : undefined,
    ms: e.why && !x ? 8000 : 5000,
  });
  if (v.grade === 'bad') markSpendDrain();
}

/** Трата-слив отмечается и в сливах энергии на вкладке «Состояние». */
function markSpendDrain() {
  const { state } = session;
  let drain = state.drains.find((d) => d.id === 'finance-impulse');
  if (!drain) {
    drain = { id: 'finance-impulse', title: 'Трата-слив' };
    state.drains.push(drain);
  }
  const key = dayKey(new Date());
  const day = dayData(key);
  if (!day.drains.includes(drain.id)) {
    setDayData(key, { drains: day.drains.concat(drain.id) });
    save();
  }
}

function toggleNoSpend() {
  const key = dayKey(new Date());
  const f = fin();
  if (f.noSpend[key]) delete f.noSpend[key];
  else f.noSpend[key] = true;
  save();
  render();
  if (f.noSpend[key]) toast({ title: 'Финансы', main: 'День без трат', sub: 'Завтра Система засчитает его опытом', kind: 'up', ms: 3500 });
}

/** Награды за прошедшие дни: день в лимите или без трат даёт опыт; проверка один раз на день. */
function checkFinanceRewards() {
  if (!session) return;
  const { state } = session;
  const f = fin();
  if (!f.incomes.length) return;
  const discipline = state.stats.find((st) => st.name === 'Дисциплина');
  const now = new Date();
  let gained = 0;
  for (let i = 1; i <= 7; i++) {
    const d = addDays(now, -i);
    const key = dayKey(d);
    if (key in f.checked) continue;
    const from = dayStart(d);
    const to = dayStart(addDays(d, 1));
    if (f.since && from < dayStart(new Date(f.since))) break; // до того, как задан бюджет, дни не оцениваем
    const any = f.expenses.some((e) => e.at >= from && e.at < to);
    if (!any && !f.noSpend[key]) continue; // день не вели — ни награды, ни штрафа
    const ok = spentBetween(from, to) <= dayLimit(d);
    f.checked[key] = ok;
    if (!ok) continue;
    const type = f.noSpend[key] ? 'normal' : 'chore';
    const xp = state.settings.xp[type];
    state.log.push({
      id: uid(),
      questId: null,
      title: f.noSpend[key] ? 'День без трат' : 'День в финансовом лимите',
      type,
      xp,
      stats: discipline ? { [discipline.id]: xp } : {},
      period: null,
      at: to - 60000,
      source: 'finance',
    });
    gained += xp;
  }
  state.log.sort((a, b) => a.at - b.at);
  save();
  if (gained) toast({ title: 'Финансы', main: `+${fmt(gained)} XP`, sub: 'За дни в лимите', kind: 'up', ms: 4500 });
}

function finStreak() {
  const f = fin();
  let n = 0;
  for (let i = 1; i <= 365; i++) {
    if (f.checked[dayKey(addDays(new Date(), -i))] !== true) break;
    n++;
  }
  return n;
}

function limitRow(label, part) {
  const pct = part.limit ? (part.spent / part.limit) * 100 : part.spent ? 100 : 0;
  const cls = pct > 100 ? ' over' : pct > 80 ? ' near' : '';
  return `<div class="fin-row-limit${cls}">
      <div class="fin-head"><span>${label}</span><span>${money(part.spent)} / ${money(part.limit)}</span></div>
      <span class="fin-bar"><i data-pct="${Math.min(100, pct).toFixed(1)}"></i></span>
    </div>`;
}

function incomeRow(i) {
  const d = new Date(i.at);
  return `<button class="exp-row" type="button" data-inc="${i.id}">
      <span class="ic">💰</span><span class="t">${esc(i.text)}</span><span class="a" style="color:var(--ok)">+${money(i.amount)}</span>
      <span class="m">${d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' })}${fin().savePct ? ` · в накопления ${money((i.amount * fin().savePct) / 100)}` : ''}${fin().joyPct ? ` · в фонд ${money((i.amount * fin().joyPct) / 100)}` : ''}</span>

}

function expenseRow(e) {

  return `<button class="exp-row" type="button" data-exp="${e.id}">

      <span class="m">${time}${e.reconciled ? ' · сверка' : ''} · ${FIN_CAT[e.cat].name} · ${e.fixed ? 'обязательный' : FIN_CLASS[e.cls]}${e.planned === false ? ' · импульсивно' : ''}</span>

function financeView() {

      <button class="btn ghost" type="button" data-action="fin-budget">Обязательные платежи и накопления</button>`;
  } else {

        <div class="fin-left"><small>${left >= 0 ? 'Можно потратить сегодня' : 'Сверх лимита сегодня'}</small><b>${money(Math.abs(left))}</b>
          <span>${lim.free < 0 ? `Поступлений не хватает на обязательные платежи: ${money(-lim.free)}` : left >= 0 ? 'Сэкономишь — завтра лимит вырастет' : 'Завтрашний лимит уменьшится, чтобы деньги дотянули до конца месяца'}</span></div>

  return `<form class="panel fin-input" data-fin-form novalidate>

      <button class="btn" type="submit" aria-label="Записать трату">+</button>
    </form>
    <p class="error" data-fin-error></p>
    ${limits}
    ${balanceHtml()}
    ${groceryHtml()}

    <div class="section-h">Сегодня <span class="count">${todayList.length ? money(total(todayList)) : ''}</span></div>

      ? `<div class="panel log-list">${todayList.map(expenseRow).join('')}</div>`
      : `<div class="panel empty">Трат сегодня нет.</div>
         <button class="btn${f.noSpend[todayKey] ? ' gold' : ''}" type="button" data-action="fin-nospend">${f.noSpend[todayKey] ? '✓ Сегодня без трат' : 'Сегодня без трат'}</button>`}

    <div class="section-h">Поступления <span class="count">${money(incomesThisMonth())}</span></div>
    <div class="panel pad">

        <span class="fin-bar" style="--fc:var(--ok)"><i data-pct="${Math.min(100, (incomesThisMonth() / b.expected) * 100).toFixed(1)}"></i></span></div>` : ''}
      ${incomes.length ? `<div class="log-list" style="padding:0">${incomes.map(incomeRow).join('')}</div>` : '<p class="hint" style="margin:12px 0 0">В этом месяце поступлений пока нет. Впиши «+сумма» в строку сверху.</p>'}

          <span class="fin-bar"><i data-pct="${((sum / maxCat) * 100).toFixed(1)}"></i></span></div>`).join('')}`

function wireFinance(view) {
  const form = view.querySelector('[data-fin-form]');
  const input = form.elements.namedItem('exp');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const raw = input.value.trim();
    if (!raw) return;
    if (!addExpense(raw)) {
      view.querySelector('[data-fin-error]').textContent = 'Не вижу суммы. Пример: «кофе 1500», «такси 2к» или «+150к клиент».';
      return;
    }
  });
}

      <button type="button" data-remove aria-label="Удалить">×</button></div>`;
  const root = openSheet('Бюджет', `
    <form novalidate>
      <p class="dim center">Лимиты считаются от реальных поступлений. Здесь — то, что из них уходит в первую очередь.</p>
      <div class="field"><span>Обязательные платежи в месяц</span>
        <div data-rows>${f.fixed.map(row).join('')}</div>
        <button class="btn ghost" type="button" data-add style="margin-top:4px">+ Платёж</button>
        <div class="hint">Аренда, связь, кредиты — то, что платится в любом случае. Их не нужно вносить как траты.</div>
      </div>
      <div class="field"><span>Фонд радостей</span>
        <div class="choices">${[0, 3, 5, 10].map((n) => `<label class="choice"><input type="radio" name="joy" value="${n}"${(f.joyPct || 0) === n ? ' checked' : ''}><span>${n}%</span></label>`).join('')}</div>
        <div class="hint">Доля поступлений на награды из магазина: шопинг, Лего. Эти деньги уже вычтены из лимитов.</div>
      </div>
      <div class="field"><span>Откладывать</span>
        <div class="choices">${[0, 5, 10, 15, 20].map((n) => `<label class="choice"><input type="radio" name="save" value="${n}"${f.savePct === n ? ' checked' : ''}><span>${n}%</span></label>`).join('')}</div>
      </div>
      <label class="field"><span>Ожидаемый доход в месяц, ₸</span><input name="expected" type="number" inputmode="numeric" min="0" step="1" value="${f.expected || ''}" placeholder="300000"></label>
      <div class="hint">Необязательно: цель, с которой сравниваются поступления месяца.</div>
      <p class="lead" data-free style="margin-top:18px"></p>
      <p class="error" data-error></p>
      <button class="btn" type="submit">Сохранить</button>
      <button class="btn ghost" type="button" data-action="close">Отмена</button>
    </form>`);
  const form = root.querySelector('form');
  const rows = root.querySelector('[data-rows]');
  const read = () => ({
    expected: Math.max(0, Math.round(Number(form.elements.expected.value)) || 0),
    savePct: Number(form.elements.save.value) || 0,
    joyPct: Number(form.elements.joy.value) || 0,
    fixed: [...rows.querySelectorAll('.row-fields')].map((r) => {
      const [t, a] = r.querySelectorAll('input');
      return { id: r.dataset.row || uid(), title: t.value.trim(), amount: Math.max(0, Math.round(Number(a.value)) || 0) };
    }).filter((x) => x.title && x.amount),
  });
  const freeEl = root.querySelector('[data-free]');
  const update = () => {
    const v = read();
    const free = Math.max(0, v.expected - v.fixed.reduce((a, x) => a + x.amount, 0) - Math.round((v.expected * (v.savePct + v.joyPct)) / 100));
    const now = new Date();
    freeEl.innerHTML = v.expected ? `Если придёт ожидаемое — свободно <span class="hl">${money(free)}</span><br><span class="dim">≈ ${money(free / daysInMonth(now))} в день</span>` : '';
  };
  form.addEventListener('input', update);
  form.addEventListener('change', update);
  rows.addEventListener('click', (e) => { if (e.target.closest('[data-remove]')) { e.target.closest('.row-fields').remove(); update(); } });
  root.querySelector('[data-add]').addEventListener('click', () => { rows.insertAdjacentHTML('beforeend', row(null)); rows.lastElementChild.querySelector('input').focus(); });
  update();
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const v = read();
    Object.assign(f, v);
    if (!f.since) f.since = Date.now(); // первый месяц считается с этого дня
    for (const x of f.expenses) x.overLimit = computeOverLimit(x);
    save();
    closeSheet();
    render();
  });
}

/* ---------- Дофаминовое меню ----------
   Блюда: закуски (2–5 мин), основные (наполняют), гарниры (к скучным делам), десерты (лента и т. п. — за золото
   и с таймером), спецпредложения (большие награды — за золото и деньги из фонда радостей).
   Золото начисляется за весь опыт, кроме пролога: 1 🪙 за 5 XP. После блюда — оценка «помогло?»,
   по ней меню учится, что реально работает. */

const GOLD_RATE = 5;
const MENU_SECTIONS = {
  starter: { name: 'Закуски', one: 'Закуска', hint: '2–5 минут, быстрая подзарядка' },
  main: { name: 'Основные', one: 'Основное', hint: 'То, что реально наполняет' },
  side: { name: 'Гарниры', one: 'Гарнир', hint: 'Добавить к скучному делу' },
  dessert: { name: 'Десерты', one: 'Десерт', hint: 'Дешёвый дофамин — за золото и с таймером' },
  special: { name: 'Спецпредложения', one: 'Награда', hint: 'Большие радости — в магазине наград' },
};
const MENU_PRESET = [
  { title: 'Три трека и подвигаться', section: 'starter', minutes: 5, evening: true },
  { title: 'Холодная вода в лицо', section: 'starter', minutes: 2, evening: false },
  { title: 'Выйти на воздух', section: 'starter', minutes: 5, evening: true },
  { title: 'Растяжка лёжа', section: 'starter', minutes: 5, evening: true },
  { title: 'Голосовое близкому человеку', section: 'starter', minutes: 3, evening: true },
  { title: 'Прогулка', section: 'main', minutes: 20, evening: true },
  { title: 'Время наедине без телефона', section: 'main', minutes: 20, evening: true },
  { title: 'Ванна с подкастом или музыкой', section: 'main', minutes: 30, evening: true },
  { title: 'Снять ролик для блога', section: 'main', minutes: 40, evening: false },
  { title: 'Танцы', section: 'main', minutes: 30, evening: false },
  { title: 'Перебрать гардероб и собрать образы', section: 'main', minutes: 30, evening: true },
  { title: 'Новый маршрут прогулки', section: 'main', minutes: 40, evening: false },
  { title: 'Один фильм вместо ленты', section: 'main', minutes: 100, evening: true },
  { title: 'Плейлист под задачу', section: 'side', minutes: 0, evening: false },
  { title: 'Подкаст под рутину', section: 'side', minutes: 0, evening: false },
  { title: 'Работать в кофейне', section: 'side', minutes: 0, evening: false },
  { title: 'Созвон-коворкинг с другом', section: 'side', minutes: 0, evening: false },
  { title: 'Лента Reels / TikTok', section: 'dessert', minutes: 15, evening: true, price: 10 },
  { title: 'YouTube', section: 'dessert', minutes: 20, evening: true, price: 10 },
  { title: 'Игра', section: 'dessert', minutes: 30, evening: true, price: 15 },
  { title: 'Шопинг-вечер', section: 'special', minutes: 0, evening: false, price: 250, kzt: 0 },
  { title: 'Набор Лего', section: 'special', minutes: 0, evening: false, price: 400, kzt: 0 },
];
const EVENING_PRESET = [
  { title: 'Ванна или душ' },
  { title: '15 минут без телефона: прогулка или наедине' },
  { title: 'Выгрузить мысли', dump: true },
  { title: 'Телефон на зарядку подальше от кровати' },
];
const NEEDS = {
  tired: { title: 'Нет сил', sections: ['starter', 'main'] },
  stuck: { title: 'Не могу начать', sections: ['starter', 'side'] },
  rest: { title: 'Хочу отдохнуть', sections: ['main', 'dessert'] },
  anxiety: { title: 'Лёгкое блюдо', sections: ['starter', 'main'] },
};

let activeTimer = null;

const menu = () => session.state.menu;
const menuItem = (id) => menu().items.find((i) => i.id === id);
const entryGold = (e) => (e.source === 'prologue' ? 0 : Math.round(e.xp / GOLD_RATE));
const minToTime = (m) => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;

function goldBalance() {
  const { log, purchases } = session.state;
  return log.reduce((a, e) => a + entryGold(e), 0) - purchases.reduce((a, x) => a + (x.gold || 0), 0);
}

/** Деньги фонда радостей: доля поступлений минус покупки наград. */
function joyFund() {
  const f = fin();
  const inflow = f.incomes.reduce((a, i) => a + (i.adjust ? 0 : (i.amount * (f.joyPct || 0)) / 100), 0);
  return Math.round(inflow - session.state.purchases.reduce((a, x) => a + (x.kzt || 0), 0));
}

/** Среднее «помогло»: от −1 (хуже) до 1 (лучше). */
function itemEffect(it) {
  return it.ratings.length ? it.ratings.reduce((a, r) => a + r.v, 0) / it.ratings.length : 0;
}

function itemMeta(it) {
  const parts = [];
  if (it.minutes) parts.push(`${it.minutes} мин`);
  if (it.evening) parts.push('🌙 вечер');
  if (it.ratings.length) parts.push(`помогло ${it.ratings.filter((r) => r.v > 0).length} из ${it.ratings.length}`);
  return parts.join(' · ');
}

function isEvening(now = new Date()) {
  const m = now.getHours() * 60 + now.getMinutes();
  return m >= session.state.evening.start || m < 4 * 60;
}

/** Ключ вечера: после полуночи — ещё вчерашний вечер. */
function eveningKey(now = new Date()) {
  return dayKey(now.getHours() < 4 ? addDays(now, -1) : now);
}

function candidates(need) {
  const ev = isEvening();
  let list = menu().items.filter((i) => NEEDS[need].sections.includes(i.section));
  if (ev || need === 'anxiety' || need === 'tired') {
    const light = list.filter((i) => i.evening);
    if (light.length) list = light;
  }
  return list.filter((i) => !(i.ratings.length >= 3 && itemEffect(i) < -0.3)); // то, что стабильно не помогает, не предлагаем
}

function pickWeighted(list, excludeId) {
  const pool = list.length > 1 ? list.filter((i) => i.id !== excludeId) : list;
  const now = Date.now();
  const weights = pool.map((i) => 1 + Math.max(0, itemEffect(i)) * 2 + (!i.lastAt || now - i.lastAt > 3 * 864e5 ? 0.5 : 0));
  let r = Math.random() * weights.reduce((a, w) => a + w, 0);
  for (let k = 0; k < pool.length; k++) if ((r -= weights[k]) <= 0) return pool[k];
  return pool[pool.length - 1];
}

function openNeedSheet() {
  if (!session) return;
  const root = openSheet('Мне нужно…', `
    <div class="q-options">
      <button class="btn danger" type="button" data-need="anxiety">Я загоняюсь</button>
      <button class="btn" type="button" data-need="tired">Нет сил</button>
      <button class="btn" type="button" data-need="stuck">Не могу начать</button>
      <button class="btn" type="button" data-need="rest">Хочу отдохнуть</button>
      ${isEvening() ? '<button class="btn gold" type="button" data-need="evening">Вечерний ритуал</button>' : ''}
    </div>
    <p class="hint center" style="margin-top:12px">У тебя 🪙 ${fmt(goldBalance())}</p>
    <button class="btn ghost" type="button" data-action="close">Закрыть</button>`);
  root.querySelectorAll('[data-need]').forEach((b) => b.addEventListener('click', () => {
    const need = b.dataset.need;
    if (need === 'anxiety') return startAnxietyFlow();
    if (need === 'evening') return openEveningFlow();
    openSuggestion(need);
  }));
}

/** Система предлагает одно блюдо — с прокруткой, как слот. */
function openSuggestion(need, prevId) {
  const list = candidates(need);
  if (!list.length) {
    openSheet(NEEDS[need].title, `<p class="lead">Под это в меню пока пусто.</p><p class="dim center">Добавь блюда во вкладке «Состояние» → «Дофаминовое меню».</p>
      <button class="btn ghost" type="button" data-action="close">Закрыть</button>`);
    return;
  }
  const item = pickWeighted(list, prevId);
  const root = openSheet(NEEDS[need].title, `
    <div class="slot spinning" data-slot>…</div>
    <p class="dim center" data-meta>&nbsp;</p>
    <button class="btn" type="button" data-take-now disabled>Беру</button>
    <button class="btn ghost" type="button" data-other>Другое</button>
    <button class="btn ghost" type="button" data-action="close">Не сейчас</button>`);
  const slot = root.querySelector('[data-slot]');
  const take = root.querySelector('[data-take-now]');
  const land = () => {
    if (!slot.isConnected) return;
    slot.textContent = item.title;
    slot.className = 'slot landed';
    const price = item.section === 'dessert' ? item.price || 0 : 0;
    const meta = [MENU_SECTIONS[item.section].one, itemMeta(item), price ? `цена ${price} 🪙` : ''].filter(Boolean).join(' · ');
    root.querySelector('[data-meta]').textContent = meta;
    if (price > goldBalance()) {
      take.textContent = `Не хватает 🪙: нужно ${price}`;
    } else {
      take.disabled = false;
    }
  };
  if (reducedMotion.matches) land();
  else {
    let n = 0;
    const spin = setInterval(() => {
      if (!slot.isConnected) return clearInterval(spin);
      slot.textContent = list[Math.floor(Math.random() * list.length)].title;
      if (++n >= 12) { clearInterval(spin); land(); haptic(10); }
    }, 70);
  }
  take.addEventListener('click', () => takeItem(item));
  root.querySelector('[data-other]').addEventListener('click', () => openSuggestion(need, item.id));
}

function takeItem(item) {
  if (!item || !session) return;
  const { state } = session;
  if (item.section === 'special') return buySpecial(item.id);
  if (item.section === 'dessert') {
    const price = item.price || 0;
    if (price > goldBalance()) return toast({ title: 'Десерт', main: 'Не хватает золота', sub: `Нужно ${price} 🪙 — сделай квест или опору`, kind: 'minus' });
    state.purchases.push({ id: uid(), at: Date.now(), itemId: item.id, title: item.title, gold: price, kzt: 0, kind: 'dessert' });
  }
  const now = Date.now();
  state.menu.active = { itemId: item.id, title: item.title, section: item.section, startedAt: now, until: item.minutes ? now + item.minutes * 60000 : null };
  item.lastAt = now;
  save();
  closeSheet();
  render();
  Sound.play('quest');
  toast({
    title: MENU_SECTIONS[item.section].one,
    main: item.title,
    sub: item.section === 'side' ? 'Включай — и берись за задачу' : item.minutes ? `Таймер: ${item.minutes} мин${item.price ? ` · −${item.price} 🪙` : ''}` : 'Нажми «Готово», когда закончишь',
    kind: 'up',
    ms: 3500,
  });
}

function activeHtml() {
  const a = session.state.menu.active;
  if (!a) return '';
  return `<div class="panel active-item" data-active>
      <div><small>Сейчас · ${MENU_SECTIONS[a.section].one}</small><b>${esc(a.title)}</b><span data-timer></span></div>
      <button class="btn" type="button" data-action="active-done">Готово</button>
    </div>`;
}

/** Раз в секунду обновляет таймер активного блюда и сообщает, когда время вышло. */
function tickActive() {
  if (!session) return;
  const a = session.state.menu.active;
  const box = app.querySelector('[data-active]');
  if (!a || !box) return;
  const el = box.querySelector('[data-timer]');
  if (!a.until) { el.textContent = 'без таймера'; return; }
  const left = a.until - Date.now();
  const mmss = (ms) => `${Math.floor(ms / 60000)}:${pad(Math.floor((ms % 60000) / 1000))}`;
  box.classList.toggle('over', left < 0);
  el.textContent = left >= 0 ? `осталось ${mmss(left)}` : `время вышло · +${mmss(-left)}`;
  if (left < 0 && !a.notified) {
    a.notified = true;
    save();
    Sound.play('undo');
    haptic([40, 60, 40]);
    toast({ title: 'Таймер', main: `${a.title}: время вышло`, sub: 'Закончи и отметь «Готово»', kind: 'minus', ms: 6000 });
  }
}

function finishActive() {
  const { state } = session;
  const a = state.menu.active;
  if (!a) return;
  const over = a.until ? Date.now() - a.until : 0;
  state.menu.active = null;
  if (a.section === 'dessert' && over > 5 * 60000) {
    // пересидел десерт — это уже слив
    let drain = state.drains.find((d) => d.id === 'dessert-over');
    if (!drain) state.drains.push((drain = { id: 'dessert-over', title: 'Пересидел десерт' }));
    const key = dayKey(new Date());
    const day = dayData(key);
    if (!day.drains.includes(drain.id)) setDayData(key, { drains: day.drains.concat(drain.id) });
    toast({ title: 'Десерт', main: `Пересидел на ${Math.round(over / 60000)} мин`, sub: 'Отмечено в сливах энергии. Без самобичевания — просто факт', kind: 'minus', ms: 5000 });
  }
  save();
  render();
  const item = menuItem(a.itemId);
  if (!item) return;
  const root = openSheet('Помогло?', `
    <p class="lead">${esc(item.title)}</p>
    <p class="dim center">Как ты сейчас? Система запомнит и будет чаще предлагать то, что работает.</p>
    <div class="q-options">
      <button class="btn" type="button" data-v="1">Лучше</button>
      <button class="btn" type="button" data-v="0">Так же</button>
      <button class="btn" type="button" data-v="-1">Хуже</button>
    </div>
    <button class="btn ghost" type="button" data-action="close">Пропустить</button>`);
  root.querySelectorAll('[data-v]').forEach((b) => b.addEventListener('click', () => {
    item.ratings.push({ at: Date.now(), v: Number(b.dataset.v) });
    save();
    closeSheet();
    render();
    if (b.dataset.v === '1') toast({ title: 'Меню', main: 'Запомнил: помогает', ms: 2500 });
  }));
}

/* ---------- «Я загоняюсь»: выгрузка → дыхание → лёгкое блюдо ---------- */

/** «сегодня в 12:00», «завтра в 12:00» или дата. */
function whenText(t) {
  const d = new Date(t);
  const time = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  if (dayKey(d) === dayKey(new Date())) return `сегодня в ${time}`;
  if (dayKey(d) === dayKey(addDays(new Date(), 1))) return `завтра в ${time}`;
  return `${d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' })} в ${time}`;
}

function nextReview(now = new Date()) {
  const r = session.state.evening.review;
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate(), Math.floor(r / 60), r % 60).getTime();
  return today - now.getTime() >= 2 * 3600000 ? today : addDays(new Date(today), 1).getTime() + (r % 60) * 60000 + Math.floor(r / 60) * 3600000;
}

function startAnxietyFlow(then) {
  const root = openSheet('Выгрузка', `
    <p class="dim center">Что крутится в голове? Пиши как есть, без порядка. Система сохранит (зашифровано), и вы вернётесь к этому в ${minToTime(session.state.evening.review)}.</p>
    <label class="field"><span>Мысли</span><textarea name="t" rows="6" maxlength="4000" placeholder="Всё, что крутится…"></textarea></label>
    <button class="btn" type="button" data-dump>Выгрузить</button>
    <button class="btn ghost" type="button" data-skip>Сразу к дыханию</button>`);
  const area = root.querySelector('textarea');
  area.focus();
  root.querySelector('[data-dump]').addEventListener('click', () => {
    const text = area.value.trim();
    if (text) {
      const reviewAt = nextReview();
      session.state.worries.push({ id: uid(), at: Date.now(), text, reviewAt, status: null });
      save();
      toast({ title: 'Выгрузка', main: 'Принято. Оно подождёт', sub: `Вернёмся ${whenText(reviewAt)}`, ms: 4000 });
    }
    breathing(then);
  });
  root.querySelector('[data-skip]').addEventListener('click', () => breathing(then));
}

/** Минута дыхания: вдох 4 с, задержка 4 с, выдох 6 с — четыре круга. */
function breathing(then) {
  const root = openSheet('Дыхание', `
    <div class="breath"><div class="breath-circle" data-circle></div><p class="breath-text" data-bt>Готовься</p></div>
    <p class="dim center" data-left>4 круга · меньше минуты</p>
    <button class="btn ghost" type="button" data-next>Дальше</button>`);
  const circle = root.querySelector('[data-circle]');
  const text = root.querySelector('[data-bt]');
  const left = root.querySelector('[data-left]');
  const phases = [['Вдох', 4, 1], ['Задержка', 4, 1], ['Выдох', 6, 0.55]];
  let round = 0;
  let k = 0;
  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    if (then) then();
    else openSuggestion('anxiety');
  };
  const step = () => {
    if (!circle.isConnected || done) return;
    if (k === phases.length) { k = 0; round++; }
    if (round === 4) { text.textContent = 'Хорошо'; haptic(20); return setTimeout(finish, 900); }
    const [label, sec, scale] = phases[k++];
    text.textContent = label;
    left.textContent = `круг ${round + 1} из 4`;
    circle.style.transitionDuration = `${sec}s`;
    circle.style.transform = `scale(${scale})`;
    setTimeout(step, sec * 1000);
  };
  setTimeout(step, 600);
  root.querySelector('[data-next]').addEventListener('click', finish);
}

function worriesDue() {
  const now = Date.now();
  return session.state.worries.filter((w) => !w.status && w.reviewAt <= now);
}

function worriesDueHtml() {
  const due = worriesDue();
  if (!due.length) return '';
  return `<div class="panel backup-banner"><p><b>Разбор мыслей</b>${due.length} ${plural(due.length, ['выгруженная мысль ждёт', 'выгруженные мысли ждут', 'выгруженных мыслей ждут'])} разбора. Часто половина уже не важна.</p>
      <button class="btn" type="button" data-action="worries">Разобрать</button></div>`;
}

function resolveWorry(id, how) {
  const { state } = session;
  const w = state.worries.find((x) => x.id === id);
  if (!w) return;
  if (how === 'later') {
    w.reviewAt = addDays(new Date(), 1).getTime();
  } else if (how === 'quest') {
    w.status = 'quest';
    state.quests.push({ id: uid(), createdAt: Date.now(), title: w.text.split('\n')[0].slice(0, 120), note: w.text.length > 120 ? w.text.slice(0, 1000) : '', type: 'normal', stats: [], repeat: 'none' });
    toast({ title: 'Разбор', main: 'Стало квестом', sub: 'Найдёшь во вкладке «Квесты»', kind: 'up', ms: 3000 });
  } else {
    w.status = 'dropped';
    toast({ title: 'Разбор', main: 'Отпущено', ms: 2500 });
  }
  save();
  render();
}

/* ---------- Вечерний ритуал ---------- */

function eveningProgress() {
  const ev = session.state.evening;
  const done = ev.done[eveningKey()] || [];
  const steps = ev.steps;
  const finished = session.state.log.some((e) => e.source === 'evening' && e.period === 'e:' + eveningKey());
  return { steps, done, finished, count: steps.filter((st) => done.includes(st.id)).length };
}

function eveningCardHtml() {
  if (!isEvening()) return '';
  const p = eveningProgress();
  return `<section class="panel evening-card">
      <small>Вечер · с ${minToTime(session.state.evening.start)}</small>
      <b>${p.finished ? 'Ритуал пройден. Отдыхай' : 'Посадочная полоса'}</b>
      <p>${p.finished ? 'Можно ничего не делать — ты своё отработал.' : `Шаг за шагом, без выбора. Пройдено ${p.count} из ${p.steps.length}.`}</p>

      <div class="btn-pair">

}

function openEveningFlow() {
  const { state } = session;
  const key = eveningKey();
  const p = eveningProgress();
  const i = p.steps.findIndex((st) => !p.done.includes(st.id));
  if (i < 0) return completeEvening();
  const st = p.steps[i];
  const mark = () => {
    state.evening.done[key] = (state.evening.done[key] || []).concat(st.id);
    save();
    render();
    openEveningFlow();
  };
  const root = openSheet('Вечер', `
    <p class="dim center">Шаг ${i + 1} из ${p.steps.length}</p>
    <div class="slot landed">${esc(st.title)}</div>
    ${st.dump ? '<p class="dim center">Выгрузи всё, что крутится, — вернёмся к этому завтра.</p>' : ''}
    <button class="btn" type="button" data-go>${st.dump ? 'Выгрузить мысли' : 'Готово'}</button>
    <button class="btn ghost" type="button" data-skip>Пропустить шаг</button>
    <button class="btn ghost" type="button" data-action="close">Потом</button>`);
  root.querySelector('[data-go]').addEventListener('click', () => (st.dump ? startAnxietyFlow(mark) : mark()));
  root.querySelector('[data-skip]').addEventListener('click', mark);
}

function completeEvening() {
  const { state } = session;
  const key = eveningKey();
  if (state.log.some((e) => e.source === 'evening' && e.period === 'e:' + key)) {
    closeSheet();
    return toast({ title: 'Вечер', main: 'Уже пройден', sub: 'Отдыхай', ms: 2500 });
  }
  const discipline = state.stats.find((st) => st.name === 'Дисциплина');
  const xp = state.settings.xp.normal;
  const entry = { id: uid(), questId: null, title: 'Вечерний ритуал', type: 'normal', xp, stats: discipline ? { [discipline.id]: xp } : {}, period: 'e:' + key, at: Date.now(), source: 'evening' };
  state.log.push(entry);
  save();
  closeSheet();
  render();
  Sound.play('levelUp');
  haptic([30, 60, 50]);
  toast({ title: 'Вечер пройден', main: `+${xp} XP · +${entryGold(entry)} 🪙`, sub: 'Ты сделал главное. Дальше — отдых', kind: 'up', ms: 5000 });
}
