const isLeakCat = (cat) => !['unknown', 'savings'].includes(cat);
const round100 = (n) => Math.round(n / 100) * 100;

function swapsFor(cat, why) {
  const fit = SWAPS.filter((x) => x.why.includes(why) && (!x.cats || x.cats.includes(cat)));
  const list = fit.filter((x) => x.cats).concat(fit.filter((x) => !x.cats)).slice(0, 3);
  if (list.length < 2) list.push(SWAPS.find((x) => x.text === 'Пауза 10 минут перед оплатой'));
  return [...new Set(list)];
}

/** Сколько обычно уходит на категорию в неделю (по последним 4 неделям или сколько есть записей). */
function weeklyUsual(cat) {
  const now = Date.now();
  const list = fin().expenses;
  if (!list.length) return 0;
  const days = Math.min(28, Math.max(7, (now - Math.min(...list.map((e) => e.at))) / 864e5)); // записи могут быть моложе 4 недель
  const sum = list.filter((e) => e.cat === cat && !e.fixed && e.at >= now - days * 864e5).reduce((a, e) => a + e.amount, 0);
  return Math.round((sum / days) * 7);
}

function spendPatterns() {
  const f = fin();
  const now = Date.now();
  const from = now - 30 * 864e5;
  const recent = f.expenses.filter((e) => e.at >= from && !e.fixed);
  if (!recent.length) return [];
  const total = recent.reduce((a, e) => a + e.amount, 0);
  const first = Math.min(...f.expenses.map((e) => e.at));
  const days = Math.min(30, Math.max(7, (now - first) / 864e5));
  const by = new Map();
  for (const e of recent) {
    if (e.cls !== 'want' || !isLeakCat(e.cat)) continue;
    if (!by.has(e.cat)) by.set(e.cat, []);
    by.get(e.cat).push(e);
  }
  const out = [];
  for (const [cat, items] of by) {
    const sum = items.reduce((a, e) => a + e.amount, 0);
    if (items.length < 3 && sum < total * 0.15) continue;
    out.push(analyzeLeak(cat, items, sum, total, days));
  }
  return out.sort((a, b) => b.sum - a.sum);
}

/** Факты о категории и догадка, почему так. */
function analyzeLeak(cat, items, sum, total, days) {
  const f = fin();
  const { state } = session;
  const n = items.length;
  const share = (pred) => items.filter(pred).length / n;
  const pct = (x) => Math.round(x * 100);
  const evStart = state.evening.start;
  const evening = share((e) => { const d = new Date(e.at); const m = d.getHours() * 60 + d.getMinutes(); return m >= evStart || m < 240; });
  const lowDay = share((e) => { const d = dayData(dayKey(new Date(e.at))); return (d.energy && d.energy <= 2) || d.drains.length >= 2; });
  const anxious = share((e) => state.worries.some((w) => Math.abs(w.at - e.at) < 6 * 3600000));
  const weekend = share((e) => [0, 6].includes(new Date(e.at).getDay()));
  const afterIncome = share((e) => f.incomes.some((i) => !i.adjust && i.at <= e.at && e.at - i.at < 2 * 864e5));
  const impulsive = share((e) => e.planned === false);
  const noFood = cat === 'cafe' ? share((e) => !f.expenses.some((g) => g.cat === 'groceries' && g.amount >= 2000 && g.at < e.at && e.at - g.at < food().tripDays * 864e5)) : 0;
  const whys = new Map();
  for (const e of items) if (e.why) whys.set(e.why, (whys.get(e.why) || 0) + 1);
  const topWhy = [...whys.entries()].sort((a, b) => b[1] - a[1])[0];
  const avg = sum / n;
  const month = round100((sum / days) * 30);

  const facts = [`${n} ${plural(n, ['раз', 'раза', 'раз'])} за ${Math.round(days)} дн. — ${money(sum)}, ${pct(sum / total)}% всех трат`];
  const hints = []; // [вес, причина]
  if (topWhy && topWhy[1] >= 2) { facts.push(`Ты сам отмечал: ${WHY[topWhy[0]].short} (${topWhy[1]} из ${n})`); hints.push([3, topWhy[0]]); }
  if (n < 3) {
    // одна-две крупные покупки: доли по ним ничего не говорят
    facts.push(`Крупная разовая трата — ${pct(sum / total)}% всех трат за месяц`);
    if (items.some((e) => e.why)) hints.push([3, items.find((e) => e.why).why]);
    return { cat, n, sum, month: round100(sum), facts, guess: hints.length ? hints[0][1] : WHY_BY_CAT[cat] || 'auto' };
  }
  if (avg < 3000 && n >= 6) facts.push(`Мелочь по ${money(avg)}, а за месяц набегает ~${money(month)}`);
  if (noFood >= 0.5) { facts.push(`${pct(noFood)}% — когда дома не было закупки продуктов`); hints.push([noFood * 2, 'hungry']); }
  if (lowDay >= 0.4) { facts.push(`${pct(lowDay)}% — в дни без сил или со сливами энергии`); hints.push([lowDay * 1.8, 'tired']); }
  if (evening >= 0.5) { facts.push(`${pct(evening)}% — вечером, после ${minToTime(evStart)}`); hints.push([evening * 1.5, 'tired']); }
  if (anxious >= 0.3) { facts.push(`${pct(anxious)}% — в те же часы, что и тревожные мысли`); hints.push([anxious * 2, 'stress']); }
  if (afterIncome >= 0.5) { facts.push(`${pct(afterIncome)}% — в первые 2 дня после поступлений`); hints.push([afterIncome * 1.4, 'reward']); }
  if (weekend >= 0.6) { facts.push(`${pct(weekend)}% — в выходные`); hints.push([weekend, cat === 'cafe' || cat === 'fun' ? 'social' : 'bored']); }
  if (impulsive >= 0.6) { facts.push(`${pct(impulsive)}% — импульсивно, без плана`); hints.push([impulsive, 'auto']); }
  hints.sort((a, b) => b[0] - a[0]);
  const guess = hints.length ? hints[0][1] : WHY_BY_CAT[cat] || 'auto';
  return { cat, n, sum, month, facts, guess };
}

function activeExperiment(cat) {
  return fin().experiments.find((x) => x.cat === cat && !x.result);
}

function experimentSpent(x) {
  const to = Math.min(Date.now() + 1, x.until);
  return fin().expenses.filter((e) => e.cat === x.cat && !e.fixed && e.at >= x.from && e.at < to).reduce((a, e) => a + e.amount, 0);
}

function spendHtml() {
  const f = fin();
  const active = f.experiments.filter((x) => !x.result);
  const leaks = spendPatterns().filter((p) => !active.some((x) => x.cat === p.cat)).slice(0, 3);
  const done = f.experiments.filter((x) => x.result && x.result.ok);
  const saved = done.reduce((a, x) => a + Math.max(0, x.base - x.result.spent), 0);
  if (!active.length && !leaks.length && !done.length) {
    return `<div class="section-h">Разбор трат</div>
      <div class="panel empty">Пока нечего разбирать. Когда хотелки начнут повторяться, Система найдёт, когда и почему это происходит, и предложит замену.</div>`;
  }
  const xpCard = (x) => {
    const spent = experimentSpent(x);
    const daysLeft = Math.max(1, Math.ceil((x.until - Date.now()) / 864e5));
    return `<div class="xp-card${spent > x.cap ? ' over' : ''}">
        <div class="fin-head"><span>🧪 ${esc(x.swap)}</span><span>${daysLeft} ${plural(daysLeft, ['день', 'дня', 'дней'])}</span></div>
        <span class="fin-bar"><i data-pct="${Math.min(100, x.cap ? (spent / x.cap) * 100 : 100).toFixed(1)}"></i></span>
        <small>${FIN_CAT[x.cat].name}: ${money(spent)} из ${money(x.cap)} за неделю (обычно ${money(x.base)}) · причина — ${WHY[x.why].short}</small>
        <button class="link" type="button" data-xstop="${x.id}">Остановить эксперимент</button>
      </div>`;
  };
  return `<div class="section-h">Разбор трат${saved ? ` <span class="count">сэкономлено ${money(saved)}</span>` : ''}</div>
    <div class="panel pad">
      ${active.map(xpCard).join('')}
      ${leaks.map((p) => `<button class="leak" type="button" data-leak="${p.cat}">
          <span class="fin-head"><span>${FIN_CAT[p.cat].name}</span><b>~${money(p.month)} / мес</b></span>
          <small>${esc(p.facts[1] || p.facts[0])}</small>
          <small class="guess">Похоже на: ${WHY[p.guess].short} → разобрать</small>
        </button>`).join('')}
      ${!leaks.length && active.length ? '<p class="hint" style="margin:8px 0 0">Других повторяющихся хотелок не видно.</p>' : ''}
    </div>`;
}

/** Разбор одной категории: факты, догадка Системы и вопрос «почему». */
function openSpendCase(cat) {
  clearToasts();
  const p = spendPatterns().find((x) => x.cat === cat);
  if (!p) return;
  const root = openSheet('Разбор трат', `
    <p class="lead">${FIN_CAT[cat].name}: <span class="hl">~${money(p.month)}</span> в месяц</p>
    <ul class="facts">${p.facts.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>
    <p class="dim center">Система думает, что дело в причине «${WHY[p.guess].short}». А ты как думаешь — почему так выходит?</p>
    <div class="rec-chips why-chips">${Object.entries(WHY).map(([id, w]) => `<button type="button" data-why="${id}"${id === p.guess ? ' class="guess"' : ''}>${w.label}</button>`).join('')}</div>
    <button class="btn ghost" type="button" data-action="close" style="margin-top:16px">Не сейчас</button>`);
  root.querySelectorAll('[data-why]').forEach((b) => b.addEventListener('click', () => openSwaps(cat, b.dataset.why)));
}

/** Замены под причину: выбор ставит эксперимент на 7 дней. */
function openSwaps(cat, why) {
  clearToasts();
  const usual = round100(weeklyUsual(cat));
  const cap = round100(usual * 0.5);
  const running = activeExperiment(cat);
  const root = openSheet('Чем заменить', `
    <p class="lead">${FIN_CAT[cat].name} · ${WHY[why].short}</p>
    <p class="dim center">Не «не трать», а что сделать вместо. Выбери одно — Система поставит эксперимент на 7 дней${usual ? `: «${FIN_CAT[cat].name}» — не больше ${money(cap)} за неделю (обычно ${money(usual)})` : ''}.</p>
    ${running ? `<p class="hint">Сейчас идёт «${esc(running.swap)}» — новый эксперимент его заменит.</p>` : ''}
    ${swapsFor(cat, why).map((x, i) => `<button class="swap" type="button" data-swap="${i}"><b>${esc(x.text)}</b><small>${esc(x.how)}</small></button>`).join('')}
    <button class="btn ghost" type="button" data-action="close" style="margin-top:16px">Не сейчас</button>`);
  const list = swapsFor(cat, why);
  root.querySelectorAll('[data-swap]').forEach((b) => b.addEventListener('click', () => startExperiment(cat, why, list[Number(b.dataset.swap)])));
}

function startExperiment(cat, why, swap) {
  const { state } = session;
  const f = fin();
  const usual = round100(weeklyUsual(cat));
  const now = Date.now();
  f.experiments = f.experiments.filter((x) => !(x.cat === cat && !x.result));
  f.experiments.push({ id: uid(), cat, why, swap: swap.text, from: now, until: now + 7 * 864e5, cap: round100(usual * 0.5), base: usual, result: null });
  const extra = [];
  if (swap.menu && !state.menu.items.some((i) => i.title === swap.menu)) {
    state.menu.items.push({ id: uid(), ratings: [], title: swap.menu, section: 'main', minutes: 20, evening: true });
    extra.push('добавлено в дофаминовое меню');
  }
  if (swap.quest && !state.quests.some((q) => q.title === swap.quest.title && q.repeat === swap.quest.repeat)) {
    const discipline = state.stats.find((st) => st.name === 'Дисциплина');
    state.quests.push({ id: uid(), createdAt: now, title: swap.quest.title, note: `Замена: ${FIN_CAT[cat].name.toLowerCase()}`, type: swap.quest.type || 'normal', stats: discipline ? [discipline.id] : [], repeat: swap.quest.repeat });
    extra.push('квест поставлен');
  }
  save();
  closeSheet();
  render();
  Sound.play('quest');
  toast({ title: 'Эксперимент на 7 дней', main: swap.text, sub: [`${FIN_CAT[cat].name}: до ${money(round100(usual * 0.5))} за неделю`, ...extra].join(' · '), kind: 'up', ms: 5000 });
  if (swap.run === 'groceries') setTimeout(() => ensureGroceryQuest(true), 600);
  if (swap.run === 'anxiety') setTimeout(() => startAnxietyFlow(), 400);
  if (swap.run === 'need') setTimeout(openNeedSheet, 400);
  if (swap.run === 'shop') { ui.tab = 'state'; render(); scrollTo(0, 0); }
}

function stopExperiment(id, btn) {
  confirmPress(btn, 'Точно остановить? Нажми ещё раз', () => {
    fin().experiments = fin().experiments.filter((x) => x.id !== id);
    save();
    render();
  });
}

/** Подводит итог экспериментов, у которых вышла неделя. */
function checkExperiments() {
  if (!session) return;
  const { state } = session;
  const f = fin();
  for (const x of f.experiments) {
    if (x.result || x.until > Date.now()) continue;
    const spent = experimentSpent(x);
    const ok = spent <= x.cap;
    x.result = { spent, ok, at: Date.now() };
    if (ok) {
      const before = playerInfo();
      const discipline = state.stats.find((st) => st.name === 'Дисциплина');
      const xp = state.settings.xp.goal;
      state.log.push({ id: uid(), questId: null, title: `Замена: ${x.swap}`, type: 'goal', xp, stats: discipline ? { [discipline.id]: xp } : {}, period: 'x:' + x.id, at: Date.now(), source: 'finance-exp' });
      const after = playerInfo();
      const number = state.log.filter((e) => e.type === 'goal' || e.type === 'epic').length;
      const savedSum = Math.max(0, x.base - spent);
      queueFx(() => showAchievement({ title: x.swap, type: 'goal', xp, label: 'Замена работает', sub: `${FIN_CAT[x.cat].name}: ${money(spent)} за неделю вместо обычных ${money(x.base)}${savedSum ? ` — сэкономлено ${money(savedSum)}` : ''}`, number }));
      if (after.rank !== before.rank) queueFx(() => showRankUp({ fromRank: before.rank, toRank: after.rank, level: after.level }));
      else if (after.level > before.level) queueFx(() => showLevelUp({ from: before.level, to: after.level }));
    } else {
      const cat = x.cat;
      toast({ title: 'Эксперимент', main: `«${x.swap}» не сработал`, sub: `${FIN_CAT[cat].name}: ${money(spent)} из ${money(x.cap)}. Это не провал — значит, причина другая`, action: { label: 'Разобрать заново', run: () => openSpendCase(cat) }, ms: 9000 });
    }
  }
  save();
}

/* ---------- Сверка баланса ----------
   Ожидаемые деньги = последняя сверка + поступления (без доли накоплений) − траты (включая обязательные) − покупки из фонда.
   Разницу Система помогает разобрать: подсказывает категории по привычкам последних 30 дней,
   незаписанные обязательные платежи и дни без записей. Остаток уходит в «Без записи». */

function daysAgoText(t) {
  const days = Math.floor((dayStart(new Date()) - dayStart(new Date(t))) / 864e5);
  if (days <= 0) return 'сегодня';
  if (days === 1) return 'вчера';
  return `${days} ${plural(days, ['день', 'дня', 'дней'])} назад`;
}

function expectedBalance(t = Date.now() + 1) {
  const f = fin();
  const a = f.anchor || { at: 0, amount: 0 };
  const inc = f.incomes.reduce((sum, i) => sum + (i.at >= a.at && i.at < t ? (i.adjust ? i.amount : Math.round(i.amount * (1 - f.savePct / 100))) : 0), 0);
  const exp = f.expenses.reduce((sum, e) => sum + (e.at >= a.at && e.at < t ? e.amount : 0), 0);
  const buys = session.state.purchases.reduce((sum, x) => sum + (x.at >= a.at && x.at < t ? x.kzt || 0 : 0), 0);
  return a.amount + inc - exp - buys;
}

function balanceHtml() {
  const f = fin();
  if (!f.incomes.length) return '';
  const last = f.anchor && f.anchor.at;
  const stale = !last || Date.now() - last > 7 * 864e5;
  return `<div class="panel pad bal-card${stale ? ' stale' : ''}" style="margin-top:12px">
      <div class="stat-row"><span>По записям у тебя</span><span class="mono">${money(expectedBalance())}</span></div>
      <p class="hint">${last ? `Последняя сверка ${daysAgoText(last)}` : 'Сверки ещё не было'}. ${stale ? 'Пора сверить с реальными деньгами — забытые траты найдутся сами.' : 'Сверяй раз в неделю.'}</p>
      <button class="btn${stale ? ' gold' : ' ghost'}" type="button" data-action="fin-check">Сверить баланс</button>
    </div>`;
}

function openReconcile() {
  clearToasts();
  const expected = expectedBalance();
  const root = openSheet('Сверка баланса', `
    <p class="dim center">Сколько у тебя сейчас денег — на картах и наличными, не считая отложенных накоплений?</p>
    <label class="field"><span>Реально есть, ₸</span><input name="actual" type="number" inputmode="numeric" min="0" step="1" placeholder="${Math.max(0, expected)}"></label>
    <p class="hint">По записям должно быть ${money(expected)}.</p>
    <p class="error" data-error></p>
    <button class="btn" type="button" data-go>Сверить</button>
    <button class="btn ghost" type="button" data-action="close">Отмена</button>`);
  const input = root.querySelector('input');
  input.focus();
  root.querySelector('[data-go]').addEventListener('click', () => {
    if (input.value === '') return sheetError(root, 'Впиши, сколько денег есть сейчас.');
    const actual = Math.round(Number(input.value));
    if (!(actual >= 0)) return sheetError(root, 'Сумма не может быть отрицательной.');
    const diff = expected - actual;
    const tolerance = Math.max(300, Math.abs(expected) * 0.01);
    if (Math.abs(diff) <= tolerance) return finishReconcile(actual, 'Всё сходится');
    if (diff > 0) return reconcileMissing(diff, actual);
    reconcileExtra(-diff, actual);
  });
}

/** Время для найденных трат: середина периода с прошлой сверки, но не сегодня. */
function reconcileTime() {
  const f = fin();
  const today = dayStart(new Date());
  const since = f.anchor ? f.anchor.at : f.since || today - 7 * 864e5;
  return since >= today ? Date.now() - 60000 : Math.round((since + today) / 2);
}

function addFoundExpense(cat, amount, text, fixed) {
  fin().expenses.push({
    id: uid(),
    at: reconcileTime(),
    amount: Math.round(amount),
    text,
    cat,
    cls: FIN_CAT[cat].cls,
    planned: null,
    fixed: !!fixed,
    overLimit: false,
    asked: { cat: true, planned: true, fixed: true },
    reconciled: true,
  });
}

function reconcileMissing(diff, actual) {
  clearToasts();
  const f = fin();
  const now = Date.now();
  const since = f.anchor ? f.anchor.at : f.since || now - 7 * 864e5;
  const days = Math.max(1, Math.round((now - since) / 864e5));
  const round100 = (n) => Math.max(100, Math.round(n / 100) * 100);

  // привычки за 30 дней: какие категории и сколько в день
  const from = now - 30 * 864e5;
  const habits = new Map();
  for (const e of f.expenses) {
    if (e.at < from || e.fixed || e.reconciled) continue;
    const h = habits.get(e.cat) || { sum: 0, n: 0 };
    h.sum += e.amount;
    h.n++;
    habits.set(e.cat, h);
  }
  let options = [...habits.entries()].sort((a, b) => b[1].n - a[1].n).slice(0, 6)
    .map(([cat, h]) => ({ key: cat, cat, label: FIN_CAT[cat].name, amount: Math.min(diff, round100((h.sum / 30) * days)) }));
  if (!options.length) options = ['cafe', 'groceries', 'transport', 'shopping'].map((cat) => ({ key: cat, cat, label: FIN_CAT[cat].name, amount: 0 }));

  // обязательные платежи, которые в этом месяце не записаны
  const monthFrom = new Date(new Date().getFullYear(), new Date().getMonth(), 1).getTime();
  const loggedFixed = f.expenses.filter((e) => e.fixed && e.at >= monthFrom).reduce((a, e) => a + e.amount, 0);
  if (loggedFixed < finBudget().fixed) {
    for (const x of f.fixed) if (x.amount <= diff * 1.1) options.unshift({ key: 'fx-' + x.id, cat: /связ|интернет|телефон/i.test(x.title) ? 'connect' : 'home', label: `📌 ${x.title}`, amount: Math.min(diff, x.amount), fixed: true, text: x.title });
  }

  // дни без единой записи — подсказка для памяти
  const quiet = [];
  for (let d = new Date(Math.max(since, now - 14 * 864e5)); dayStart(d) < dayStart(new Date()); d = addDays(d, 1)) {
    const a = dayStart(d);
    const b = dayStart(addDays(d, 1));
    if (!f.expenses.some((e) => e.at >= a && e.at < b) && !f.noSpend[dayKey(d)]) quiet.push(d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }));
  }

  const rows = new Map();
  const root = openSheet('Сверка баланса', `
    <p class="lead">Не хватает <span class="hl">${money(diff)}</span></p>
    <p class="dim center">Куда они ушли? Отметь, что было, суммы можно поправить.${quiet.length ? ` Дни без записей: ${quiet.join(', ')}.` : ''}</p>
    <div class="rec-chips">${options.map((o) => `<button type="button" data-opt="${o.key}" aria-pressed="false">${esc(o.label)}${o.amount ? ` <small>~${fmt(o.amount)}</small>` : ''}</button>`).join('')}</div>
    <div data-rows></div>
    <p class="rec-left" data-left></p>
    <button class="btn" type="button" data-save>Записать</button>
    <button class="btn ghost" type="button" data-unknown>Не помню — одной суммой</button>
    <button class="btn ghost" type="button" data-saved>Перевёл в накопления</button>
    <button class="btn ghost" type="button" data-action="close">Отмена</button>`);
  const box = root.querySelector('[data-rows]');
  const leftEl = root.querySelector('[data-left]');
  const sum = () => [...rows.values()].reduce((a, r) => a + (Number(r.input.value) || 0), 0);
  const update = () => {
    const left = diff - sum();
    leftEl.innerHTML = left > 0
      ? `Осталось разобрать <b>${money(left)}</b> — уйдёт в «Без записи»`
      : left < 0 ? `Больше разницы на <b>${money(-left)}</b> — проверь суммы` : 'Разобрано всё ✓';
  };
  root.querySelectorAll('[data-opt]').forEach((b) => b.addEventListener('click', () => {
    const o = options.find((x) => x.key === b.dataset.opt);
    if (rows.has(o.key)) {
      rows.get(o.key).el.remove();
      rows.delete(o.key);
      b.setAttribute('aria-pressed', 'false');
    } else {
      const left = Math.max(0, diff - sum());
      const el = document.createElement('div');
      el.className = 'rec-row';
      el.innerHTML = `<span>${esc(o.label)}</span><input type="number" inputmode="numeric" min="0" step="100" value="${Math.min(o.amount || left, left) || ''}">`;
      box.append(el);
      const input = el.querySelector('input');
      input.addEventListener('input', update);
      rows.set(o.key, { o, el, input });
      b.setAttribute('aria-pressed', 'true');
    }
    update();
  }));
  update();
  root.querySelector('[data-save]').addEventListener('click', () => {
    for (const { o, input } of rows.values()) {
      const amount = Math.round(Number(input.value) || 0);
      if (amount > 0) addFoundExpense(o.cat, amount, o.text || `${o.label} (сверка)`, o.fixed);
    }
    const left = diff - sum();
    if (left > 0) addFoundExpense('unknown', left, 'Без записи (сверка)');
    finishReconcile(actual, 'Разница разобрана');
  });
  root.querySelector('[data-unknown]').addEventListener('click', () => {
    addFoundExpense('unknown', diff, 'Без записи (сверка)');
    finishReconcile(actual, 'Записано одной суммой');
  });
  root.querySelector('[data-saved]').addEventListener('click', () => {
    addFoundExpense('savings', diff, 'Перевёл в накопления');
    finishReconcile(actual, 'Учтено как накопления');
  });
}

function lastGroceryTrip() {
  const big = fin().expenses.filter((e) => e.cat === 'groceries' && e.amount >= 2000).map((e) => e.at);

function groceryDue() {
  const last = lastGroceryTrip();
  return !last || Date.now() - last >= food().tripDays * 864e5 - 12 * 3600000;

/** Бюджет корзины: доля лимита дня × дни до следующей закупки, не больше свободных денег. */

  const lim = limitsNow();
  if (!lim) return null;
  const b = Math.round((lim.today.limit * food().tripDays * food().share) / 100 / 100) * 100;
  return Math.max(0, Math.min(b, Math.max(0, lim.free)));

function buildBasket(budget, days) {
  const items = foodItems();
  const t = foodTargets();
  const needP = t.protein * days;
  const needK = t.kcal * days;
  const qty = new Map();
  let cost = 0;
  let P = 0;
  let K = 0;
  const maxFor = (it) => Math.max(1, Math.round((it.max * days) / 7));
  const can = (it) => cost + it.price <= budget && (qty.get(it.id) || 0) < maxFor(it);
  const add = (it) => { qty.set(it.id, (qty.get(it.id) || 0) + 1); cost += it.price; P += it.protein; K += it.kcal; };
  const best = (list, score, cap = budget) => list.filter((it) => can(it) && cost + it.price <= cap).sort((a, b) => score(b) - score(a))[0];
  const rep = (it) => 1 + 0.6 * (qty.get(it.id) || 0);
  const proteins = items.filter((x) => x.kind === 'protein');
  const fillProtein = (cap) => {
    for (let guard = 0; P < needP && guard < 60; guard++) {
      const it = best(proteins, (x) => x.protein / x.price / rep(x), cap);
      if (!it) break;
      add(it);
    }
  };
  // база: самый дешёвый овощ и фрукт, яйца на завтраки
  for (const kind of ['veg', 'fruit']) {
    const it = best(items.filter((x) => x.kind === kind), (x) => -x.price);
    if (it) add(it);
  }
  const eggs = items.find((x) => x.id === 'eggs');
  if (eggs && can(eggs)) add(eggs);
  // белок по максимуму граммов на тенге — но не больше 60% остатка, чтобы хватило на калории
  fillProtein(cost + (budget - cost) * 0.6);
  // калории по максимуму ккал на тенге: сначала крупы и хлеб, масло — в последнюю очередь
  for (let guard = 0; K < needK && guard < 60; guard++) {
    const it = best(items.filter((x) => x.kind === 'carb' || x.kind === 'fat'), (x) => (x.kcal * (x.kind === 'fat' ? 0.4 : 1)) / x.price / rep(x));
    if (!it) break;
    add(it);
  }
  // остались деньги, а белка мало — добрать
  fillProtein(budget);
  // если деньги остались — второй овощ для разнообразия
  const veg2 = best(items.filter((x) => x.kind === 'veg' && !qty.has(x.id)), (x) => -x.price);
  if (veg2 && budget - cost > budget * 0.1) add(veg2);
  const lines = [...qty.entries()].map(([id, n]) => ({ id, n, got: false }));
  return { at: Date.now(), days, budget, lines };
}

function basketCost(lines, onlyGot) {
  const items = foodItems();
  return lines.reduce((a, l) => {
    const it = items.find((x) => x.id === l.id) || FOOD.find((x) => x.id === l.id);
    return a + (onlyGot && !l.got ? 0 : it.price * l.n);
  }, 0);
}

function openBasket(rebuild) {
  clearToasts();
  const f = food();
  if (!f.list || rebuild) {
    const b = typeof rebuild === 'number' ? rebuild : groceryBudget() ?? 10000;
    f.list = buildBasket(b, f.tripDays);
    save();
  }
  const list = f.list;
  const items = foodItems();
  const byId = (id) => items.find((x) => x.id === id) || FOOD.find((x) => x.id === id);
  const t = foodTargets();
  const P = list.lines.reduce((a, l) => a + byId(l.id).protein * l.n, 0);
  const K = list.lines.reduce((a, l) => a + byId(l.id).kcal * l.n, 0);
  const pPct = Math.round((P / (t.protein * list.days)) * 100);
  const kPct = Math.round((K / (t.kcal * list.days)) * 100);
  const total = basketCost(list.lines);
  const cover = (label, pct) => `<div class="cover${pct < 90 ? ' short' : ''}"><div class="fin-head"><span>${label}</span><span>${pct}%</span></div><span class="fin-bar"><i style="width:${Math.min(100, pct)}%"></i></span></div>`;
  const root = openSheet('Корзина', `
    <p class="dim center">На ${list.days} дн. под набор массы. Бюджет ${money(list.budget)}, в корзине ${money(total)}${total < list.budget * 0.8 && pPct >= 90 && kPct >= 90 ? ' — норма закрыта, остальное остаётся в лимите' : ''}.</p>
    <div class="panel log-list" style="margin-top:8px">${list.lines.map((l, i) => {
      const it = byId(l.id);
      return `<label class="basket-row${l.got ? ' got' : ''}"><input type="checkbox" data-line="${i}"${l.got ? ' checked' : ''}>
        <b>${it.name} · ${it.unit}${l.n > 1 ? ` × ${l.n}` : ''}</b><span class="a">${money(it.price * l.n)}</span>
        <small>белок ${it.protein * l.n} г · ${fmt(it.kcal * l.n)} ккал</small></label>`;
    }).join('')}</div>
    ${cover('Белок на эти дни', pPct)}
    ${cover('Калории на эти дни', kPct)}
    ${pPct < 90 ? '<p class="hint">Денег не хватает на полную норму белка. Когда придут деньги — пересобери корзину.</p>' : ''}
    <label class="field"><span>Другой бюджет, ₸</span><input name="budget" type="number" inputmode="numeric" min="0" step="500" value="${list.budget}"></label>
    <button class="btn ghost" type="button" data-rebuild>Пересобрать</button>
    <button class="btn" type="button" data-bought>Купил — записать трату</button>
    <button class="btn ghost" type="button" data-action="close">Закрыть</button>`);
  root.querySelectorAll('[data-line]').forEach((box) => box.addEventListener('change', () => {
    list.lines[Number(box.dataset.line)].got = box.checked;
    box.closest('.basket-row').classList.toggle('got', box.checked);
    save();
  }));
  root.querySelector('[data-rebuild]').addEventListener('click', () => {
    const v = Math.round(Number(root.querySelector('input[name="budget"]').value));
    openBasket(v > 0 ? v : true);
  });
  root.querySelector('[data-bought]').addEventListener('click', () => {
    const q = activeGroceryQuest();
    if (q) {
      closeSheet();
      completeQuest(q); // опыт за квест; сумму спросит следующее окно
      setTimeout(askGrocerySpend, 500);
    } else askGrocerySpend();
  });
}

    f.share = Number(el.share.value) || 60;
    f.off = [...root.querySelectorAll('[data-on]')].filter((c) => !c.checked).map((c) => c.dataset.on);

      const def = FOOD.find((x) => x.id === inp.dataset.price).price;

      else delete f.prices[inp.dataset.price];

    f.list = null; // корзину пересоберём по новым данным
    save();
    closeSheet();
    render();
  });
}

function openStatEditor(stat) {
  const { state } = session;
  const root = openSheet(stat ? 'Характеристика' : 'Новая характеристика', `
    <form novalidate>
      <label class="field"><span>Название</span>
        <input name="name" type="text" maxlength="32" autocomplete="off" autocapitalize="sentences" value="${stat ? esc(stat.name) : ''}">
      </label>
      <p class="error" data-error></p>
      <button class="btn" type="submit">${stat ? 'Сохранить' : 'Добавить'}</button>
      ${stat ? '<button class="btn ghost danger-text" type="button" data-action="delete">Удалить характеристику</button>' : ''}
      <button class="btn ghost" type="button" data-action="close">Отмена</button>
    </form>`);

  const form = root.querySelector('form');
  const input = form.elements.namedItem('name');
  if (!stat) input.focus();

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = input.value.trim();
    if (!name) return sheetError(root, 'Введите название.');
    const taken = state.stats.some((s) => s !== stat && s.name.toLowerCase() === name.toLowerCase());
    if (taken) return sheetError(root, 'Такая характеристика уже есть.');
    if (stat) stat.name = name;
    else state.stats.push({ id: uid(), name });
    save();
    closeSheet();
    render();
  });

  const del = root.querySelector('[data-action="delete"]');
  if (del) {
    del.addEventListener('click', () => confirmPress(del, 'Опыт характеристики пропадёт. Удалить?', () => {
      state.stats = state.stats.filter((s) => s.id !== stat.id);
      for (const q of state.quests) q.stats = q.stats.filter((id) => id !== stat.id);
      save();
      closeSheet();
      render();
    }));
  }
}

function onRankInput(input) {
  const { ranks } = session.state.settings;
  const i = RANKS.findIndex((r) => r.id === input.dataset.rank);
  const low = i === 1 ? 1 : ranks[RANKS[i - 1].id];
  const high = i === RANKS.length - 1 ? 1000 : ranks[RANKS[i + 1].id];
  const value = Math.round(Number(input.value));
  if (!(value > low && value < high)) {
    input.value = ranks[input.dataset.rank];
    toast({ title: 'Пороги рангов', main: 'Не сохранено', sub: `Ранг ${input.dataset.rank}: уровень от ${low + 1} до ${high - 1}`, kind: 'minus' });

  }
  ranks[input.dataset.rank] = value;
  save();
  renderTopbar();
}

/* =====================================================================
   БЭКАП: экспорт и импорт зашифрованного файла
   В файле лежит та же зашифрованная запись, что и в хранилище, плюс дата экспорта.
   ===================================================================== */

const BACKUP_FORMAT = 'sistema-backup';
const BACKUP_EVERY_MS = 7 * 864e5;

const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;

function backupAge() {
  const { lastBackupAt } = session.state.settings;
  return lastBackupAt ? Date.now() - lastBackupAt : null;
}

/** Пора ли напомнить о бэкапе: раз в неделю, если есть что терять. */
function backupDue() {
  const { state } = session;
  if (!state.log.length) return false;
  return Date.now() - (state.settings.lastBackupAt || state.createdAt) > BACKUP_EVERY_MS;
}

function backupAgeText() {
  const age = backupAge();
  if (age === null) return 'ещё не делали';
  const days = Math.floor(age / 864e5);
  if (days === 0) return 'сегодня';
  if (days === 1) return 'вчера';
  return `${days} ${plural(days, ['день', 'дня', 'дней'])} назад`;
}

async function exportBackup() {
  flushInputs();
  await saveChain; // в файл попадает последнее сохранённое состояние
  const backup = { format: BACKUP_FORMAT, v: 1, exportedAt: Date.now(), vault: Vault.read() };
  const name = `sistema-backup-${dayKey(new Date())}.json`;
  const file = new File([JSON.stringify(backup)], name, { type: 'application/json' });
  try {
    // На телефоне — меню «Поделиться» («Сохранить в Файлы»), на компьютере — обычная загрузка
    if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Бэкап Системы' });
    } else {
      const url = URL.createObjectURL(file);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }
  } catch (err) {
    if (err && err.name === 'AbortError') return; // закрыли меню «Поделиться»
    console.error(err);
    toast({ title: 'Бэкап', main: 'Не удалось сохранить файл', kind: 'minus' });
    return;
  }
  if (!session) return;
  session.state.settings.lastBackupAt = Date.now();
  save();
  toast({ title: 'Бэкап', main: 'Файл сохранён', sub: 'Зашифрован текущим паролем', ms: 4000 });
  render();
}

/* Одно поле выбора файла на всё приложение — живёт вне #app и переживает блокировку */

fileInput.type = 'file';
fileInput.accept = '.json,application/json';

fileInput.tabIndex = -1;
fileInput.setAttribute('aria-hidden', 'true');

  const file = fileInput.files[0];
  fileInput.value = '';
  if (file) startImport(file);
});

function pickBackup() {
  fileInput.click();
}

async function startImport(file) {
  let backup = null;
  if (file.size < 20 * 1024 * 1024) {
    try { backup = JSON.parse(await file.text()); } catch (err) { backup = null; }
  }
  if (backup && backup.format === PROLOGUE_FORMAT) return startPrologue(backup);
  const v = backup && backup.vault;
  const valid = backup && backup.format === BACKUP_FORMAT && v && v.kdf && v.kdf.salt && v.kdf.iter && v.iv && v.ct;
  if (!valid) {
    if (session) toast({ title: 'Импорт', main: 'Это не бэкап Системы', kind: 'minus' });
    else showError('Этот файл не похож на бэкап Системы.');
    return;
  }
  if (session) endSession();
  showImport(backup);
}

function showImport(backup) {
  const root = mount('tpl-import');
  const form = root.querySelector('form');
  const when = new Date(backup.exportedAt);
  root.querySelector('[data-bind="exported"]').textContent = isNaN(when)
    ? 'Введите пароль, которым он зашифрован.'
    : `Сделан ${when.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' })}, ${when.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}. Введите пароль, которым он зашифрован.`;
  if (Vault.exists()) root.querySelector('[data-replace]').hidden = false;

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = form.pw.value;
    if (!pw) return showError('Введите пароль бэкапа.');
    const btn = form.querySelector('[data-submit]');
    setBusy(btn, 'Расшифровка…');
    try {
      const { kdf } = backup.vault;
      const key = await deriveKey(pw, b64.decode(kdf.salt), kdf.iter);
      const state = migrate(await decryptJSON(key, backup.vault));
      Vault.write(backup.vault);
      session = { key, kdf, state };
      lastSavedAt = null;
      // Данные совпадают с файлом — значит, бэкап этих данных уже есть
      if (backup.exportedAt > (state.settings.lastBackupAt || 0)) {
        state.settings.lastBackupAt = backup.exportedAt;
        save();
      }
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
      showHome();
      toast({ title: 'Восстановление', main: 'Бэкап восстановлен', sub: `${fmt(state.log.length)} ${plural(state.log.length, ['запись', 'записи', 'записей'])} в журнале`, kind: 'up', ms: 4500 });
    } catch (err) {
      setBusy(btn, null);
      if (err && err.name === 'OperationError') {
        form.pw.value = '';
        showError('Неверный пароль бэкапа.');
      } else {
        console.error(err);
        showError('Бэкап повреждён или в неизвестном формате.');
      }
    }
  });
  root.querySelector('[data-action="back"]').addEventListener('click', boot);
}

/* =====================================================================
   ПРОЛОГ: прошлые достижения, засчитанные как выполненные квесты
   Файл — открытый JSON без шифрования; после импорта его стоит удалить:
   { "format": "sistema-prologue", "v": 1, "title": "…",
     "quests": [{ "title": "…", "note": "…", "type": "goal", "stats": ["Интеллект"], "done": true }] }
   done: false — квест ещё впереди: попадёт в список активных, опыт — когда отметите
   ===================================================================== */

const PROLOGUE_FORMAT = 'sistema-prologue';

/** Проверяет и чистит список квестов из файла; null — если файл не годится. */
function parsePrologue(data) {
  if (!Array.isArray(data.quests) || !data.quests.length || data.quests.length > 500) return null;
  const items = [];
  for (const q of data.quests) {
    if (!q || typeof q.title !== 'string' || !q.title.trim() || !TYPE_BY_ID[q.type]) return null;
    const stats = Array.isArray(q.stats) ? q.stats.filter((n) => typeof n === 'string' && n.trim()).map((n) => n.trim().slice(0, 32)) : [];
    items.push({
      title: q.title.trim().slice(0, 120),
      note: typeof q.note === 'string' ? q.note.trim().slice(0, 1000) : '',
      type: q.type,
      stats,
      done: q.done !== false,
    });
  }
  return items;
}

function startPrologue(data) {
  const items = parsePrologue(data);
  if (!items) {
    if (session) toast({ title: 'Пролог', main: 'Файл повреждён', kind: 'minus' });
    else showError('Файл пролога повреждён.');
    return;
  }
  if (!session) {
    showError('Это файл пролога. Войдите и добавьте его в «Настройках» → «Данные».');
    return;
  }
  openPrologueSheet(typeof data.title === 'string' ? data.title.slice(0, 80) : 'Пролог', items);
}

function openPrologueSheet(title, items) {
  const { state } = session;
  if (state.log.some(isPrologue)) {
    openSheet('Пролог', `
      <p class="lead">Пролог уже засчитан.</p>
      <p class="dim center">Второй раз добавить нельзя — опыт посчитался бы дважды.</p>
      <button class="btn ghost" type="button" data-action="close">Закрыть</button>`);
    return;
  }
  const done = items.filter((q) => q.done);
  const active = items.length - done.length;
  const xp = done.reduce((sum, q) => sum + state.settings.xp[q.type], 0);
  const before = playerInfo();
  const after = playerInfo(before.xp + xp);
  const root = openSheet('Пролог', `
    <p class="lead">${esc(title)}</p>
    <p class="dim center">${done.length} ${plural(done.length, ['достижение', 'достижения', 'достижений'])} попадут в журнал как выполненные квесты.${active ? ` Ещё ${active} ${plural(active, ['квест', 'квеста', 'квестов'])} ${plural(active, ['добавится', 'добавятся', 'добавятся'])} в список активных.` : ''}</p>
    <div class="stat-row"><span>Опыт</span><span class="mono">+${fmt(xp)} XP</span></div>
    <div class="stat-row"><span>Уровень</span><span class="mono">${before.level} → ${after.level}</span></div>
    <div class="stat-row"><span>Ранг</span><span class="mono">${before.rank} → ${after.rank}</span></div>
    <p class="hint">Пролог не влияет на опыт за сегодня и неделю и на серию дней. После импорта файл можно удалить: он не зашифрован.</p>
    <button class="btn" type="button" data-action="apply">Засчитать</button>
    <button class="btn ghost" type="button" data-action="close">Отмена</button>`);
  root.querySelector('[data-action="apply"]').addEventListener('click', () => {
    closeSheet();
    applyPrologue(items);
  });
}

function applyPrologue(items) {
  const { state } = session;
  const byName = new Map(state.stats.map((st) => [st.name.toLowerCase(), st.id]));
  const statId = (name) => {
    if (!byName.has(name.toLowerCase())) {
      const st = { id: uid(), name };
      state.stats.push(st);
      byName.set(name.toLowerCase(), st.id);
    }
    return byName.get(name.toLowerCase());
  };
  const playerBefore = playerInfo();
  const statsBefore = statXp();
  const now = Date.now();
  items.forEach((item, i) => {
    const at = now - (items.length - i); // порядок из файла сохраняется
    const ids = [...new Set(item.stats.map(statId))];
    if (!item.done) {
      // Квест впереди — обычный активный квест, опыт придёт при отметке
      state.quests.push({ id: uid(), createdAt: now + i, title: item.title, note: item.note, type: item.type, stats: ids, repeat: 'none' });
      return;
    }
    const quest = { id: uid(), createdAt: at, title: item.title, note: item.note, type: item.type, stats: ids, repeat: 'none', source: 'prologue' };
    const xp = state.settings.xp[item.type];
    state.quests.push(quest);
    state.log.push({ id: uid(), questId: quest.id, title: item.title, type: item.type, xp, stats: splitXp(xp, ids), period: null, at, source: 'prologue' });
  });
  save();
  render();

  const playerAfter = playerInfo();
  const statsAfter = statXp();
  const statUps = state.stats
    .map((st) => [st.name, levelInfo(statsBefore.get(st.id) || 0).level, levelInfo(statsAfter.get(st.id) || 0).level])
    .filter(([, was, now]) => now > was)
    .sort((a, b) => b[2] - a[2])
    .map(([name, , now]) => `${name}: ур. ${now}`);
  Sound.play('quest');
  haptic([30, 60, 30, 60, 80]);
  if (playerAfter.rank !== playerBefore.rank) {
    queueFx(() => showRankUp({ fromRank: playerBefore.rank, toRank: playerAfter.rank, level: playerAfter.level, statUps }));
  } else if (playerAfter.level > playerBefore.level) {
    queueFx(() => showLevelUp({ from: playerBefore.level, to: playerAfter.level, statUps }));
  }
  const doneCount = items.filter((q) => q.done).length;
  const activeCount = items.length - doneCount;
  toast({
    title: 'Пролог засчитан',
    main: `+${fmt(playerAfter.xp - playerBefore.xp)} XP`,
    sub: `${doneCount} ${plural(doneCount, ['квест', 'квеста', 'квестов'])} в журнале` + (activeCount ? ` · ${activeCount} ${plural(activeCount, ['новый квест', 'новых квеста', 'новых квестов'])}` : ''),
    kind: 'up',
    ms: 6000,
  });
}

/* =====================================================================
   PWA: офлайн через service worker
   ===================================================================== */

function registerServiceWorker() {
  if (!('serviceWorker' in navigator) || !window.isSecureContext) return;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(() => {});
  // Новая версия встала — старый код работает до перезапуска
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController && session) toast({ title: 'Система', main: 'Обновление установлено', sub: 'Перезапустите приложение', ms: 6000 });
  });
}

/* =====================================================================
   ЗАПУСК
   ===================================================================== */

function boot() {
  if (!window.isSecureContext || !window.crypto || !crypto.subtle) return mount('tpl-unsupported');
  if (Vault.exists()) showLogin();
  else showSetup();
}

registerServiceWorker();
boot();
</script>
</body>
</html>
