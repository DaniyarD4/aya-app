/** Типы задач. Опыт по умолчанию; текущие значения — в state.settings.xp. */
const TASK_TYPES = [
  { id: 'chore', name: 'Бытовая', xp: 10, hint: 'Покупки, мелкие дела' },
  { id: 'normal', name: 'Обычная', xp: 25, hint: 'Средние задачи' },
  { id: 'goal', name: 'Целевая', xp: 60, hint: 'Блог, деньги, карьера' },
  { id: 'epic', name: 'Эпическая', xp: 200, hint: 'Босс: крупный рубеж' },
];
const TYPE_BY_ID = Object.fromEntries(TASK_TYPES.map((t) => [t.id, t]));

const DEFAULT_STATS = ['Сила', 'Интеллект', 'Креатив', 'Дисциплина', 'Карьера', 'Творческая реализация', 'Проявленность', 'Харизма'];

const REPEATS = { none: 'Разовый', daily: 'Каждый день', weekly: 'Каждую неделю' };

/** Ранги охотника и общий уровень, с которого они даются. Текущие пороги — в state.settings.ranks. */
const RANKS = [
  { id: 'E', from: 1 },
  { id: 'D', from: 5 },
  { id: 'C', from: 10 },
  { id: 'B', from: 15 },
  { id: 'A', from: 20 },
  { id: 'S', from: 30 },
];
const defaultRankThresholds = () => Object.fromEntries(RANKS.slice(1).map((r) => [r.id, r.from]));

function uid() {
  return Array.from(crypto.getRandomValues(new Uint8Array(8)), (b) => b.toString(16).padStart(2, '0')).join('');
}

function defaultState(name) {
  return migrate({ schema: 1, createdAt: Date.now(), profile: { name: name || 'Игрок' } });
}

/**
 * Доводит расшифрованные данные до текущей схемы.
 * quests — список задач; log — журнал выполнений, из которого считается весь опыт:
 * { id, questId, title, type, xp, stats: { statId: xp }, period, at }.
 */
function migrate(state) {
  state.settings = state.settings || {};
  state.settings.xp = Object.assign(Object.fromEntries(TASK_TYPES.map((t) => [t.id, t.xp])), state.settings.xp);
  state.stats = state.stats || DEFAULT_STATS.map((name) => ({ id: uid(), name }));
  state.quests = state.quests || [];
  state.log = state.log || [];
  state.settings.ranks = Object.assign(defaultRankThresholds(), state.settings.ranks);
  if (state.settings.sound === undefined) state.settings.sound = true;
  if (state.settings.haptics === undefined) state.settings.haptics = true;
  state.goals = state.goals || [];
  state.drains = state.drains || [];
  state.days = state.days || {}; // dayKey → { drains: [id], energy: 1–5 }
  state.finance = Object.assign({ expected: 0, incomes: [], fixed: [], savePct: 10, rules: {}, expenses: [], noSpend: {}, checked: {} }, state.finance);
  if (state.finance.income && !state.finance.expected) state.finance.expected = state.finance.income; // раньше был «доход в месяц»
  delete state.finance.income;
  state.evening = Object.assign({ start: 19 * 60, review: 12 * 60, steps: null, done: {} }, state.evening);
  if (!state.evening.steps) state.evening.steps = EVENING_PRESET.map((st) => ({ id: uid(), ...st }));
  state.worries = state.worries || [];
  state.menu = Object.assign({ items: null, active: null }, state.menu);
  if (!state.menu.items) state.menu.items = MENU_PRESET.map((it) => ({ id: uid(), ratings: [], ...it }));
  state.purchases = state.purchases || [];
  if (state.finance.joyPct === undefined) state.finance.joyPct = 5;
  state.food = Object.assign({ weight: 70, tripDays: 6, share: 60, prices: {}, off: [], lastTrip: null, list: null }, state.food);
  state.finance.experiments = state.finance.experiments || []; // эксперименты-замены из «Разбора трат»
  state.schema = 10;
  return state;
}

/** Опыт, нужный для перехода с уровня level на следующий. */
function xpToNext(level) {
  return Math.round(100 * Math.pow(level, 1.5));
}

function levelInfo(xp) {
  let level = 1;
  let into = xp;
  while (into >= xpToNext(level)) {
    into -= xpToNext(level);
    level++;
  }
  return { level, into, need: xpToNext(level) };
}

/** Делит опыт поровну между характеристиками; остаток раздаётся по единице первым. */
function splitXp(xp, statIds) {
  const out = {};
  if (!statIds.length) return out;
  const base = Math.floor(xp / statIds.length);
  let rest = xp - base * statIds.length;
  for (const id of statIds) out[id] = base + (rest-- > 0 ? 1 : 0);
  return out;
}

function totalXp() {
  return session.state.log.reduce((sum, e) => sum + e.xp, 0);
}

function statXp() {
  const map = new Map();
  for (const e of session.state.log) {
    for (const [id, xp] of Object.entries(e.stats)) map.set(id, (map.get(id) || 0) + xp);
  }
  return map;
}

function rankOf(level) {
  const thresholds = session.state.settings.ranks;
  let rank = RANKS[0].id;
  for (const r of RANKS.slice(1)) if (level >= thresholds[r.id]) rank = r.id;
  return rank;
}

/** Общий уровень и ранг персонажа. */
function playerInfo(xp = totalXp()) {
  const info = levelInfo(xp);
  return { ...info, xp, rank: rankOf(info.level) };
}

function statName(id) {
  const stat = session.state.stats.find((s) => s.id === id);
  return stat ? stat.name : '—';
}

/* ---------- Статистика: опыт за день и неделю, серия дней ---------- */

/** Русское склонение: plural(3, ['день', 'дня', 'дней']) → 'дня'. */
function plural(n, forms) {
  const m10 = n % 10;
  const m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return forms[0];
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return forms[1];
  return forms[2];
}

function addDays(d, n) {
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() + n);
  return t;
}

/** dayKey → { xp, count } по журналу. */
const isPrologue = (e) => e.source === 'prologue';

/** dayKey → { xp, count } по журналу. Пролог — прошлые достижения без дат — сюда не входит. */
function xpByDay() {
  const map = new Map();
  for (const e of session.state.log) {
    if (isPrologue(e)) continue;
    const key = dayKey(new Date(e.at));
    const day = map.get(key) || { xp: 0, count: 0 };
    day.xp += e.xp;
    day.count++;
    map.set(key, day);
  }
  return map;
}

function weekXp(now = new Date()) {
  const week = weekKey(now);
  return session.state.log.reduce((sum, e) => sum + (!isPrologue(e) && weekKey(new Date(e.at)) === week ? e.xp : 0), 0);
}

/**
 * Серия — дни подряд хотя бы с одним выполненным квестом.
 * Если сегодня ещё ничего не сделано, серия жива до конца дня и считается со вчера.
 */
function streakInfo(now = new Date()) {
  const days = xpByDay();
  const todayDone = days.has(dayKey(now));
  let d = todayDone ? now : addDays(now, -1);
  let current = 0;
  while (days.has(dayKey(d))) {
    current++;
    d = addDays(d, -1);
  }
  let best = 0;
  let run = 0;
  let prev = null;
  for (const key of [...days.keys()].sort()) {
    const [y, m, dd] = key.split('-').map(Number);
    const date = new Date(y, m - 1, dd);
    run = prev && dayKey(addDays(prev, 1)) === key ? run + 1 : 1;
    best = Math.max(best, run);
    prev = date;
  }
  return { current, best, todayDone };
}

/* ---------- Периоды повторяющихся квестов ---------- */

const pad = (n) => String(n).padStart(2, '0');

function dayKey(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

/** ISO-неделя: начинается в понедельник. */
function weekKey(d) {
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() - ((t.getDay() + 6) % 7) + 3); // четверг этой недели
  const jan4 = new Date(t.getFullYear(), 0, 4);
  const week = 1 + Math.round(((t - jan4) / 864e5 - 3 + ((jan4.getDay() + 6) % 7)) / 7);
  return `${t.getFullYear()}-W${pad(week)}`;
}

/** Текущий период квеста: null для разовых. */
function periodKey(repeat, d = new Date()) {
  if (repeat === 'daily' || repeat === 'xweek') return 'd:' + dayKey(d); // «N раз в неделю» — не чаще раза в день
  if (repeat === 'weekly') return 'w:' + weekKey(d);
  return null;
}

/** questId → запись журнала, которая отмечает квест выполненным сейчас. */
function completionIndex() {
  const { quests, log } = session.state;
  const now = new Date();
  const periods = new Map(quests.map((q) => [q.id, periodKey(q.repeat, now)]));
  const map = new Map();
  for (const e of log) {
    if (periods.has(e.questId) && periods.get(e.questId) === e.period) map.set(e.questId, e);
  }
  return map;
}

/* =====================================================================
   СЕССИЯ
   session = { key, kdf, state } пока приложение разблокировано, иначе null.
   ===================================================================== */

let session = null;
let saveChain = Promise.resolve();
let lastSavedAt = null;

async function createVault(password, name) {
  const kdf = newKdfParams();
  const key = await deriveKey(password, b64.decode(kdf.salt), kdf.iter);
  const state = defaultState(name);
  Vault.write(await encryptJSON(key, kdf, state));
  lastSavedAt = Date.now();
  session = { key, kdf, state };
  // Просим браузер не вычищать хранилище при нехватке места
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}

async function unlockVault(password) {
  const record = Vault.read();
  const kdf = record.kdf;
  const key = await deriveKey(password, b64.decode(kdf.salt), kdf.iter);
  const state = migrate(await decryptJSON(key, record)); // неверный пароль → исключение
  session = { key, kdf, state };
  lastSavedAt = null;
}

/**
 * Шифрует и сохраняет текущее состояние. Снимок и ключ берутся синхронно,
 * поэтому сохранение завершится, даже если сразу после вызова сработает блокировка.
 */
function save() {
  if (!session) return saveChain;
  const { key, kdf } = session;
  const snapshot = JSON.parse(JSON.stringify(session.state));
  saveChain = saveChain
    .then(() => encryptJSON(key, kdf, snapshot))
    .then((record) => {
      Vault.write(record);
      lastSavedAt = Date.now();
      if (session) renderSavedAt();
    })
    .catch((err) => {
      console.error(err);
      showError('Не удалось сохранить данные: ' + (err && err.name === 'QuotaExceededError' ? 'нет места в хранилище.' : 'ошибка записи.'));
    });
  return saveChain;
}

function lock(reason) {
  if (!session) return;
  endSession();
  showLogin(reason);
}

/** Закрывает сессию: забывает ключ и данные, убирает всё, что было на экране. */
function endSession() {
  flushInputs();
  session = null; // ключ и расшифрованные данные больше недоступны
  clearTimeout(renderTimer);
  closeSheet();
  closeFx();
  clearToasts();
  clearInterval(activeTimer);
  if (document.activeElement) document.activeElement.blur();
}

let lastActivity = Date.now();
for (const ev of ['pointerdown', 'keydown', 'touchstart', 'wheel', 'scroll', 'input']) {
  addEventListener(ev, () => { lastActivity = Date.now(); }, { passive: true, capture: true });
}
setInterval(() => {
  if (session && Date.now() - lastActivity > CONFIG.autoLockMs) lock('idle');
}, 5000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) lock('hidden');
});
addEventListener('pagehide', () => lock('hidden'));

   ИНТЕРФЕЙС

const app = document.getElementById('app');

function mount(templateId) {
  const node = document.getElementById(templateId).content.cloneNode(true);
  app.className = '';
  app.replaceChildren(node);
  wireRevealButtons(app);
  return app.firstElementChild;
}

const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';

function wireRevealButtons(root) {
  root.querySelectorAll('.reveal').forEach((btn) => {
    btn.innerHTML = EYE;
    btn.addEventListener('click', () => {
      const input = btn.previousElementSibling;
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.setAttribute('aria-pressed', String(show));
      btn.setAttribute('aria-label', show ? 'Скрыть пароль' : 'Показать пароль');
    });
  });
}

function showError(message, shakeEl) {
  const el = app.querySelector('[data-error]');
  if (el) el.textContent = message;
  const target = shakeEl || app.querySelector('.sys');
  if (message && target) {
    target.classList.remove('shake');
    void target.offsetWidth;
    target.classList.add('shake');
  }
}

function setBusy(button, busyText) {
  if (busyText) {
    button.dataset.label = button.textContent;
    button.disabled = true;
    button.innerHTML = '<span class="spin"></span>';
    button.append(busyText);
  } else {
    button.disabled = false;
    button.textContent = button.dataset.label;
  }
}

/* ---------- Первый запуск ---------- */

function showSetup() {
  const root = mount('tpl-setup');
  const form = root.querySelector('form');
  root.querySelector('[data-action="restore"]').addEventListener('click', pickBackup);
  if (isIOS() && !isStandalone()) root.querySelector('[data-ios-hint]').hidden = false;
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = form.player.value.trim();
    const pw = form.pw.value;
    if (pw.length < CONFIG.minPasswordLength) return showError(`Пароль должен быть не короче ${CONFIG.minPasswordLength} символов.`);
    if (pw !== form.pw2.value) return showError('Пароли не совпадают.');
    if (!form.ack.checked) return showError('Подтвердите, что понимаете: пароль восстановить нельзя.');
    const btn = form.querySelector('[data-submit]');
    setBusy(btn, 'Инициализация…');
    try {
      await createVault(pw, name);
      showHome();
    } catch (err) {
      console.error(err);
      setBusy(btn, null);
      showError('Не удалось создать хранилище. Проверьте, что приватный режим выключен.');
    }
  });
}

/* ---------- Вход ---------- */

const LOCK_REASONS = {
  idle: 'Сеанс заблокирован: 5 минут без активности.',
  hidden: 'Сеанс заблокирован при сворачивании.',
  manual: 'Сеанс заблокирован.',
};

function showLogin(reason) {
  const root = mount('tpl-login');
  const form = root.querySelector('form');
  const reasonEl = root.querySelector('[data-reason]');
  if (reason && LOCK_REASONS[reason]) {
    reasonEl.textContent = LOCK_REASONS[reason];
    reasonEl.hidden = false;
  }
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = form.pw.value;
    if (!pw) return showError('Введите пароль.');
    const btn = form.querySelector('[data-submit]');
    setBusy(btn, 'Расшифровка…');
    try {
      await unlockVault(pw);
      showHome();
    } catch (err) {
      setBusy(btn, null);
      if (err && err.name === 'OperationError') {
        form.pw.value = '';
        showError('Неверный пароль.');
        form.pw.focus();
      } else {
        console.error(err);
        showError('Хранилище повреждено или в неизвестном формате.');
      }
    }
  });
  root.querySelector('[data-action="forgot"]').addEventListener('click', showWipe);
  root.querySelector('[data-action="restore"]').addEventListener('click', pickBackup);
}

/* ---------- Сброс ---------- */

function showWipe() {
  const root = mount('tpl-wipe');
  const form = root.querySelector('form');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (form.confirm.value.trim().toUpperCase() !== 'СТЕРЕТЬ') return showError('Введите слово «СТЕРЕТЬ».');
    Vault.wipe();
    showSetup();
  });
  root.querySelector('[data-action="back"]').addEventListener('click', () => showLogin());
}

/* ---------- Мелкие помощники интерфейса ---------- */

const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ESC[c]);
const fmt = (n) => n.toLocaleString('ru-RU');

/** Отложенное сохранение поля ввода; flushInputs() дописывает его перед блокировкой. */
let pendingCommit = null;

function commitLater(fn) {
  if (pendingCommit) clearTimeout(pendingCommit.timer);
  pendingCommit = { fn, timer: setTimeout(flushInputs, 500) };
}

function flushInputs() {
  if (!pendingCommit) return;
  const { fn, timer } = pendingCommit;
  clearTimeout(timer);
  pendingCommit = null;
  fn();
}

/** Кнопка опасного действия: первое нажатие спрашивает, второе выполняет. */
function confirmPress(btn, question, action) {
  if (btn.dataset.armed) return action();
  const label = btn.textContent;
  btn.dataset.armed = '1';
  btn.classList.add('armed');
  btn.textContent = question;
  setTimeout(() => {
    if (!btn.isConnected) return;
    delete btn.dataset.armed;
    btn.classList.remove('armed');
    btn.textContent = label;
  }, 3000);
}

/* ---------- Всплывающие уведомления ---------- */

function toast({ title, main, sub, kind, action, ms = 4000 }) {
  let box = document.getElementById('toasts');
  if (!box) {
    box = document.createElement('div');
    box.id = 'toasts';
    box.className = 'toasts';
    document.body.append(box);
  }
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.setAttribute('role', 'status');
  el.innerHTML = '<div class="t-body"><div class="t-title"></div><div class="t-main"></div><div class="t-sub"></div></div>';
  el.querySelector('.t-title').textContent = title;
  el.querySelector('.t-main').textContent = main;
  if (sub) el.querySelector('.t-sub').textContent = sub;
  else el.querySelector('.t-sub').remove();

  const dismiss = () => {
    if (!el.isConnected || el.classList.contains('out')) return;
    el.classList.add('out');
    setTimeout(() => el.remove(), 250);
  };
  if (action) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = action.label;
    btn.addEventListener('click', () => { action.run(); dismiss(); });
    el.append(btn);
  }
  box.append(el);
  while (box.children.length > 3) box.firstElementChild.remove();
  setTimeout(dismiss, ms);
}

function clearToasts() {
  const box = document.getElementById('toasts');
  if (box) box.replaceChildren();
}

/* ---------- Окно поверх экрана ---------- */

let sheet = null;

function openSheet(title, body) {
  closeSheet();
  sheet = document.createElement('div');
  sheet.className = 'layer';
  sheet.innerHTML = `<section class="sys" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="scan"></div>
      <header class="sys-head"><div class="sys-icon">!</div><h2 class="sys-title">${esc(title)}</h2></header>
      ${body}
    </section>`;
  sheet.addEventListener('click', (e) => {
    if (e.target === sheet || e.target.closest('[data-action="close"]')) closeSheet();
  });
  document.body.append(sheet);
  document.documentElement.classList.add('noscroll');
  return sheet.querySelector('.sys');
}

function closeSheet() {
  if (!sheet) return;
  sheet.remove();
  sheet = null;
  document.documentElement.classList.remove('noscroll');
}

addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeSheet();
});

function sheetError(root, message) {
  root.querySelector('[data-error]').textContent = message;
  root.classList.remove('shake');
  void root.offsetWidth;
  root.classList.add('shake');
}

/* =====================================================================
   ОТКЛИК: звук, вибрация, частицы, окна «Система»
   ===================================================================== */

const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

/* ---------- Звук: синтез через Web Audio, без файлов ---------- */

const Sound = {
  ctx: null,
  master: null,

  /** Контекст создаётся и «будится» по нажатию — иначе iOS не даст играть звук. */
  context() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.55;
      this.master.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },

  tone(at, freq, dur, { type = 'sine', gain = 0.2, attack = 0.008, to = null } = {}) {
    const osc = this.ctx.createOscillator();
    const amp = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, at);
    if (to) osc.frequency.exponentialRampToValueAtTime(to, at + dur);
    amp.gain.setValueAtTime(0.0001, at);
    amp.gain.exponentialRampToValueAtTime(gain, at + attack);
    amp.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    osc.connect(amp).connect(this.master);
    osc.start(at);
    osc.stop(at + dur + 0.05);
  },

  /** delay — в секундах; отсчёт по часам аудио, поэтому звук сыграет и без нового нажатия. */
  play(name, delay = 0) {
    if (!session || !session.state.settings.sound) return;
    const ctx = this.context();
    if (!ctx) return;
    SOUNDS[name](ctx.currentTime + 0.02 + delay);
  },
};

const SOUNDS = {
  pop(t) {
    const ctx = Sound.ctx;
    const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.08), ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 4;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const band = ctx.createBiquadFilter();
    band.type = 'bandpass';
    band.frequency.value = 2400;
    band.Q.value = 0.8;
    const amp = ctx.createGain();
    amp.gain.value = 0.5;
    src.connect(band).connect(amp).connect(Sound.master);
    src.start(t);
    Sound.tone(t, 900, 0.07, { gain: 0.12, to: 240 });
  },
  quest(t) {
    Sound.tone(t, 1318.5, 0.16, { gain: 0.16 });
    Sound.tone(t + 0.07, 1975.5, 0.32, { gain: 0.14 });
    Sound.tone(t, 659.25, 0.2, { type: 'triangle', gain: 0.06 });
  },
  undo(t) {
    Sound.tone(t, 740, 0.18, { gain: 0.1, to: 420 });
  },
  levelUp(t) {
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
      Sound.tone(t + i * 0.075, f, 0.42, { type: 'triangle', gain: 0.16 });
    });
    Sound.tone(t + 0.38, 2093, 0.9, { gain: 0.05, attack: 0.05 });
    Sound.tone(t + 0.38, 1046.5, 1.0, { gain: 0.07, attack: 0.05 });
  },
  /** Фанфара достижения; land — когда медаль приземляется. */
  achievement(t, land = 0.9) {
    Sound.tone(t, 320, 0.8, { gain: 0.05, attack: 0.5, to: 1300 });
    [783.99, 1046.5, 1318.5, 1568].forEach((f, i) => {
      Sound.tone(t + land + i * 0.085, f, 0.34, { type: 'triangle', gain: 0.15 });
    });
    [1046.5, 1318.5, 1568].forEach((f) => {
      Sound.tone(t + land + 0.36, f, 1.4, { type: 'triangle', gain: 0.06, attack: 0.03 });
    });
    Sound.tone(t + land + 0.36, 2637, 0.7, { gain: 0.04 });
    Sound.tone(t + land + 0.5, 3136, 0.6, { gain: 0.03 });
  },
  boss(t, land = 0.9) {
    Sound.tone(t, 220, 0.85, { gain: 0.06, attack: 0.6, to: 900 });
    Sound.tone(t + land, 150, 1.0, { gain: 0.4, to: 36 });
    Sound.tone(t + land, 75, 1.2, { type: 'triangle', gain: 0.2, to: 30 });
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
      Sound.tone(t + land + 0.12 + i * 0.09, f, 0.4, { type: 'triangle', gain: 0.15 });
    });
    [523.25, 659.25, 783.99, 1046.5].forEach((f) => {
      Sound.tone(t + land + 0.6, f, 1.8, { type: 'triangle', gain: 0.06, attack: 0.08 });
    });
    [2093, 2637, 3136, 4186].forEach((f, i) => {
      Sound.tone(t + land + 0.7 + i * 0.07, f, 0.6, { gain: 0.035 });
    });
  },
  rankUp(t) {
    Sound.tone(t, 160, 1.1, { gain: 0.4, to: 38 });
    Sound.tone(t, 80, 1.3, { type: 'triangle', gain: 0.18, to: 30 });
    [392, 493.88, 587.33, 783.99].forEach((f) => {
      Sound.tone(t + 0.9, f, 1.8, { type: 'triangle', gain: 0.07, attack: 0.35 });
    });
    [1568, 1975.5, 2349.3, 3136].forEach((f, i) => {
      Sound.tone(t + 1.45 + i * 0.07, f, 0.6, { gain: 0.05 });
    });
  },
};

/* ---------- Вибрация ---------- */

let hapticLabel = null;

/**
 * Android — Vibration API. В Safari на iPhone его нет; там iOS 18+ даёт короткий
 * тактильный щелчок при переключении системного свитча — им и пользуемся.
 */
function haptic(pattern) {
  if (!session || !session.state.settings.haptics) return;
  if (navigator.vibrate) {
    navigator.vibrate(pattern);
    return;
  }
  if (!hapticLabel) {

  }
  hapticLabel.click();
}

/* ---------- Частицы: один холст поверх всего, работает только пока есть искры ---------- */

const FX = {
  canvas: null,
  ctx: null,
  parts: [],
  emitter: null,
  frame: 0,
  last: 0,

  ensure() {
    if (this.canvas) return;
    this.canvas = document.createElement('canvas');
    this.canvas.id = 'fx-canvas';
    document.body.append(this.canvas);
    this.ctx = this.canvas.getContext('2d');
    this.resize();
    addEventListener('resize', () => this.resize());
  },

  resize() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    this.dpr = dpr;
    this.canvas.width = innerWidth * dpr;
    this.canvas.height = innerHeight * dpr;
  },

  /** Взрыв искр из точки. */
  burst(x, y, { count = 24, color = '#66d0ff', speed = 260, life = 0.9, size = 2.4, gravity = 220, up = 0 } = {}) {
    if (reducedMotion.matches) return;
    this.ensure();
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = speed * (0.35 + Math.random() * 0.65);
      this.parts.push({
        x, y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v - up,
        g: gravity,
        life: life * (0.6 + Math.random() * 0.4),
        age: 0,
        size: size * (0.6 + Math.random() * 0.8),
        color,
      });
    }
    this.start();
  },

  /** Поток искр, поднимающихся снизу, — фон окна LEVEL UP. */
  rise(color, perSecond = 40) {
    if (reducedMotion.matches) return;
    this.ensure();
    this.emitter = (dt) => {
      const n = perSecond * dt + Math.random() * 0.5;
      for (let i = 0; i < n; i++) {
        this.parts.push({
          x: Math.random() * innerWidth,
          y: innerHeight + 10,
          vx: (Math.random() - 0.5) * 30,
          vy: -(90 + Math.random() * 180),
          g: 0,
          life: 2 + Math.random() * 1.8,
          age: 0,
          size: 0.8 + Math.random() * 1.6,
          color,
        });
      }
    };
    this.start();
  },

  start() {
    if (this.frame) return;
    this.last = performance.now();
    this.frame = requestAnimationFrame((t) => this.tick(t));
  },

  tick(now) {
    const dt = Math.min(0.05, (now - this.last) / 1000);
    this.last = now;
    if (this.emitter) this.emitter(dt);
    const { ctx, dpr } = this;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ctx.globalCompositeOperation = 'lighter';
    this.parts = this.parts.filter((p) => (p.age += dt) < p.life);
    for (const p of this.parts) {
      p.vy += p.g * dt;
      p.vx *= 0.985;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      const k = 1 - p.age / p.life;
      ctx.fillStyle = p.color;
      ctx.globalAlpha = k * 0.16;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 2.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = k;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (this.parts.length || this.emitter) {
      this.frame = requestAnimationFrame((t) => this.tick(t));
    } else {
      this.frame = 0;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
    }
  },

  stopRise() {
    this.emitter = null;
  },

  clear() {
    this.emitter = null;
    this.parts = [];
  },
};

/** «+25 XP», всплывающее над точкой. */

/* ---------- Полноэкранные окна LEVEL UP и повышения ранга ---------- */

let fxOverlay = null;
const fxQueue = [];

function closeFx() {
  fxQueue.length = 0;
  FX.clear();
  if (fxOverlay) fxOverlay.remove();
  fxOverlay = null;
}

/** Окна идут по очереди: следующее открывается, когда закрыли предыдущее. */
function queueFx(show) {
  if (!session) return;
  fxQueue.push(show);
  if (!fxOverlay) fxQueue.shift()();
}

function openFx(className, html, armAfterMs) {
  fxOverlay = document.createElement('div');
  fxOverlay.className = 'fx-overlay ' + className;
  fxOverlay.setAttribute('role', 'alertdialog');
  fxOverlay.innerHTML = html;
  document.body.append(fxOverlay);
  const btn = fxOverlay.querySelector('[data-action="accept"]');
  btn.disabled = true;
  setTimeout(() => { btn.disabled = false; }, reducedMotion.matches ? 0 : armAfterMs);
  btn.addEventListener('click', () => {
    const el = fxOverlay;
    fxOverlay = null;
    FX.stopRise();
    el.classList.add('out');
    setTimeout(() => el.remove(), 300);
    if (fxQueue.length) setTimeout(() => fxQueue.shift()(), 320);
  });
  return fxOverlay;
}

/** Счётчик опыта плавно докручивается до нового значения. */
function countTo(el, to) {
  const from = el.dataset.value === undefined ? to : Number(el.dataset.value);
  el.dataset.value = to;
  const token = (el._count = (el._count || 0) + 1);
  if (from === to || reducedMotion.matches) {
    el.textContent = fmt(to) + ' XP';
    return;
  }
  const t0 = performance.now();
  const step = (now) => {
    if (el._count !== token) return;
    const k = Math.min(1, (now - t0) / 800);
    el.textContent = fmt(Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)))) + ' XP';
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/** Полоса уровня в шапке; при повышении сначала доливается до конца. */
function setTopbarBar(level, pct) {
  const bar = app.querySelector('.topbar-xp > i');
  const prev = bar.dataset.level === undefined ? level : Number(bar.dataset.level);
  bar.dataset.level = level;
  clearTimeout(bar._reset);
  if (level > prev && !reducedMotion.matches) {
    bar.style.width = '100%';
    bar._reset = setTimeout(() => {
      bar.style.transition = 'none';
      bar.style.width = '0%';
      void bar.offsetWidth;
      bar.style.transition = '';
      bar.style.width = pct + '%';
    }, 900);
  } else {
    requestAnimationFrame(() => { bar.style.width = pct + '%'; });
  }
}

const LOG_PAGE = 50;
const ui = { tab: 'status', showAllDone: false, logLimit: LOG_PAGE };
let renderTimer = null;

function showHome() {
  ui.tab = 'status';
  ui.showAllDone = false;
  ui.logLimit = LOG_PAGE;
  mount('tpl-shell');
  app.classList.add('shell');
  app.querySelector('.topbar [data-action="lock"]').addEventListener('click', () => lock('manual'));
  app.querySelector('.topbar [data-action="open-settings"]').addEventListener('click', () => {
    flushInputs();
    ui.tab = 'settings';
    render();
    scrollTo(0, 0);
  });
  app.querySelector('.tabbar').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-tab]');
    if (!btn || btn.dataset.tab === ui.tab) return;
    flushInputs();
    ui.tab = btn.dataset.tab;
    ui.logLimit = LOG_PAGE;
    render();
    scrollTo(0, 0);
  });
  app.querySelector('[data-view]').addEventListener('click', onViewClick);
  app.querySelector('.fab').addEventListener('click', openNeedSheet);
  clearInterval(activeTimer);
  activeTimer = setInterval(tickActive, 1000);
  checkFinanceRewards();
  checkExperiments();
  ensureGroceryQuest();
  render();
}

function renderTopbar() {
  const p = playerInfo();
  app.querySelector('.topbar [data-bind="rankline"]').textContent = `Ранг ${p.rank} · Ур. ${p.level} · 🪙 ${fmt(goldBalance())}`;
  app.querySelector('.topbar [data-bind="name"]').textContent = session.state.profile.name;
  countTo(app.querySelector('.topbar [data-bind="xp"]'), p.xp);
  setTopbarBar(p.level, (p.into / p.need * 100).toFixed(1));
}

function render() {
  clearTimeout(renderTimer);
  if (!session || !app.classList.contains('shell')) return;
  renderTopbar();
  app.querySelectorAll('[data-tab]').forEach((b) => {
    if (b.dataset.tab === ui.tab) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  const view = app.querySelector('[data-view]');
  view.innerHTML = activeHtml() + VIEWS[ui.tab]();
  tickActive();
  if (ui.tab === 'settings') wireSettings(view);
  if (ui.tab === 'finance') wireFinance(view);
  // Полоски заполняются с нуля — видно, сколько набрано
  requestAnimationFrame(() => requestAnimationFrame(() => {
    view.querySelectorAll('.bar > i[data-pct], .goal-bar > i[data-pct], .fin-bar > i[data-pct]').forEach((i) => { i.style.width = i.dataset.pct + '%'; });
    view.querySelectorAll('.bar-track > i[data-h]').forEach((i) => { i.style.height = i.dataset.h + '%'; });
    if (ui.tab === 'state') layoutOrb(view);
  }));
}

const VIEWS = { status: statusView, quests: questsView, state: stateView, finance: financeView, journal: journalView, settings: settingsView };

function onViewClick(e) {
  const t = e.target.closest('[data-check], [data-edit], [data-stat], [data-goal], [data-radar], [data-energy], [data-drain], [data-exp], [data-inc], [data-item], [data-buy], [data-take], [data-worry], [data-leak], [data-xstop], [data-action], [data-day]');
  if (!t || !session) return;
  if (t.dataset.radar !== undefined) return selectRadarAxis(Number(t.dataset.radar));
  if (t.dataset.energy) return setEnergy(Number(t.dataset.energy));
  if (t.dataset.drain) return toggleDrain(t.dataset.drain);
  if (t.dataset.exp) return openExpenseEditor(t.dataset.exp);
  if (t.dataset.inc) return openIncomeEditor(t.dataset.inc);
  if (t.dataset.item) return openMenuItemEditor(t.dataset.item);
  if (t.dataset.buy) return buySpecial(t.dataset.buy, t);
  if (t.dataset.take) return takeItem(menuItem(t.dataset.take));
  if (t.dataset.worry) return resolveWorry(t.dataset.worry, t.dataset.how);
  if (t.dataset.leak) return openSpendCase(t.dataset.leak);
  if (t.dataset.xstop) return stopExperiment(t.dataset.xstop, t);
  if (t.dataset.day !== undefined) {
    // Нажатие на столбик показывает его значение
    const was = t.classList.contains('sel');
    t.parentElement.querySelectorAll('.sel').forEach((c) => c.classList.remove('sel'));
    if (!was) t.classList.add('sel');
    return;
  }
  if (t.dataset.check) return toggleQuest(t.dataset.check, t);
  if (t.dataset.edit) return openQuestEditor(findQuest(t.dataset.edit));
  if (t.dataset.stat) return openStatEditor(session.state.stats.find((s) => s.id === t.dataset.stat));
  if (t.dataset.goal) return openGoalEditor(findGoal(t.dataset.goal));
  switch (t.dataset.action) {
    case 'new-quest': return openQuestEditor(null);
    case 'new-stat': return openStatEditor(null);
    case 'new-goal': return openGoalEditor(null);
    case 'new-support': return openQuestEditor(null, { area: 'state' });
    case 'state-preset': return applyStatePreset();
    case 'edit-drains': return openDrainsEditor();
    case 'go-state': ui.tab = 'state'; render(); return scrollTo(0, 0);
    case 'fin-budget': return openBudgetEditor();
    case 'fin-check': return openReconcile();
    case 'grocery-basket': return openBasket();
    case 'grocery-now': return ensureGroceryQuest(true);
    case 'grocery-settings': return openFoodSettings();
    case 'evening': return openEveningFlow();
    case 'anxiety': return startAnxietyFlow();
    case 'active-done': return finishActive();
    case 'new-item': return openMenuItemEditor(null);
    case 'edit-steps': return openStepsEditor();
    case 'worries': ui.tab = 'state'; render(); return document.querySelector('[data-worries]') && document.querySelector('[data-worries]').scrollIntoView();
    case 'fin-nospend': return toggleNoSpend();
    case 'show-done': ui.showAllDone = !ui.showAllDone; return render();
    case 'more-log': ui.logLimit += LOG_PAGE; return render();
    case 'export': return exportBackup();
    case 'import': return pickBackup();
    case 'prologue': return pickBackup();
    case 'reset-xp': return resetXp();
    case 'reset-ranks': return resetRanks();
    case 'preview-level': return previewLevelUp();
    case 'preview-rank': return previewRankUp();
    case 'preview-goal': return previewAchievement('goal');
    case 'preview-epic': return previewAchievement('epic');
    case 'lock': return lock('manual');
  }
}

/* ---------- Квесты ---------- */

const DONE_PREVIEW = 5;

function findQuest(id) {
  return session.state.quests.find((q) => q.id === id);
}

function questsView() {
  const quests = session.state.quests.filter((q) => q.area !== 'state'); // опоры живут во вкладке «Состояние»
  const done = completionIndex();
  const byNewest = (a, b) => b.createdAt - a.createdAt;
  const recurring = quests.filter((q) => q.repeat !== 'none').sort(byNewest);
  const active = quests.filter((q) => q.repeat === 'none' && !done.has(q.id)).sort(byNewest);
  const finished = quests
    .filter((q) => q.repeat === 'none' && done.has(q.id))
    .sort((a, b) => done.get(b.id).at - done.get(a.id).at);

  let html = '<button class="btn add" type="button" data-action="new-quest">+ Новый квест</button>';
  if (!quests.length) {
    return html + `<div class="section-h">Квесты</div>
      <div class="panel empty"><b>Активных квестов нет</b>Добавьте первое дело — Система начислит опыт за выполнение.</div>`;
  }
  if (recurring.length) {
    const left = recurring.filter((q) => !done.has(q.id)).length;
    html += `<div class="section-h">Ежедневные квесты <span class="count">${recurring.length - left}/${recurring.length}</span></div>`;
    html += recurring.map((q) => questCard(q, done.get(q.id))).join('');
  }
  html += `<div class="section-h">Квесты <span class="count">${active.length}</span></div>`;
  html += active.length
    ? active.map((q) => questCard(q, null)).join('')
    : '<div class="panel empty">Все разовые квесты выполнены.</div>';
  if (finished.length) {
    const shown = ui.showAllDone ? finished : finished.slice(0, DONE_PREVIEW);
    html += `<div class="section-h">Выполнено <span class="count">${finished.length}</span></div>`;
    html += shown.map((q) => questCard(q, done.get(q.id))).join('');
    if (finished.length > DONE_PREVIEW) {
      html += `<button class="more" type="button" data-action="show-done">${ui.showAllDone ? 'Свернуть' : `Показать все (${finished.length})`}</button>`;
    }
  }
  return html;
}

function questCard(q, entry) {
  const xp = entry ? entry.xp : session.state.settings.xp[q.type];
  const names = q.stats.map(statName).filter((n) => n !== '—');
  const repeat = q.repeat === 'daily' ? '↻ день' : q.repeat === 'weekly' ? '↻ неделя' : q.repeat === 'xweek' ? `${weekCount(q)} из ${q.times} за неделю` : '';
  return `<article class="panel quest${entry ? ' done' : ''}">
    <button class="qcheck" type="button" data-check="${q.id}" role="checkbox" aria-checked="${!!entry}" aria-label="${entry ? 'Снять отметку' : 'Выполнено'}: ${esc(q.title)}"><span class="qbox"></span></button>
    <button class="qbody" type="button" data-edit="${q.id}">
      <span class="qtitle">${esc(q.title)}</span>
      ${q.note ? `<span class="qnote">${esc(q.note)}</span>` : ''}
      <span class="chips">
        <span class="chip t-${q.type}">${TYPE_BY_ID[q.type].name}</span>
        ${repeat ? `<span class="chip">${repeat}</span>` : ''}
        ${goalChip(q)}
        ${names.map((n) => `<span class="chip">${esc(n)}</span>`).join('')}
      </span>
    </button>
    <span class="qxp">+${fmt(xp)}</span>
  </article>`;
}

function toggleQuest(id, checkBtn) {
  const q = findQuest(id);
  if (!q) return;
  const entry = completionIndex().get(id);
  if (entry) return undoEntry(entry.id);

  const box = checkBtn.querySelector('.qbox').getBoundingClientRect();
  const x = box.left + box.width / 2;
  const y = box.top + box.height / 2;
  const xp = completeQuest(q);
  if (q.system === 'groceries') setTimeout(() => askGrocerySpend(), 900);
  floatXp(x + 40, y - 6, `+${fmt(xp)} XP`);
  FX.burst(x, y, { count: 26, speed: 300, life: 0.8, gravity: 260 });
  // Даём досмотреть вспышку, потом квест переезжает в «Выполнено»
  const card = checkBtn.closest('.quest');
  card.classList.add('done', 'flash');
  checkBtn.setAttribute('aria-checked', 'true');
  renderTopbar();
  clearTimeout(renderTimer);
  renderTimer = setTimeout(render, 700);
}

function completeQuest(q) {
  const { state } = session;
  const xp = state.settings.xp[q.type];
  const statIds = q.stats.filter((id) => state.stats.some((s) => s.id === id));
  const before = statXp();
  const playerBefore = playerInfo();
  const firstToday = !streakInfo().todayDone;
  const entry = {
    id: uid(),
    questId: q.id,
    title: q.title,
    type: q.type,
    xp,
    stats: splitXp(xp, statIds),
    period: periodKey(q.repeat),
    at: Date.now(),
  };
  state.log.push(entry);
  save();

  const after = statXp();
  const statUps = statIds
    .map((sid) => [sid, levelInfo(before.get(sid) || 0).level, levelInfo(after.get(sid) || 0).level])
    .filter(([, was, now]) => now > was)
    .map(([sid, , now]) => `${statName(sid)}: ур. ${now}`);
  const playerAfter = playerInfo();
  const rankUp = playerAfter.rank !== playerBefore.rank;
  const levelUp = playerAfter.level > playerBefore.level;

  Sound.play('quest');
  haptic(rankUp ? [30, 60, 30, 60, 80] : levelUp ? [30, 60, 50] : 25);
  toast({
    title: '[Квест выполнен]',
    main: `+${fmt(xp)} XP · +${fmt(entryGold(entry))} 🪙`,
    sub: Object.entries(entry.stats).map(([sid, v]) => `+${v} ${statName(sid)}`).join(' · '),
    action: { label: 'Отменить', run: () => undoEntry(entry.id) },
    ms: 6000,
  });

  if (firstToday) {
    const { current, best } = streakInfo();
    if (current >= 2) {
      toast({
        title: current >= best ? 'Серия · рекорд' : 'Серия продлена',
        main: `${current} ${plural(current, ['день', 'дня', 'дней'])} подряд`,
        kind: 'up',
        ms: 4500,
      });
    }
  }

  const goal = q.goalId && findGoal(q.goalId);
  if (goal && !goal.doneAt) {
    const g = goalProgress(goal);
    const allSteps = goal.kind === 'steps' && g.steps > 0 && g.stepsDone === g.steps;
    toast({
      title: `Цель · ${goal.title}`,
      main: goal.kind === 'steps' ? `${Math.floor(g.pct)}% · этап ${g.stepsDone} из ${g.steps}` : `+${fmt(xp)} XP к цели`,
      sub: allSteps ? 'Все этапы пройдены — отметьте цель достигнутой' : `Вложено в цель: ${fmt(g.xp)} XP`,
      kind: 'up',
      ms: 5000,
    });
  }

  // Окна по очереди: сначала достижение, потом уровень или ранг (ранг важнее уровня)
  const shows = [];
  if (q.type === 'goal' || q.type === 'epic') {
    const number = state.log.filter((e) => e.type === 'goal' || e.type === 'epic').length;
    const sub = Object.entries(entry.stats).map(([sid, v]) => `+${v} ${statName(sid)}`).join(' · ');
    shows.push(() => showAchievement({ title: q.title, type: q.type, xp, sub, number, onUndo: () => undoEntry(entry.id) }));
  }
  if (rankUp) {
    shows.push(() => showRankUp({ fromRank: playerBefore.rank, toRank: playerAfter.rank, level: playerAfter.level, statUps }));
  } else if (levelUp) {
    shows.push(() => showLevelUp({ from: playerBefore.level, to: playerAfter.level, statUps }));
  }
  if (shows.length) {
    setTimeout(() => {
      if (!session || !session.state.log.includes(entry)) return; // успели отменить
      shows.forEach(queueFx);
    }, 450);
  }
  if (rankUp || levelUp) {
    // характеристики покажет окно уровня или ранга
  } else if (statUps.length === 1) {
    toast({ title: 'Характеристика повышена', main: statUps[0], kind: 'up', ms: 5000 });
  } else if (statUps.length > 1) {
    toast({ title: 'Характеристики повышены', main: `+${statUps.length}`, sub: statUps.join(' · '), kind: 'up', ms: 5000 });
  }
  return xp;
}

/** Откат отметки: запись удаляется из журнала, опыт пересчитывается. */
function undoEntry(entryId) {
  if (!session) return;
  const { log } = session.state;
  const i = log.findIndex((e) => e.id === entryId);
  if (i < 0) return;
  const [entry] = log.splice(i, 1);
  save();
  Sound.play('undo');
  haptic(15);
  toast({ title: 'Отметка снята', main: `−${fmt(entry.xp)} XP`, kind: 'minus', ms: 3000 });
  render();
}

function openQuestEditor(quest, opts = {}) {
  const { state } = session;
  const area = quest ? quest.area : opts.area;
  const support = area === 'state';
  const q = quest || { title: '', note: '', type: 'normal', stats: [], repeat: support ? 'daily' : 'none', times: 3 };
  const root = openSheet(support ? (quest ? 'Опора' : 'Новая опора') : (quest ? 'Квест' : 'Новый квест'), `
    <form novalidate>
      <label class="field"><span>Название</span>
        <input name="title" type="text" maxlength="120" autocomplete="off" value="${esc(q.title)}">
      </label>
      <label class="field"><span>Заметка</span>
        <textarea name="note" rows="2" maxlength="1000" placeholder="Необязательно">${esc(q.note)}</textarea>
      </label>
      <div class="field"><span>Тип</span>
        <div class="choices types">${TASK_TYPES.map((t) => `
          <label class="choice t-${t.id}"><input type="radio" name="type" value="${t.id}"${q.type === t.id ? ' checked' : ''}>
            <span><b>${t.name}</b><small>+${fmt(state.settings.xp[t.id])} XP</small></span></label>`).join('')}
        </div>
      </div>
      <div class="field"><span>Характеристики</span>
        <div class="choices">${state.stats.map((s) => `
          <label class="choice"><input type="checkbox" name="stats" value="${s.id}"${q.stats.includes(s.id) ? ' checked' : ''}>
            <span>${esc(s.name)}</span></label>`).join('')}
        </div>
        <div class="hint" data-split></div>
      </div>
      ${support ? supportRepeatHtml(q) : `<div class="field"><span>Повтор</span>
        <div class="choices">${Object.entries(REPEATS).map(([v, label]) => `
          <label class="choice"><input type="radio" name="repeat" value="${v}"${q.repeat === v ? ' checked' : ''}>
            <span>${label}</span></label>`).join('')}
        </div>
      </div>`}
      ${goalChoicesHtml(q.goalId)}
      <p class="error" data-error></p>
      <button class="btn" type="submit">${quest ? 'Сохранить' : 'Принять квест'}</button>
      ${quest ? '<button class="btn ghost danger-text" type="button" data-action="delete">Удалить квест</button>' : ''}
      <button class="btn ghost" type="button" data-action="close">Отмена</button>
    </form>`);

  const form = root.querySelector('form');
  const f = form.elements;
  const selectedStats = () => [...form.querySelectorAll('input[name="stats"]:checked')].map((i) => i.value);
  const splitHint = root.querySelector('[data-split]');
  const updateSplit = () => {
    const parts = Object.entries(splitXp(state.settings.xp[f.type.value], selectedStats()));
    splitHint.textContent = parts.length
      ? parts.map(([id, v]) => `+${v} ${statName(id)}`).join(' · ')
      : 'Опыт делится поровну между выбранными.';
  };
  form.addEventListener('change', updateSplit);
  updateSplit();
  const timesField = root.querySelector('[data-times]');
  if (timesField) {
    const syncTimes = () => { timesField.hidden = f.repeat.value !== 'xweek'; };
    form.addEventListener('change', syncTimes);
    syncTimes();
  }
  if (!quest) f.title.focus();

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const title = f.title.value.trim();
    const stats = selectedStats();
    if (!title) return sheetError(root, 'Введите название квеста.');
    if (!stats.length) return sheetError(root, 'Выберите хотя бы одну характеристику.');
    const data = { title, note: f.note.value.trim(), type: f.type.value, stats, repeat: f.repeat.value, goalId: (f.goal && f.goal.value) || undefined };
    if (support) Object.assign(data, { area: 'state', times: data.repeat === 'xweek' ? Number(f.times.value) || 3 : undefined });
    if (quest) Object.assign(quest, data);
    else state.quests.push({ id: uid(), createdAt: Date.now(), ...data });
    save();
    closeSheet();
    render();
  });

  const del = root.querySelector('[data-action="delete"]');
  if (del) {
    del.addEventListener('click', () => confirmPress(del, 'Точно удалить? Нажмите ещё раз', () => {
      // Заработанный опыт остаётся в журнале
      state.quests = state.quests.filter((x) => x.id !== quest.id);
      save();
      closeSheet();
      render();
    }));
  }
}

/* ---------- Журнал ---------- */

const WEEKDAYS = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];

function countersHtml() {
  const days = xpByDay();
  const today = days.get(dayKey(new Date()));
  const st = streakInfo();
  return `<div class="counters four">
      <div><b>${fmt(today ? today.xp : 0)}</b><small>XP сегодня</small></div>
      <div><b>${fmt(weekXp())}</b><small>XP за неделю</small></div>
      <div class="streak${st.todayDone ? '' : ' cold'}"><b>${st.current}</b><small>${plural(st.current, ['день', 'дня', 'дней'])} подряд</small></div>
      <div><b>${fmt(session.state.log.length)}</b><small>Квестов выполнено</small></div>
    </div>
    ${st.current > 0 && !st.todayDone ? '<p class="streak-hint warn">Выполните квест сегодня, чтобы не прервать серию.</p>' : ''}`;
}

function dayTitle(date) {
  const key = dayKey(date);
  if (key === dayKey(new Date())) return 'Сегодня';
  if (key === dayKey(addDays(new Date(), -1))) return 'Вчера';
  return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', weekday: 'short' });
}

function chartHtml() {
  const days = xpByDay();
  const now = new Date();
  const cols = [];
  for (let i = 6; i >= 0; i--) {
    const d = addDays(now, -i);
    const day = days.get(dayKey(d));
    cols.push({ d, xp: day ? day.xp : 0, today: i === 0 });
  }
  const max = Math.max(...cols.map((c) => c.xp));
  const maxIdx = max > 0 ? cols.findIndex((c) => c.xp === max) : -1;
  const sum = cols.reduce((a, c) => a + c.xp, 0);
  return `<div class="panel chart">
      <div class="chart-head"><b>Опыт за 7 дней</b><span>${fmt(sum)} XP</span></div>
      <div class="bars">${cols.map((c, i) => `
        <button class="bar-col${c.today || i === maxIdx ? ' lbl' : ''}" type="button" data-day="${i}" aria-label="${dayTitle(c.d)}: ${fmt(c.xp)} XP">
          <span class="bar-val">${fmt(c.xp)}</span>
          <span class="bar-track"><i data-h="${max ? (c.xp / max * 100).toFixed(1) : 0}"></i></span>
        </button>`).join('')}
      </div>
      <div class="bar-days">${cols.map((c) => `<span${c.today ? ' class="today"' : ''}>${WEEKDAYS[c.d.getDay()]}</span>`).join('')}</div>
    </div>`;
}

function journalView() {
  const { log } = session.state;
  const st = streakInfo();
  let html = `<div class="section-h">Статистика</div>
    <div class="panel pad">
      ${countersHtml()}
      <p class="streak-hint">Рекорд серии: ${st.best} ${plural(st.best, ['день', 'дня', 'дней'])}</p>
    </div>
    ${chartHtml()}
    <div class="section-h">Журнал <span class="count">${log.length}</span></div>`;
  if (!log.length) {
    return html + '<div class="panel empty"><b>Записей пока нет</b>Здесь появится каждый выполненный квест с датой и опытом.</div>';
  }
  const prologue = log.filter(isPrologue).sort((a, b) => a.at - b.at);
  const entries = log.filter((e) => !isPrologue(e)).sort((a, b) => b.at - a.at).concat(prologue);
  const shown = entries.slice(0, ui.logLimit);
  const days = xpByDay();
  days.set('prologue', { xp: prologue.reduce((sum, e) => sum + e.xp, 0), count: prologue.length });
  let currentKey = null;
  let rows = '';
  const flush = () => { if (rows) html += `<div class="panel log-list">${rows}</div>`; rows = ''; };
  for (const e of shown) {
    const date = new Date(e.at);
    const key = isPrologue(e) ? 'prologue' : dayKey(date);
    if (key !== currentKey) {
      flush();
      const day = days.get(key);
      html += `<div class="day-h">${key === 'prologue' ? 'Пролог' : dayTitle(date)}<span>+${fmt(day.xp)} XP · ${day.count} ${plural(day.count, ['квест', 'квеста', 'квестов'])}</span></div>`;
      currentKey = key;
    }
    const stats = Object.entries(e.stats).map(([id, v]) => `+${v} ${esc(statName(id))}`).join(' · ');
    const type = TYPE_BY_ID[e.type];
    rows += `<div class="log-row">
        <span class="log-time">${isPrologue(e) ? '✦' : date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}</span>
        <span class="log-title">${esc(e.title)}</span>
        <span class="log-xp">+${fmt(e.xp)}</span>
        <span class="log-sub">${type ? `<span class="chip t-${e.type}">${type.name}</span>` : ''}${stats}</span>
      </div>`;
  }
  flush();
  if (entries.length > shown.length) {
    html += `<button class="more" type="button" data-action="more-log">Показать ещё (${entries.length - shown.length})</button>`;
  }
  return html;
}

/* ---------- Главные цели ----------
   Цель «по этапам»: прогресс = выполненные разовые квесты цели / все разовые квесты цели.
   Цель «по числу»: прогресс = current / target (например, доход в месяц).
   Квест привязан к цели через quest.goalId; опыт таких квестов показывается как вложенный в цель. */

const GOAL_COLORS = ['#66d0ff', '#ffc56b', '#6dffc0', '#b99bff', '#ff8a5c'];

function findGoal(id) {
  return session.state.goals.find((g) => g.id === id);
}

/** Текущее значение цели «по числу»; для цели по доходу — поступления этого месяца. */
function goalCurrent(goal) {
  return goal.autoIncome ? incomesThisMonth() : goal.current;
}

function goalProgress(goal, done = completionIndex()) {
  const { quests, log } = session.state;
  const linked = quests.filter((q) => q.goalId === goal.id);
  const steps = linked.filter((q) => q.repeat === 'none');
  const stepsDone = steps.filter((q) => done.has(q.id)).length;
  const ids = new Set(linked.map((q) => q.id));
  const xp = log.reduce((sum, e) => sum + (ids.has(e.questId) ? e.xp : 0), 0);
  let pct = 0;
  if (goal.doneAt) pct = 100;
  else if (goal.kind === 'number') pct = goal.target > 0 ? Math.max(0, Math.min(100, (goalCurrent(goal) / goal.target) * 100)) : 0;
  else if (steps.length) pct = (stepsDone / steps.length) * 100;
  return { pct, steps: steps.length, stepsDone, xp, count: linked.length };
}

function goalCard(goal, done) {
  const g = goalProgress(goal, done);
  let marks = '';
  if (goal.kind === 'steps' && g.steps > 1 && g.steps <= 24) {
    for (let k = 1; k < g.steps; k++) marks += `<b style="left:${((k / g.steps) * 100).toFixed(2)}%"></b>`;
  } else if (goal.kind === 'number') {
    marks = [25, 50, 75].map((k) => `<b class="q" style="left:${k}%"></b>`).join('');
  }
  let left;
  if (goal.doneAt) left = `Достигнута ${new Date(goal.doneAt).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' })}`;
  else if (goal.kind === 'number') left = `${fmt(goalCurrent(goal))} / ${fmt(goal.target)} ${esc(goal.unit)}${goal.autoIncome ? ' · из «Финансов»' : ''}`;
  else if (g.steps) left = `Этапы: ${g.stepsDone} из ${g.steps}`;
  else left = '<span class="goal-empty">Добавьте квесты-этапы</span>';
  return `<button class="panel goal${goal.doneAt ? ' done' : ''}" type="button" data-goal="${goal.id}" style="--gc:${goal.color}">
      <span class="goal-top"><span class="goal-name">${esc(goal.title)}</span><span class="goal-pct">${Math.floor(g.pct)}%</span></span>
      <span class="goal-bar"><i data-pct="${g.pct.toFixed(1)}"></i>${marks}</span>
      <span class="goal-sub"><span>${left}</span><span>${g.xp ? `+${fmt(g.xp)} XP` : ''}</span></span>
    </button>`;
}

function goalsHtml() {
  const { goals } = session.state;
  const done = completionIndex();
  const order = goals.filter((g) => !g.doneAt).concat(goals.filter((g) => g.doneAt));
  return `<div class="section-h">Цели <span class="count">${goals.filter((g) => !g.doneAt).length}</span></div>
    ${order.length ? order.map((g) => goalCard(g, done)).join('') : '<div class="panel empty"><b>Главных целей пока нет</b>Поставьте цель — Система покажет, сколько до неё осталось.</div>'}
    <button class="btn" type="button" data-action="new-goal">+ Цель</button>`;
}

function goalChip(q) {
  const goal = q.goalId && findGoal(q.goalId);
  return goal ? `<span class="chip goal-chip" style="--gc:${goal.color}">◎ ${esc(goal.title)}</span>` : '';
}

/** Выбор цели в окне квеста. */
function goalChoicesHtml(goalId) {
  const goals = session.state.goals.filter((g) => !g.doneAt || g.id === goalId);
  if (!goals.length) return '';
  return `<div class="field"><span>Цель</span>
      <div class="choices">
        <label class="choice"><input type="radio" name="goal" value=""${goalId ? '' : ' checked'}><span>Без цели</span></label>
        ${goals.map((g) => `<label class="choice"><input type="radio" name="goal" value="${g.id}"${goalId === g.id ? ' checked' : ''}><span style="color:${g.color}">◎ ${esc(g.title)}</span></label>`).join('')}
      </div>
    </div>`;
}

function openGoalEditor(goal) {
  const { state } = session;
  const g = goal || { title: '', kind: 'steps', target: 0, current: 0, unit: '₸' };
  const done = completionIndex();
  const quests = state.quests.slice().sort((a, b) => {
    const la = goal && a.goalId === goal.id ? 0 : 1;
    const lb = goal && b.goalId === goal.id ? 0 : 1;
    return la - lb || Number(done.has(a.id)) - Number(done.has(b.id)) || b.createdAt - a.createdAt;
  });
  const linkRow = (q) => {
    const other = q.goalId && (!goal || q.goalId !== goal.id) && findGoal(q.goalId);
    const meta = [done.has(q.id) ? '✓ выполнен' : 'активный', q.repeat !== 'none' ? 'повторяется' : '', other ? `сейчас в «${esc(other.title)}»` : ''].filter(Boolean).join(' · ');
    return `<label class="check"><input type="checkbox" name="link" value="${q.id}"${goal && q.goalId === goal.id ? ' checked' : ''}>
      <span>${esc(q.title)}<small>${meta}</small></span></label>`;
  };
  const root = openSheet(goal ? 'Цель' : 'Новая цель', `
    <form novalidate>
      <label class="field"><span>Название</span>
        <input name="title" type="text" maxlength="80" autocomplete="off" value="${esc(g.title)}" placeholder="Например: получить документы">
      </label>
      <div class="field"><span>Как считать прогресс</span>
        <div class="choices">
          <label class="choice"><input type="radio" name="kind" value="steps"${g.kind === 'steps' ? ' checked' : ''}><span>По этапам — квестам</span></label>
          <label class="choice"><input type="radio" name="kind" value="number"${g.kind === 'number' ? ' checked' : ''}><span>По числу</span></label>
        </div>
        <div class="hint" data-kind-hint></div>
      </div>
      <div data-number>
        <label class="field"><span>Цель</span>
          <span class="xp-input"><input name="target" type="number" inputmode="numeric" min="1" step="1" value="${g.target || ''}" placeholder="300000" style="width:100%;text-align:left"></span>
        </label>
        <label class="field"><span>Сейчас</span>
          <span class="xp-input"><input name="current" type="number" inputmode="numeric" min="0" step="1" value="${g.current || 0}" style="width:100%;text-align:left"></span>
        </label>
        <label class="check"><input name="autoIncome" type="checkbox"${g.autoIncome ? ' checked' : ''}><span>Считать «сейчас» по поступлениям этого месяца из «Финансов»</span></label>
        <label class="field"><span>Единица</span>
          <input name="unit" type="text" maxlength="12" autocomplete="off" value="${esc(g.unit || '')}" placeholder="₸">
        </label>
      </div>
      <div class="field"><span>Квесты цели</span>
        ${quests.length ? `<div class="link-list">${quests.map(linkRow).join('')}</div>` : '<div class="hint">Квестов пока нет. Новые квесты привязываются к цели в их окне.</div>'}
      </div>
      <p class="error" data-error></p>
      <button class="btn" type="submit">${goal ? 'Сохранить' : 'Поставить цель'}</button>
      ${goal && !goal.doneAt ? '<button class="btn gold" type="button" data-action="achieve">Цель достигнута</button>' : ''}
      ${goal && goal.doneAt ? '<button class="btn ghost" type="button" data-action="reopen">Вернуть в работу</button>' : ''}
      ${goal ? '<button class="btn ghost danger-text" type="button" data-action="delete">Удалить цель</button>' : ''}
      <button class="btn ghost" type="button" data-action="close">Отмена</button>
    </form>`);

  const form = root.querySelector('form');
  const f = form.elements;
  const numberBox = root.querySelector('[data-number]');
  const kindHint = root.querySelector('[data-kind-hint]');
  const syncKind = () => {
    const number = f.kind.value === 'number';
    numberBox.hidden = !number;
    kindHint.textContent = number
      ? 'Полоса — «сейчас / цель». Значение «сейчас» обновляйте здесь.'
      : 'Полоса — доля выполненных квестов-этапов. Добавьте и будущие шаги как квесты.';
  };
  form.addEventListener('change', (e) => { if (e.target.name === 'kind') syncKind(); });
  syncKind();
  if (!goal) f.title.focus();

  /** Переносит поля формы в цель; null — если что-то не так. */
  const apply = () => {
    const title = f.title.value.trim();
    const kind = f.kind.value;
    const target = Math.round(Number(f.target.value));
    if (!title) return sheetError(root, 'Введите название цели.'), null;
    if (kind === 'number' && !(target > 0)) return sheetError(root, 'Укажите, сколько нужно набрать.'), null;
    const target_ = goal || { id: uid(), createdAt: Date.now(), doneAt: null, color: GOAL_COLORS[state.goals.length % GOAL_COLORS.length] };
    Object.assign(target_, {
      title,
      kind,
      target: kind === 'number' ? target : 0,
      current: kind === 'number' ? Math.max(0, Math.round(Number(f.current.value)) || 0) : 0,
      autoIncome: kind === 'number' && f.autoIncome.checked,
      unit: f.unit.value.trim(),
    });
    if (!goal) state.goals.push(target_);
    for (const box of form.querySelectorAll('input[name="link"]')) {
      const q = findQuest(box.value);
      if (!q) continue;
      if (box.checked) q.goalId = target_.id;
      else if (q.goalId === target_.id) delete q.goalId;
    }
    return target_;
  };

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!apply()) return;
    save();
    closeSheet();
    render();
  });

  const achieve = root.querySelector('[data-action="achieve"]');
  if (achieve) {
    achieve.addEventListener('click', () => confirmPress(achieve, 'Точно достигнута? Нажмите ещё раз', () => {
      if (!apply()) return;
      closeSheet();
      completeGoal(goal);
    }));
  }
  const reopen = root.querySelector('[data-action="reopen"]');
  if (reopen) {
    reopen.addEventListener('click', () => {
      closeSheet();
      reopenGoal(goal);
    });
  }
  const del = root.querySelector('[data-action="delete"]');
  if (del) {
    del.addEventListener('click', () => confirmPress(del, 'Квесты останутся. Удалить цель?', () => {
      state.goals = state.goals.filter((x) => x.id !== goal.id);
      for (const q of state.quests) if (q.goalId === goal.id) delete q.goalId;
      save();
      closeSheet();
      render();
    }));
  }
}

/** Цель достигнута: опыт эпического квеста и ачивка «Цель достигнута». */
function completeGoal(goal) {
  const { state } = session;
  const before = playerInfo();
  const xp = state.settings.xp.epic;
  const entry = { id: uid(), questId: null, goalId: goal.id, title: `Цель: ${goal.title}`, type: 'epic', xp, stats: {}, period: null, at: Date.now(), source: 'goal' };
  state.log.push(entry);
  goal.doneAt = entry.at;
  save();
  render();
  const after = playerInfo();
  Sound.play('quest');
  haptic([30, 60, 30, 60, 80]);
  const number = state.log.filter((e) => e.type === 'goal' || e.type === 'epic').length;
  queueFx(() => showAchievement({ title: goal.title, type: 'epic', xp, label: 'Цель достигнута', sub: 'Главная цель закрыта', number, onUndo: () => reopenGoal(goal), undoLabel: 'Вернуть в работу' }));
  if (after.rank !== before.rank) queueFx(() => showRankUp({ fromRank: before.rank, toRank: after.rank, level: after.level }));
  else if (after.level > before.level) queueFx(() => showLevelUp({ from: before.level, to: after.level }));
}

/** Возвращает цель в работу и снимает опыт за её достижение. */
function reopenGoal(goal) {
  if (!session) return;
  const { state } = session;
  const entry = state.log.find((e) => e.source === 'goal' && e.goalId === goal.id);
  goal.doneAt = null;
  if (entry) state.log.splice(state.log.indexOf(entry), 1);
  save();
  render();
  toast({ title: `Цель · ${goal.title}`, main: 'Снова в работе', sub: entry ? `−${fmt(entry.xp)} XP` : '', kind: 'minus', ms: 3000 });
}

/* ---------- Колесо баланса ----------
   Радар по характеристикам: длина луча — уровень с учётом прогресса внутри уровня.
   Баланс — слабейшая характеристика в процентах от сильнейшей. */

const RADAR = { w: 500, h: 380, cx: 250, cy: 186, r: 112 };

function radarData() {
  const xpMap = statXp();
  return session.state.stats.map((st) => {
    const xp = xpMap.get(st.id) || 0;
    const info = levelInfo(xp);
    return { name: st.name, xp, ...info, value: info.level + info.into / info.need };
  });
}

function radarPoint(i, n, k) {
  const a = -Math.PI / 2 + (2 * Math.PI * i) / n;
  return [RADAR.cx + Math.cos(a) * RADAR.r * k, RADAR.cy + Math.sin(a) * RADAR.r * k];
}

/** Подпись оси: длинное название — в две строки. */
function radarLabel(name, i, n, cls) {
  const [x, y] = radarPoint(i, n, 1.16);
  const dx = x - RADAR.cx;
  const anchor = Math.abs(dx) < 8 ? 'middle' : dx > 0 ? 'start' : 'end';
  const words = name.split(' ');
  const lines = name.length > 12 && words.length > 1
    ? [words.slice(0, Math.ceil(words.length / 2)).join(' '), words.slice(Math.ceil(words.length / 2)).join(' ')]
    : [name];
  const y0 = y - (lines.length - 1) * 8 + 5;
  return `<text x="${x.toFixed(1)}" y="${y0.toFixed(1)}" text-anchor="${anchor}" class="${cls}" data-radar="${i}" data-label="${i}">${lines
    .map((l, k) => `<tspan x="${x.toFixed(1)}" dy="${k ? 17 : 0}">${esc(l)}</tspan>`).join('')}</text>`;
}

function radarHtml() {
  const data = radarData();
  const n = data.length;
  if (n < 3) {
    return `<div class="section-h">Колесо баланса</div>
      <div class="panel empty">Нужно минимум 3 характеристики, чтобы построить колесо.</div>`;
  }
  const max = Math.max(...data.map((d) => d.value));
  const min = Math.min(...data.map((d) => d.value));
  const scale = Math.max(5, Math.ceil(max));
  const weak = data.findIndex((d) => d.value === min);
  const strong = data.findIndex((d) => d.value === max);
  const balance = Math.round((min / max) * 100);
  const ring = (k) => Array.from({ length: n }, (_, i) => radarPoint(i, n, k).map((v) => v.toFixed(1)).join(',')).join(' ');
  const step = scale <= 10 ? 1 : Math.ceil(scale / 5);
  let grid = '';
  for (let lv = step; lv <= scale; lv += step) grid += `<polygon points="${ring(lv / scale)}"${lv + step > scale ? ' class="outer"' : ''}/>`;
  for (let i = 0; i < n; i++) {
    const [x, y] = radarPoint(i, n, 1);
    grid += `<line x1="${RADAR.cx}" y1="${RADAR.cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
  }
  const pts = data.map((d, i) => radarPoint(i, n, d.value / scale));
  const shape = pts.map((p) => p.map((v) => v.toFixed(1)).join(',')).join(' ');
  const dots = pts.map(([x, y], i) => `<circle class="pt${i === weak && min < max ? ' weak' : ''}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5"/>`).join('');
  const hits = pts.map(([x, y], i) => `<circle class="hit" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="20" data-radar="${i}"/>`).join('');
  const labels = data.map((d, i) => radarLabel(d.name, i, n, i === weak && min < max ? 'weak' : '')).join('');
  const caption = min < max
    ? `Сильнее всего: <b>${esc(data[strong].name)}</b> · ур. ${data[strong].level}. Слабое место: <b>${esc(data[weak].name)}</b> · ур. ${data[weak].level} — возьмите квест на неё.`
    : 'Все характеристики на одном уровне. Нажмите на точку, чтобы увидеть детали.';
  return `<div class="section-h">Колесо баланса</div>
    <div class="panel radar">
      <div class="chart-head"><b>Баланс ${balance}%</b><span>кольца — уровни 1–${scale}</span></div>
      <svg viewBox="0 0 ${RADAR.w} ${RADAR.h}" role="img" aria-label="Колесо баланса: ${data.map((d) => `${esc(d.name)} — уровень ${d.level}`).join(', ')}">
        <g class="grid">${grid}</g>
        <g class="shape-g"><polygon class="shape" points="${shape}"/>${dots}</g>
        ${labels}
        ${hits}
      </svg>
      <p class="radar-caption" data-radar-caption>${caption}</p>
    </div>`;
}

/** Нажатие на точку или подпись — подробности по характеристике. */
function selectRadarAxis(i) {
  const d = radarData()[i];
  const caption = app.querySelector('[data-radar-caption]');
  if (!d || !caption) return;
  app.querySelectorAll('.radar text').forEach((t) => t.classList.toggle('sel', Number(t.dataset.label) === i));
  caption.innerHTML = `<b>${esc(d.name)}</b> · ур. ${d.level} · ${fmt(d.into)} / ${fmt(d.need)} XP до следующего · всего ${fmt(d.xp)} XP`;
}

/* ---------- Состояние ----------
   Опоры — обязательные квесты (area: 'state'): каждый день или N раз в неделю.
   Состояние дня = выполненные опоры / (ежедневные опоры + выполненные в этот день недельные) − 15 % за каждый слив.
   Недельная опора не снижает состояние в день отдыха, но поднимает его, когда сделана. */

const DRAIN_PENALTY = 15;
const ENERGY_WORDS = ['пусто', 'мало', 'норма', 'хорошо', 'полон'];

/** Стартовый набор по схеме «опоры → состояние → энергия»; всё можно поменять. */
const STATE_PRESET = {
  supports: [
    { title: 'Сон', note: 'Лечь вовремя и выспаться', repeat: 'daily', stats: ['Дисциплина'] },
    { title: 'Тренировка', note: '', repeat: 'xweek', times: 3, stats: ['Сила'] },
    { title: 'Питание', note: 'Нормально поесть, без мусора', repeat: 'daily', stats: ['Сила', 'Дисциплина'] },
    { title: 'Майндсет', note: 'Работа над убеждениями и идентичностью', repeat: 'daily', stats: ['Интеллект', 'Сила'] },
    { title: 'Время наедине', note: 'Без людей и телефона', repeat: 'daily', stats: ['Творческая реализация'] },
    { title: 'Проявленность: танцы и творчество', note: '', repeat: 'xweek', times: 3, stats: ['Проявленность', 'Харизма'] },
  ],
  drains: ['Отношения в одни ворота', 'Общение с людьми с другим майндсетом', 'Напряжённое общение с родителями', 'Залип в Insta / TikTok'],
};

const supports = () => session.state.quests.filter((q) => q.area === 'state');

function dayData(key) {
  return session.state.days[key] || { drains: [], energy: null };
}

function setDayData(key, patch) {
  const day = Object.assign({ drains: [], energy: null }, session.state.days[key], patch);
  session.state.days[key] = day;
}

/** Сколько раз опора отмечена на этой неделе. */
function weekCount(q, now = new Date()) {
  const week = weekKey(now);
  return session.state.log.filter((e) => e.questId === q.id && weekKey(new Date(e.at)) === week).length;
}

/** dayKey → Set(questId) выполненных в этот день опор. */
function supportDoneByDay() {
  const ids = new Set(supports().map((q) => q.id));
  const map = new Map();
  for (const e of session.state.log) {
    if (!ids.has(e.questId) || !e.period || !e.period.startsWith('d:')) continue;
    const key = e.period.slice(2);
    if (!map.has(key)) map.set(key, new Set());
    map.get(key).add(e.questId);
  }
  return map;
}

/** Состояние дня 0–100 или null, если опор тогда ещё не было. */
function dayScore(date, doneByDay = supportDoneByDay()) {
  const key = dayKey(date);
  const end = addDays(date, 1).getTime();
  const list = supports().filter((q) => q.createdAt < end);
  if (!list.length) return null;
  const done = doneByDay.get(key) || new Set();
  const daily = list.filter((q) => q.repeat === 'daily');
  const weeklyDone = list.filter((q) => q.repeat === 'xweek' && done.has(q.id)).length;
  const dailyDone = daily.filter((q) => done.has(q.id)).length;
  const denom = daily.length + weeklyDone;
  const base = denom ? ((dailyDone + weeklyDone) / denom) * 100 : 100;
  const drains = dayData(key).drains.length;
  return { score: Math.max(0, Math.min(100, Math.round(base - DRAIN_PENALTY * drains))), dailyDone, daily: daily.length, weeklyDone, drains };
}

function scoreClass(v) {
  if (v >= 80) return ['full', 'Заряжен'];
  if (v >= 50) return ['good', 'Норма'];
  if (v >= 25) return ['mid', 'Просадка'];
  return ['low', 'На нуле'];
}

/** Ранние сигналы: ежедневная опора без отметки 2+ дня, недельная — не успевается. */
function supportWarnings() {
  const doneByDay = supportDoneByDay();
  const today = new Date();
  const out = [];
  for (const q of supports()) {
    if (q.repeat === 'daily') {
      let miss = 0;
      for (let i = 1; i <= 7; i++) {
        const d = addDays(today, -i);
        if (q.createdAt >= addDays(d, 1).getTime()) break; // опоры тогда ещё не было
        if ((doneByDay.get(dayKey(d)) || new Set()).has(q.id)) break;
        miss++;
      }
      if (miss >= 2) out.push(`${q.title} — ${miss} ${plural(miss, ['день', 'дня', 'дней'])} без отметки`);
    } else if (q.repeat === 'xweek' && weekKey(new Date(q.createdAt)) !== weekKey(today)) {
      // опору, заведённую на этой неделе, не торопим
      const left = q.times - weekCount(q, today);
      const daysLeft = 7 - ((today.getDay() + 6) % 7); // включая сегодня
      if (left > 0 && left >= daysLeft) out.push(`${q.title} — нужно ещё ${left} из ${q.times}, а дней осталось ${daysLeft}`);
    }
  }
  return out;
}

/** Средняя энергия в дни с фактором и без него. */
function energyInsights() {
  const { days } = session.state;
  const rated = Object.entries(days).filter(([, d]) => d.energy);
  if (rated.length < 5) return { need: 5 - rated.length, items: [] };
  const doneByDay = supportDoneByDay();
  const avg = (arr) => arr.reduce((a, b) => a + b, 0) / arr.length;
  const items = [];
  const compare = (title, hasFactor) => {
    const yes = [];
    const no = [];
    for (const [key, d] of rated) (hasFactor(key) ? yes : no).push(d.energy);
    if (yes.length >= 2 && no.length >= 2) items.push({ title, yes: avg(yes), no: avg(no), diff: avg(yes) - avg(no) });
  };
  for (const q of supports()) compare(q.title, (key) => (doneByDay.get(key) || new Set()).has(q.id));
  for (const dr of session.state.drains) compare(dr.title, (key) => (days[key].drains || []).includes(dr.id));
  items.sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff));
  return { need: 0, items: items.slice(0, 5) };
}
