<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<!-- Никаких сетевых запросов со страницы: CSP запрещает fetch/XHR, внешние скрипты, стили, шрифты и картинки -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; manifest-src 'self'; worker-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#05070d">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Система">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2305070d'/%3E%3Crect x='10' y='10' width='44' height='44' rx='4' fill='none' stroke='%2366d0ff' stroke-width='4'/%3E%3Cpath d='M32 19v18' stroke='%2366d0ff' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='45' r='3.5' fill='%2366d0ff'/%3E%3C/svg%3E">
<title>Система</title>
<style>
:root {
  --bg: #05070d;
  --bg-2: #0a1222;
  --panel: rgba(8, 18, 36, 0.86);
  --line: rgba(120, 205, 255, 0.75);
  --line-soft: rgba(120, 205, 255, 0.28);
  --glow: rgba(64, 170, 255, 0.55);
  --accent: #66d0ff;
  --accent-2: #a9e6ff;
  --text: #e6f4ff;
  --text-dim: #8fb0c8;
  --text-faint: #56738a;
  --danger: #ff5f7a;
  --danger-glow: rgba(255, 80, 110, 0.45);
  --warn: #ffc56b;
  --ok: #6dffc0;
  --font: -apple-system, "SF Pro Display", system-ui, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(40, 110, 220, 0.28), transparent 60%),
    radial-gradient(90% 60% at 50% 115%, rgba(30, 80, 190, 0.22), transparent 60%),
    var(--bg);
}

/* Тонкая голографическая сетка на фоне */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(100, 190, 255, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(100, 190, 255, 0.05) 1px, transparent 1px);
  background-size: 32px 32px;
  mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
}

button, input { font: inherit; color: inherit; }
button { touch-action: manipulation; }

#app {
  position: relative;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: calc(24px + var(--safe-t)) 16px calc(24px + var(--safe-b));
}

/* ---------- Окно «Система» ---------- */

.sys {
  position: relative;
  width: 100%;
  max-width: 440px;
  padding: 22px 20px 24px;
  background:
    linear-gradient(180deg, rgba(110, 200, 255, 0.07), transparent 40%),
    var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  box-shadow:
    0 0 0 1px rgba(120, 205, 255, 0.12),
    0 0 18px var(--glow),
    0 0 60px rgba(40, 130, 255, 0.18),
    inset 0 0 28px rgba(70, 170, 255, 0.14);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  animation: sys-open 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  transform-origin: center;
}

/* Уголки-скобки */
.sys::before, .sys::after {
  content: "";
  position: absolute;
  width: 18px;
  height: 18px;
  border: 2px solid var(--accent-2);
  filter: drop-shadow(0 0 6px var(--accent));
  pointer-events: none;
}
.sys::before { top: -3px; left: -3px; border-right: 0; border-bottom: 0; }
.sys::after { bottom: -3px; right: -3px; border-left: 0; border-top: 0; }

/* Бегущая полоса сканирования */
.sys > .scan {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: inherit;
  pointer-events: none;
}
.sys > .scan::after {
  content: "";
  position: absolute;
  left: 0; right: 0;
  height: 40%;
  top: -40%;
  background: linear-gradient(180deg, transparent, rgba(120, 210, 255, 0.07), transparent);
  animation: scan 5s linear infinite;
}

.sys > *:not(.scan) { animation: sys-content 0.4s 0.35s ease-out both; }

.sys-head {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding-bottom: 14px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line-soft);
}
.sys-icon {
  flex: none;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border: 1.5px solid var(--accent-2);
  border-radius: 4px;
  font-weight: 800;
  color: var(--accent-2);
  text-shadow: 0 0 8px var(--accent);
  box-shadow: 0 0 10px var(--glow), inset 0 0 8px rgba(100, 200, 255, 0.25);
}
.sys-title {
  margin: 0;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--accent-2);
  text-shadow: 0 0 10px var(--accent);
}

.sys p { margin: 0 0 12px; line-height: 1.5; color: var(--text); }
.sys .lead { font-size: 17px; text-align: center; }
.sys .dim { color: var(--text-dim); font-size: 14px; }
.sys .hl { color: var(--accent-2); text-shadow: 0 0 8px rgba(102, 208, 255, 0.6); font-weight: 600; }
.center { text-align: center; }

/* ---------- Поля ---------- */

.field { display: block; margin: 16px 0 0; }
.field > span {
  display: block;
  margin-bottom: 6px;
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-dim);
}
.input-wrap { position: relative; }
.field input {
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  font-size: 17px; /* ≥16px: iOS не зумит при фокусе */
  background: rgba(4, 10, 22, 0.75);
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.field input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), 0 0 14px var(--glow);
}
.input-wrap input { padding-right: 56px; }
.reveal {
  position: absolute;
  top: 0; right: 0;
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  background: none;
  border: 0;
  color: var(--text-dim);
  cursor: pointer;
}
.reveal svg { width: 22px; height: 22px; }
.reveal[aria-pressed="true"] { color: var(--accent); }

.hint { margin-top: 6px; font-size: 13px; color: var(--text-faint); }

.warn {
  margin: 20px 0 0;
  padding: 14px;
  border: 1px solid rgba(255, 95, 122, 0.55);
  border-radius: 4px;
  background: rgba(255, 60, 90, 0.08);
  box-shadow: inset 0 0 18px rgba(255, 60, 90, 0.08);
}
.warn b {
  display: block;
  margin-bottom: 4px;
  color: var(--danger);
  letter-spacing: 0.12em;
  font-size: 13px;
  text-transform: uppercase;
}
.warn p { margin: 0; font-size: 14px; color: #ffd6dd; }

.check {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  margin-top: 14px;
  min-height: 44px;
  cursor: pointer;
  font-size: 15px;
  line-height: 1.4;
}
.check input {
  flex: none;
  appearance: none;
  -webkit-appearance: none;
  width: 26px;
  height: 26px;
  margin: 0;
  border: 1.5px solid var(--line);
  border-radius: 4px;
  background: rgba(4, 10, 22, 0.75);
  display: grid;
  place-items: center;
  cursor: pointer;
}
.check input::after {
  content: "";
  width: 12px;
  height: 7px;
  border-left: 2.5px solid var(--bg);
  border-bottom: 2.5px solid var(--bg);
  transform: translateY(-2px) rotate(-45deg) scale(0);
  transition: transform 0.15s;
}
.check input:checked { background: var(--accent); box-shadow: 0 0 12px var(--glow); }
.check input:checked::after { transform: translateY(-2px) rotate(-45deg) scale(1); }

/* ---------- Кнопки ---------- */

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  min-height: 54px;
  margin-top: 22px;
  padding: 12px 18px;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--accent-2);
  background: linear-gradient(180deg, rgba(80, 180, 255, 0.18), rgba(40, 120, 220, 0.1));
  border: 1px solid var(--accent);
  border-radius: 4px;
  box-shadow: 0 0 14px var(--glow), inset 0 0 14px rgba(100, 200, 255, 0.18);
  text-shadow: 0 0 8px var(--accent);
  cursor: pointer;
  transition: transform 0.12s, box-shadow 0.2s, opacity 0.2s;
}
.btn:active { transform: scale(0.98); box-shadow: 0 0 24px var(--glow), inset 0 0 20px rgba(100, 200, 255, 0.3); }
.btn:disabled { opacity: 0.45; cursor: default; transform: none; }
.btn.danger {
  color: #ffd6dd;
  border-color: var(--danger);
  background: rgba(255, 60, 90, 0.12);
  box-shadow: 0 0 14px var(--danger-glow), inset 0 0 14px rgba(255, 80, 110, 0.15);
  text-shadow: 0 0 8px var(--danger);
}
.btn.ghost {
  min-height: 48px;
  margin-top: 12px;
  font-size: 14px;
  letter-spacing: 0.08em;
  text-transform: none;
  font-weight: 500;
  color: var(--text-dim);
  background: none;
  border-color: transparent;
  box-shadow: none;
  text-shadow: none;
}
.btn .spin {
  width: 16px;
  height: 16px;
  border: 2px solid currentColor;
  border-right-color: transparent;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

.error {
  min-height: 1.4em;
  margin: 12px 0 0;
  font-size: 14px;
  color: var(--danger);
  text-align: center;
  text-shadow: 0 0 8px var(--danger-glow);
}
.shake { animation: shake 0.4s; }

/* ---------- Статус (временный главный экран этапа 1) ---------- */

.stat-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid rgba(120, 205, 255, 0.12);
  font-size: 15px;
}
.stat-row:last-of-type { border-bottom: 0; }
.stat-row > span:first-child { color: var(--text-dim); }
.stat-row > span:last-child { text-align: right; }
.mono { font-family: var(--mono); font-size: 13px; }
.ok { color: var(--ok); text-shadow: 0 0 8px rgba(109, 255, 192, 0.5); }

.footer-note {
  margin: 22px 0 0;
  font-size: 12px;
  color: var(--text-faint);
  text-align: center;
  letter-spacing: 0.06em;
}

/* ---------- Оболочка приложения ---------- */

#app.shell { justify-content: flex-start; padding: 0; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: calc(10px + var(--safe-t)) 16px 10px;
  background: linear-gradient(180deg, rgba(5, 7, 13, 0.97), rgba(5, 7, 13, 0.85));
  border-bottom: 1px solid var(--line-soft);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
.topbar .who { flex: 1; min-width: 0; }
.topbar .who small {
  display: block;
  font-size: 11px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--accent);
  text-shadow: 0 0 8px var(--glow);
}
.topbar .who b {
  display: block;
  font-size: 17px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.xp-total {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 700;
  color: var(--accent-2);
  text-shadow: 0 0 8px var(--glow);
  white-space: nowrap;
}
.icon-btn {
  flex: none;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  background: none;
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  color: var(--accent-2);
  cursor: pointer;
}
.icon-btn svg { width: 20px; height: 20px; }

.view {
  width: 100%;
  max-width: 560px;
  padding: 8px 16px calc(100px + var(--safe-b));
}

.section-h {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 24px 0 10px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--accent);
  text-shadow: 0 0 8px var(--glow);
}
.section-h::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--line-soft), transparent);
}
.section-h .count { color: var(--text-faint); letter-spacing: 0.08em; text-shadow: none; }

.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  display: flex;
  justify-content: center;
  padding: 4px 8px calc(4px + var(--safe-b));
  background: rgba(5, 7, 13, 0.95);
  border-top: 1px solid var(--line-soft);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
.tabbar button {
  flex: 1;
  max-width: 170px;
  min-height: 56px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  background: none;
  border: 0;
  color: var(--text-faint);
  font-size: 11px;
  letter-spacing: 0.06em;
  cursor: pointer;
}
.tabbar svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--accent-2); text-shadow: 0 0 8px var(--glow); }
.tabbar button[aria-current="page"] svg { filter: drop-shadow(0 0 6px var(--accent)); }

/* Панель — рамка окна Системы без анимации открытия */
.panel {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--line-soft);
  border-radius: 6px;
  box-shadow: 0 0 12px rgba(40, 140, 255, 0.12), inset 0 0 20px rgba(70, 170, 255, 0.06);
}
.panel.pad { padding: 4px 16px 16px; }

.empty { padding: 26px 18px; text-align: center; color: var(--text-dim); line-height: 1.5; }
.empty b { display: block; margin-bottom: 4px; color: var(--accent-2); letter-spacing: 0.1em; }

/* ---------- Квесты ---------- */

.btn.add { margin-top: 16px; }

.quest {
  display: flex;
  align-items: flex-start;
  gap: 4px;
  margin-bottom: 10px;
  padding: 8px 12px 10px 4px;
  transition: border-color 0.25s, opacity 0.3s;
}
.qcheck {
  flex: none;
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  padding: 0;
  background: none;
  border: 0;
  cursor: pointer;
}
.qbox {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border: 1.5px solid var(--line);
  border-radius: 4px;
  background: rgba(4, 10, 22, 0.75);
  box-shadow: inset 0 0 8px rgba(100, 200, 255, 0.15);
  transition: background 0.2s, box-shadow 0.2s;
}
.qbox::after {
  content: "";
  width: 13px;
  height: 7px;
  border-left: 2.5px solid var(--bg);
  border-bottom: 2.5px solid var(--bg);
  transform: translateY(-2px) rotate(-45deg) scale(0);
  transition: transform 0.18s cubic-bezier(0.3, 1.6, 0.5, 1);
}
.quest.done .qbox { background: var(--accent); box-shadow: 0 0 14px var(--glow); }
.quest.done .qbox::after { transform: translateY(-2px) rotate(-45deg) scale(1); }
.qbody {
  flex: 1;
  min-width: 0;
  padding: 12px 0 2px;
  background: none;
  border: 0;
  text-align: left;
  cursor: pointer;
}
.qtitle { display: block; font-size: 16px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.quest.done .qtitle { color: var(--text-dim); text-decoration: line-through; text-decoration-color: rgba(120, 205, 255, 0.55); }
.qnote {
  display: block;
  margin-top: 3px;
  font-size: 13px;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.qxp {
  flex: none;
  padding-top: 15px;
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 700;
  color: var(--accent-2);
  text-shadow: 0 0 8px var(--glow);
}
.quest.done .qxp { color: var(--text-faint); text-shadow: none; }
.quest.flash { animation: quest-flash 0.7s ease-out; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip {
  padding: 3px 8px;
  font-size: 12px;
  line-height: 1.3;
  color: var(--text-dim);
  border: 1px solid var(--line-soft);
  border-radius: 3px;
  background: rgba(80, 170, 255, 0.06);
}
.t-chore { --tc: #9fb6c8; }
.t-normal { --tc: #66d0ff; }
.t-goal { --tc: #b99bff; }
.t-epic { --tc: #ffc56b; }
.chip[class*="t-"] { color: var(--tc); border-color: var(--tc); background: none; }

.more {
  display: block;
  width: 100%;
  min-height: 44px;
  background: none;
  border: 0;
  color: var(--text-dim);
  font-size: 14px;
  cursor: pointer;
}

/* ---------- Характеристики ---------- */

.stat {
  display: block;
  width: 100%;
  margin-bottom: 10px;
  padding: 14px 16px;
  text-align: left;
  cursor: pointer;
}
.stat-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.stat-name { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
.stat-lv {
  flex: none;
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 700;
  color: var(--accent-2);
  text-shadow: 0 0 8px var(--glow);
}
.bar {
  position: relative;
  display: block;
  height: 8px;
  margin-top: 10px;
  overflow: hidden;
  border: 1px solid rgba(120, 205, 255, 0.2);
  border-radius: 4px;
  background: rgba(100, 190, 255, 0.08);
}
.bar > i {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0;
  border-radius: inherit;
  background: linear-gradient(90deg, #2f7fff, var(--accent-2));
  box-shadow: 0 0 10px var(--accent);
  transition: width 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.stat-xp {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 6px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-faint);
}

/* ---------- Настройки ---------- */

.set-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid rgba(120, 205, 255, 0.12);
}
.set-row b { display: block; font-size: 15px; color: var(--tc, var(--text)); }
.set-row small { display: block; margin-top: 2px; font-size: 12px; color: var(--text-faint); }
.xp-input { flex: none; display: flex; align-items: center; gap: 8px; color: var(--text-dim); font-size: 13px; }
.xp-input input {
  width: 92px;
  min-height: 44px;
  padding: 8px 10px;
  font-family: var(--mono);
  font-size: 17px;
  text-align: right;
  background: rgba(4, 10, 22, 0.75);
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  outline: none;
}
.xp-input input:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 12px var(--glow); }

/* ---------- Окна поверх экрана ---------- */

.layer {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  padding: calc(16px + var(--safe-t)) 12px calc(12px + var(--safe-b));
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  background: rgba(2, 4, 10, 0.82);
  animation: fade 0.2s both;
}
.layer > .sys {
  margin-top: auto;
  align-self: center;
  max-width: 480px;
  background: linear-gradient(180deg, rgba(110, 200, 255, 0.07), transparent 40%), #07101f;
}
@media (min-width: 600px) { .layer > .sys { margin-bottom: auto; } }
html.noscroll, html.noscroll body { overflow: hidden; }

.field textarea {
  width: 100%;
  min-height: 72px;
  padding: 12px 14px;
  font-size: 17px;
  line-height: 1.4;
  resize: vertical;
  background: rgba(4, 10, 22, 0.75);
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  outline: none;
}
.field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 14px var(--glow); }

.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choices.types { display: grid; grid-template-columns: 1fr 1fr; }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice > span {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 46px;
  height: 100%;
  padding: 8px 14px;
  font-size: 15px;
  color: var(--text);
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  background: rgba(4, 10, 22, 0.75);
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s, color 0.15s;

.choice b { font-weight: 600; color: var(--tc, inherit); }
.choice small { font-family: var(--mono); font-size: 12px; color: var(--text-faint); }
.choice input:checked + span {
  color: var(--accent-2);

}

.btn.ghost.danger-text { color: var(--danger); }
.btn.armed { color: #fff; border-color: var(--danger); background: rgba(255, 60, 90, 0.2); text-shadow: 0 0 8px var(--danger); }

/* ---------- Уведомления ---------- */

.toasts {
  position: fixed;
  z-index: 60;
  top: calc(74px + var(--safe-t));
  left: 0;
  right: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 0 16px;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  width: 100%;
  max-width: 420px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 12px 12px 16px;
  background: #081325;
  border: 1px solid var(--line);
  border-radius: 6px;
  box-shadow: 0 0 18px var(--glow), inset 0 0 16px rgba(70, 170, 255, 0.15);
  animation: toast-in 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
.toast.out { animation: toast-out 0.25s ease-in both; }
.toast .t-body { flex: 1; min-width: 0; }
.toast .t-title { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); }
.toast .t-main { font-size: 18px; font-weight: 800; color: var(--accent-2); text-shadow: 0 0 10px var(--accent); }
.toast .t-sub { margin-top: 2px; font-size: 13px; color: var(--text-dim); }
.toast button {
  flex: none;
  min-height: 44px;
  padding: 0 14px;
  font-size: 14px;
  color: var(--accent-2);
  background: none;
  border: 1px solid var(--line-soft);
  border-radius: 4px;

.toast.up { border-color: var(--warn); box-shadow: 0 0 18px rgba(255, 197, 107, 0.45), inset 0 0 16px rgba(255, 197, 107, 0.12); }
.toast.up .t-title { color: var(--warn); }
.toast.up .t-main { color: #ffe2b0; text-shadow: 0 0 10px var(--warn); }
.toast.minus { border-color: rgba(255, 95, 122, 0.6); box-shadow: 0 0 14px var(--danger-glow); }
.toast.minus .t-title { color: var(--danger); }
.toast.minus .t-main { color: #ffd6dd; text-shadow: none; }

/* ---------- Анимации ---------- */

@keyframes sys-open {
  0%   { opacity: 0; transform: scaleX(0.02) scaleY(0.006); }
  45%  { opacity: 1; transform: scaleX(1) scaleY(0.006); }

}

@keyframes scan { to { top: 100%; } }

@keyframes quest-flash {

  100% { box-shadow: 0 0 12px rgba(40, 140, 255, 0.12); }
}
@keyframes shake {
  20% { transform: translateX(-8px); }
  40% { transform: translateX(7px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(3px); }
}

  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

<script>
'use strict';

/* =====================================================================
   НАСТРОЙКИ
   ===================================================================== */

const CONFIG = {
  storageKey: 'system.vault.v1',
  kdfIterations: 310000,        // PBKDF2-SHA-256, ТЗ требует ≥ 200 000
  minPasswordLength: 8,
  autoLockMs: 5 * 60 * 1000,    // 5 минут бездействия
};

/* =====================================================================
   КРИПТОГРАФИЯ (Web Crypto API)
   Ключ AES-GCM-256 выводится из пароля через PBKDF2 со случайной солью.
   На каждое сохранение — новый случайный IV. Пароль нигде не хранится;
   в памяти живёт только неизвлекаемый CryptoKey, пока сессия открыта.
   ===================================================================== */

const AAD = new TextEncoder().encode('system-vault-v1');

const b64 = {
  encode(bytes) {
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  },
  decode(str) {
    const s = atob(str);
    const out = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  },
};

async function deriveKey(password, salt, iterations) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', hash: 'SHA-256', salt, iterations },
    base,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt'],
  );
}

async function encryptJSON(key, kdf, data) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const plain = new TextEncoder().encode(JSON.stringify(data));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: AAD }, key, plain));
  return { v: 1, kdf, iv: b64.encode(iv), ct: b64.encode(ct) };
}

/** Бросает ошибку, если пароль неверный (не сошёлся тег GCM). */
async function decryptJSON(key, record) {
  const plain = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: b64.decode(record.iv), additionalData: AAD },
    key,
    b64.decode(record.ct),
  );
  return JSON.parse(new TextDecoder().decode(plain));
}

function newKdfParams() {
  return {
    name: 'PBKDF2',
    hash: 'SHA-256',
    iter: CONFIG.kdfIterations,
    salt: b64.encode(crypto.getRandomValues(new Uint8Array(16))),
  };
}

/* =====================================================================
   ХРАНИЛИЩЕ
   В localStorage лежит только зашифрованная запись { v, kdf, iv, ct }.
   ===================================================================== */

const Vault = {
  read() {
    const raw = localStorage.getItem(CONFIG.storageKey);
    return raw ? JSON.parse(raw) : null;
  },
  exists() {
    return localStorage.getItem(CONFIG.storageKey) !== null;
  },
  write(record) {
    localStorage.setItem(CONFIG.storageKey, JSON.stringify(record));
  },
  wipe() {
    localStorage.removeItem(CONFIG.storageKey);
  },
};

/* =====================================================================
   ДАННЫЕ ИГРОКА
   ===================================================================== */

/** Типы задач. Опыт по умолчанию; текущие значения — в state.settings.xp. */
const TASK_TYPES = [
  { id: 'chore', name: 'Бытовая', xp: 10, hint: 'Покупки, мелкие дела' },
  { id: 'normal', name: 'Обычная', xp: 25, hint: 'Средние задачи' },
  { id: 'goal', name: 'Целевая', xp: 60, hint: 'Блог, деньги, карьера' },
  { id: 'epic', name: 'Эпическая', xp: 200, hint: 'Босс: крупный рубеж' },
];
const TYPE_BY_ID = Object.fromEntries(TASK_TYPES.map((t) => [t.id, t]));

const DEFAULT_STATS = ['Сила', 'Интеллект', 'Креатив', 'Дисциплина', 'Карьера', 'Творческая реализация', 'Проявленность', 'Харизма'];

const REPEATS = { none: 'Разовый', daily: 'Каждый день', weekly: 'Каждую неделю' };

function uid() {
  return Array.from(crypto.getRandomValues(new Uint8Array(8)), (b) => b.toString(16).padStart(2, '0')).join('');
}

function defaultState(name) {
  return migrate({ schema: 1, createdAt: Date.now(), profile: { name: name || 'Игрок' } });
}

/**
 * Доводит расшифрованные данные до текущей схемы.
 * quests — список задач; log — журнал выполнений, из которого считается весь опыт:
 * { id, questId, title, type, xp, stats: { statId: xp }, period, at }.
 */
function migrate(state) {
  state.settings = state.settings || {};
  state.settings.xp = Object.assign(Object.fromEntries(TASK_TYPES.map((t) => [t.id, t.xp])), state.settings.xp);
  state.stats = state.stats || DEFAULT_STATS.map((name) => ({ id: uid(), name }));
  state.quests = state.quests || [];
  state.log = state.log || [];
  state.schema = 2;
  return state;
}

/* =====================================================================
   ПРОКАЧКА
   ===================================================================== */

/** Опыт, нужный для перехода с уровня level на следующий. */
function xpToNext(level) {
  return Math.round(100 * Math.pow(level, 1.5));
}

function levelInfo(xp) {
  let level = 1;
  let into = xp;
  while (into >= xpToNext(level)) {
    into -= xpToNext(level);
    level++;
  }
  return { level, into, need: xpToNext(level) };
}

/** Делит опыт поровну между характеристиками; остаток раздаётся по единице первым. */
function splitXp(xp, statIds) {
  const out = {};
  if (!statIds.length) return out;
  const base = Math.floor(xp / statIds.length);
  let rest = xp - base * statIds.length;
  for (const id of statIds) out[id] = base + (rest-- > 0 ? 1 : 0);
  return out;
}

function totalXp() {
  return session.state.log.reduce((sum, e) => sum + e.xp, 0);
}

function statXp() {
  const map = new Map();
  for (const e of session.state.log) {
    for (const [id, xp] of Object.entries(e.stats)) map.set(id, (map.get(id) || 0) + xp);
  }
  return map;
}

function statName(id) {
  const stat = session.state.stats.find((s) => s.id === id);
  return stat ? stat.name : '—';
}

/* ---------- Периоды повторяющихся квестов ---------- */

const pad = (n) => String(n).padStart(2, '0');

function dayKey(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

/** ISO-неделя: начинается в понедельник. */
function weekKey(d) {
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() - ((t.getDay() + 6) % 7) + 3); // четверг этой недели
  const jan4 = new Date(t.getFullYear(), 0, 4);
  const week = 1 + Math.round(((t - jan4) / 864e5 - 3 + ((jan4.getDay() + 6) % 7)) / 7);
  return `${t.getFullYear()}-W${pad(week)}`;
}

/** Текущий период квеста: null для разовых. */
function periodKey(repeat, d = new Date()) {
  if (repeat === 'daily') return 'd:' + dayKey(d);
  if (repeat === 'weekly') return 'w:' + weekKey(d);
  return null;
}

/** questId → запись журнала, которая отмечает квест выполненным сейчас. */
function completionIndex() {
  const { quests, log } = session.state;
  const now = new Date();
  const periods = new Map(quests.map((q) => [q.id, periodKey(q.repeat, now)]));
  const map = new Map();
  for (const e of log) {
    if (periods.has(e.questId) && periods.get(e.questId) === e.period) map.set(e.questId, e);
  }
  return map;
}

/* =====================================================================
   СЕССИЯ
   session = { key, kdf, state } пока приложение разблокировано, иначе null.
   ===================================================================== */

let session = null;
let saveChain = Promise.resolve();
let lastSavedAt = null;

async function createVault(password, name) {
  const kdf = newKdfParams();
  const key = await deriveKey(password, b64.decode(kdf.salt), kdf.iter);
  const state = defaultState(name);
  Vault.write(await encryptJSON(key, kdf, state));
  lastSavedAt = Date.now();
  session = { key, kdf, state };
  // Просим браузер не вычищать хранилище при нехватке места
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}

async function unlockVault(password) {
  const record = Vault.read();
  const kdf = record.kdf;
  const key = await deriveKey(password, b64.decode(kdf.salt), kdf.iter);
  const state = migrate(await decryptJSON(key, record)); // неверный пароль → исключение
  session = { key, kdf, state };
  lastSavedAt = null;
}

/**
 * Шифрует и сохраняет текущее состояние. Снимок и ключ берутся синхронно,
 * поэтому сохранение завершится, даже если сразу после вызова сработает блокировка.
 */
function save() {
  if (!session) return saveChain;
  const { key, kdf } = session;
  const snapshot = JSON.parse(JSON.stringify(session.state));
  saveChain = saveChain
    .then(() => encryptJSON(key, kdf, snapshot))
    .then((record) => {
      Vault.write(record);
      lastSavedAt = Date.now();
      if (session) renderSavedAt();
    })
    .catch((err) => {
      console.error(err);
      showError('Не удалось сохранить данные: ' + (err && err.name === 'QuotaExceededError' ? 'нет места в хранилище.' : 'ошибка записи.'));
    });
  return saveChain;
}

function lock(reason) {
  if (!session) return;
  flushInputs();
  session = null; // ключ и расшифрованные данные больше недоступны
  clearTimeout(renderTimer);
  closeSheet();
  clearToasts();
  if (document.activeElement) document.activeElement.blur();
  showLogin(reason);
}

/* =====================================================================
   АВТОБЛОКИРОВКА
   ===================================================================== */

let lastActivity = Date.now();
for (const ev of ['pointerdown', 'keydown', 'touchstart', 'wheel', 'scroll', 'input']) {
  addEventListener(ev, () => { lastActivity = Date.now(); }, { passive: true, capture: true });
}
setInterval(() => {
  if (session && Date.now() - lastActivity > CONFIG.autoLockMs) lock('idle');
}, 5000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) lock('hidden');
});
addEventListener('pagehide', () => lock('hidden'));

/* =====================================================================
   ИНТЕРФЕЙС
   ===================================================================== */

const app = document.getElementById('app');

function mount(templateId) {
  const node = document.getElementById(templateId).content.cloneNode(true);
  app.className = '';
  app.replaceChildren(node);
  wireRevealButtons(app);
  return app.firstElementChild;
}

const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';

function wireRevealButtons(root) {
  root.querySelectorAll('.reveal').forEach((btn) => {
    btn.innerHTML = EYE;
    btn.addEventListener('click', () => {
      const input = btn.previousElementSibling;
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.setAttribute('aria-pressed', String(show));
      btn.setAttribute('aria-label', show ? 'Скрыть пароль' : 'Показать пароль');
    });
  });
}

function showError(message, shakeEl) {
  const el = app.querySelector('[data-error]');
  if (el) el.textContent = message;
  const target = shakeEl || app.querySelector('.sys');
  if (message && target) {
    target.classList.remove('shake');
    void target.offsetWidth;
    target.classList.add('shake');
  }
}

function setBusy(button, busyText) {
  if (busyText) {
    button.dataset.label = button.textContent;
    button.disabled = true;
    button.innerHTML = '<span class="spin"></span>';
    button.append(busyText);
  } else {
    button.disabled = false;
    button.textContent = button.dataset.label;
  }
}

/* ---------- Первый запуск ---------- */

function showSetup() {
  const root = mount('tpl-setup');
  const form = root.querySelector('form');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = form.player.value.trim();
    const pw = form.pw.value;
    if (pw.length < CONFIG.minPasswordLength) return showError(`Пароль должен быть не короче ${CONFIG.minPasswordLength} символов.`);
    if (pw !== form.pw2.value) return showError('Пароли не совпадают.');
    if (!form.ack.checked) return showError('Подтвердите, что понимаете: пароль восстановить нельзя.');
    const btn = form.querySelector('[data-submit]');
    setBusy(btn, 'Инициализация…');
    try {
      await createVault(pw, name);
      showHome();
    } catch (err) {
      console.error(err);
      setBusy(btn, null);
      showError('Не удалось создать хранилище. Проверьте, что приватный режим выключен.');
    }
  });
}

/* ---------- Вход ---------- */

const LOCK_REASONS = {
  idle: 'Сеанс заблокирован: 5 минут без активности.',
  hidden: 'Сеанс заблокирован при сворачивании.',
  manual: 'Сеанс заблокирован.',
};

function showLogin(reason) {
  const root = mount('tpl-login');
  const form = root.querySelector('form');
  const reasonEl = root.querySelector('[data-reason]');
  if (reason && LOCK_REASONS[reason]) {
    reasonEl.textContent = LOCK_REASONS[reason];
    reasonEl.hidden = false;
  }
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = form.pw.value;
    if (!pw) return showError('Введите пароль.');
    const btn = form.querySelector('[data-submit]');
    setBusy(btn, 'Расшифровка…');
    try {
      await unlockVault(pw);
      showHome();
    } catch (err) {
      setBusy(btn, null);
      if (err && err.name === 'OperationError') {
        form.pw.value = '';
        showError('Неверный пароль.');
        form.pw.focus();
      } else {
        console.error(err);
        showError('Хранилище повреждено или в неизвестном формате.');
      }
    }
  });
  root.querySelector('[data-action="forgot"]').addEventListener('click', showWipe);
}

/* ---------- Сброс ---------- */

function showWipe() {
  const root = mount('tpl-wipe');
  const form = root.querySelector('form');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (form.confirm.value.trim().toUpperCase() !== 'СТЕРЕТЬ') return showError('Введите слово «СТЕРЕТЬ».');
    Vault.wipe();
    showSetup();
  });
  root.querySelector('[data-action="back"]').addEventListener('click', () => showLogin());
}

/* ---------- Мелкие помощники интерфейса ---------- */

const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ESC[c]);
const fmt = (n) => n.toLocaleString('ru-RU');

/** Отложенное сохранение поля ввода; flushInputs() дописывает его перед блокировкой. */
let pendingCommit = null;

function commitLater(fn) {
  if (pendingCommit) clearTimeout(pendingCommit.timer);
  pendingCommit = { fn, timer: setTimeout(flushInputs, 500) };
}

function flushInputs() {
  if (!pendingCommit) return;
  const { fn, timer } = pendingCommit;
  clearTimeout(timer);
  pendingCommit = null;
  fn();
}

/** Кнопка опасного действия: первое нажатие спрашивает, второе выполняет. */
function confirmPress(btn, question, action) {
  if (btn.dataset.armed) return action();
  const label = btn.textContent;
  btn.dataset.armed = '1';
  btn.classList.add('armed');
  btn.textContent = question;
  setTimeout(() => {
    if (!btn.isConnected) return;
    delete btn.dataset.armed;
    btn.classList.remove('armed');
    btn.textContent = label;
  }, 3000);
}

/* ---------- Всплывающие уведомления ---------- */

function toast({ title, main, sub, kind, action, ms = 4000 }) {
  let box = document.getElementById('toasts');
  if (!box) {
    box = document.createElement('div');
    box.id = 'toasts';
    box.className = 'toasts';
    document.body.append(box);
  }
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.setAttribute('role', 'status');
  el.innerHTML = '<div class="t-body"><div class="t-title"></div><div class="t-main"></div><div class="t-sub"></div></div>';
  el.querySelector('.t-title').textContent = title;
  el.querySelector('.t-main').textContent = main;
  if (sub) el.querySelector('.t-sub').textContent = sub;
  else el.querySelector('.t-sub').remove();

  const dismiss = () => {
    if (!el.isConnected || el.classList.contains('out')) return;
    el.classList.add('out');
    setTimeout(() => el.remove(), 250);
  };
  if (action) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = action.label;
    btn.addEventListener('click', () => { action.run(); dismiss(); });
    el.append(btn);
  }
  box.append(el);
  while (box.children.length > 3) box.firstElementChild.remove();
  setTimeout(dismiss, ms);
}

function clearToasts() {
  const box = document.getElementById('toasts');
  if (box) box.replaceChildren();
}

/* ---------- Окно поверх экрана ---------- */

let sheet = null;

function openSheet(title, body) {
  closeSheet();
  sheet = document.createElement('div');
  sheet.className = 'layer';
  sheet.innerHTML = `<section class="sys" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="scan"></div>
      <header class="sys-head"><div class="sys-icon">!</div><h2 class="sys-title">${esc(title)}</h2></header>
      ${body}
    </section>`;
  sheet.addEventListener('click', (e) => {
    if (e.target === sheet || e.target.closest('[data-action="close"]')) closeSheet();
  });
  document.body.append(sheet);
  document.documentElement.classList.add('noscroll');
  return sheet.querySelector('.sys');
}

function closeSheet() {
  if (!sheet) return;
  sheet.remove();
  sheet = null;
  document.documentElement.classList.remove('noscroll');
}

addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeSheet();
});

function sheetError(root, message) {
  root.querySelector('[data-error]').textContent = message;
  root.classList.remove('shake');
  void root.offsetWidth;
  root.classList.add('shake');
}

/* =====================================================================
   ГЛАВНЫЙ ЭКРАН: вкладки «Квесты», «Характеристики», «Настройки»
   ===================================================================== */

const ui = { tab: 'quests', showAllDone: false };
let renderTimer = null;

function showHome() {
  ui.tab = 'quests';
  ui.showAllDone = false;
  mount('tpl-shell');
  app.classList.add('shell');
  app.querySelector('.topbar [data-action="lock"]').addEventListener('click', () => lock('manual'));
  app.querySelector('.tabbar').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-tab]');
    if (!btn || btn.dataset.tab === ui.tab) return;
    flushInputs();
    ui.tab = btn.dataset.tab;
    render();
    scrollTo(0, 0);
  });
  app.querySelector('[data-view]').addEventListener('click', onViewClick);
  render();
}

function renderTopbar() {
  app.querySelector('.topbar [data-bind="name"]').textContent = session.state.profile.name;
  app.querySelector('.topbar [data-bind="xp"]').textContent = fmt(totalXp()) + ' XP';
}

function render() {
  clearTimeout(renderTimer);
  if (!session || !app.classList.contains('shell')) return;
  renderTopbar();
  app.querySelectorAll('[data-tab]').forEach((b) => {
    if (b.dataset.tab === ui.tab) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  const view = app.querySelector('[data-view]');
  view.innerHTML = VIEWS[ui.tab]();
  if (ui.tab === 'settings') wireSettings(view);
  // Полоски заполняются с нуля — видно, сколько набрано
  requestAnimationFrame(() => requestAnimationFrame(() => {
    view.querySelectorAll('.bar > i[data-pct]').forEach((i) => { i.style.width = i.dataset.pct + '%'; });
  }));
}

const VIEWS = { quests: questsView, stats: statsView, settings: settingsView };

function onViewClick(e) {
  const t = e.target.closest('[data-check], [data-edit], [data-stat], [data-action]');
  if (!t || !session) return;
  if (t.dataset.check) return toggleQuest(t.dataset.check, t);
  if (t.dataset.edit) return openQuestEditor(findQuest(t.dataset.edit));
  if (t.dataset.stat) return openStatEditor(session.state.stats.find((s) => s.id === t.dataset.stat));
  switch (t.dataset.action) {
    case 'new-quest': return openQuestEditor(null);
    case 'new-stat': return openStatEditor(null);
    case 'show-done': ui.showAllDone = !ui.showAllDone; return render();
    case 'reset-xp': return resetXp();
    case 'lock': return lock('manual');
  }
}

/* ---------- Квесты ---------- */

const DONE_PREVIEW = 5;

function findQuest(id) {
  return session.state.quests.find((q) => q.id === id);
}

function questsView() {
  const { quests } = session.state;
  const done = completionIndex();
  const byNewest = (a, b) => b.createdAt - a.createdAt;
  const recurring = quests.filter((q) => q.repeat !== 'none').sort(byNewest);
  const active = quests.filter((q) => q.repeat === 'none' && !done.has(q.id)).sort(byNewest);
  const finished = quests
    .filter((q) => q.repeat === 'none' && done.has(q.id))
    .sort((a, b) => done.get(b.id).at - done.get(a.id).at);

  let html = '<button class="btn add" type="button" data-action="new-quest">+ Новый квест</button>';
  if (!quests.length) {
    return html + `<div class="section-h">Квесты</div>
      <div class="panel empty"><b>Активных квестов нет</b>Добавьте первое дело — Система начислит опыт за выполнение.</div>`;
  }
  if (recurring.length) {
    const left = recurring.filter((q) => !done.has(q.id)).length;
    html += `<div class="section-h">Ежедневные квесты <span class="count">${recurring.length - left}/${recurring.length}</span></div>`;
    html += recurring.map((q) => questCard(q, done.get(q.id))).join('');
  }
  html += `<div class="section-h">Квесты <span class="count">${active.length}</span></div>`;
  html += active.length
    ? active.map((q) => questCard(q, null)).join('')
    : '<div class="panel empty">Все разовые квесты выполнены.</div>';
  if (finished.length) {
    const shown = ui.showAllDone ? finished : finished.slice(0, DONE_PREVIEW);
    html += `<div class="section-h">Выполнено <span class="count">${finished.length}</span></div>`;
    html += shown.map((q) => questCard(q, done.get(q.id))).join('');
    if (finished.length > DONE_PREVIEW) {
      html += `<button class="more" type="button" data-action="show-done">${ui.showAllDone ? 'Свернуть' : `Показать все (${finished.length})`}</button>`;
    }
  }
  return html;
}

function questCard(q, entry) {
  const xp = entry ? entry.xp : session.state.settings.xp[q.type];
  const names = q.stats.map(statName).filter((n) => n !== '—');
  const repeat = q.repeat === 'daily' ? '↻ день' : q.repeat === 'weekly' ? '↻ неделя' : '';
  return `<article class="panel quest${entry ? ' done' : ''}">
    <button class="qcheck" type="button" data-check="${q.id}" role="checkbox" aria-checked="${!!entry}" aria-label="${entry ? 'Снять отметку' : 'Выполнено'}: ${esc(q.title)}"><span class="qbox"></span></button>
    <button class="qbody" type="button" data-edit="${q.id}">
      <span class="qtitle">${esc(q.title)}</span>
      ${q.note ? `<span class="qnote">${esc(q.note)}</span>` : ''}
      <span class="chips">
        <span class="chip t-${q.type}">${TYPE_BY_ID[q.type].name}</span>
        ${repeat ? `<span class="chip">${repeat}</span>` : ''}
        ${names.map((n) => `<span class="chip">${esc(n)}</span>`).join('')}
      </span>
    </button>
    <span class="qxp">+${fmt(xp)}</span>
  </article>`;
}

function toggleQuest(id, checkBtn) {
  const q = findQuest(id);
  if (!q) return;
  const entry = completionIndex().get(id);
  if (entry) return undoEntry(entry.id);

  completeQuest(q);
  // Даём досмотреть вспышку, потом квест переезжает в «Выполнено»
  const card = checkBtn.closest('.quest');
  card.classList.add('done', 'flash');
  checkBtn.setAttribute('aria-checked', 'true');
  renderTopbar();
  clearTimeout(renderTimer);
  renderTimer = setTimeout(render, 700);
}

function completeQuest(q) {
  const { state } = session;
  const xp = state.settings.xp[q.type];
  const statIds = q.stats.filter((id) => state.stats.some((s) => s.id === id));
  const before = statXp();
  const entry = {
    id: uid(),
    questId: q.id,
    title: q.title,
    type: q.type,
    xp,
    stats: splitXp(xp, statIds),
    period: periodKey(q.repeat),
    at: Date.now(),
  };
  state.log.push(entry);
  save();

  const after = statXp();
  toast({
    title: 'Квест выполнен',
    main: `+${fmt(xp)} XP`,
    sub: Object.entries(entry.stats).map(([sid, v]) => `+${v} ${statName(sid)}`).join(' · '),
    action: { label: 'Отменить', run: () => undoEntry(entry.id) },
    ms: 6000,
  });
  for (const sid of statIds) {
    const was = levelInfo(before.get(sid) || 0).level;
    const now = levelInfo(after.get(sid) || 0).level;
    if (now > was) toast({ title: 'Характеристика повышена', main: `${statName(sid)}: ур. ${now}`, kind: 'up', ms: 5000 });
  }
}

/** Откат отметки: запись удаляется из журнала, опыт пересчитывается. */
function undoEntry(entryId) {
  if (!session) return;
  const { log } = session.state;
  const i = log.findIndex((e) => e.id === entryId);
  if (i < 0) return;
  const [entry] = log.splice(i, 1);
  save();
  toast({ title: 'Отметка снята', main: `−${fmt(entry.xp)} XP`, kind: 'minus', ms: 3000 });
  render();
}

function openQuestEditor(quest) {
  const { state } = session;
  const q = quest || { title: '', note: '', type: 'normal', stats: [], repeat: 'none' };
  const root = openSheet(quest ? 'Квест' : 'Новый квест', `
    <form novalidate>
      <label class="field"><span>Название</span>
        <input name="title" type="text" maxlength="120" autocomplete="off" value="${esc(q.title)}">
      </label>
      <label class="field"><span>Заметка</span>
        <textarea name="note" rows="2" maxlength="1000" placeholder="Необязательно">${esc(q.note)}</textarea>
      </label>
      <div class="field"><span>Тип</span>
        <div class="choices types">${TASK_TYPES.map((t) => `
          <label class="choice t-${t.id}"><input type="radio" name="type" value="${t.id}"${q.type === t.id ? ' checked' : ''}>
            <span><b>${t.name}</b><small>+${fmt(state.settings.xp[t.id])} XP</small></span></label>`).join('')}
        </div>
      </div>
      <div class="field"><span>Характеристики</span>
        <div class="choices">${state.stats.map((s) => `
          <label class="choice"><input type="checkbox" name="stats" value="${s.id}"${q.stats.includes(s.id) ? ' checked' : ''}>
            <span>${esc(s.name)}</span></label>`).join('')}
        </div>
        <div class="hint" data-split></div>
      </div>
      <div class="field"><span>Повтор</span>
        <div class="choices">${Object.entries(REPEATS).map(([v, label]) => `
          <label class="choice"><input type="radio" name="repeat" value="${v}"${q.repeat === v ? ' checked' : ''}>
            <span>${label}</span></label>`).join('')}
        </div>
      </div>
      <p class="error" data-error></p>
      <button class="btn" type="submit">${quest ? 'Сохранить' : 'Принять квест'}</button>
      ${quest ? '<button class="btn ghost danger-text" type="button" data-action="delete">Удалить квест</button>' : ''}
      <button class="btn ghost" type="button" data-action="close">Отмена</button>
    </form>`);

  const form = root.querySelector('form');
  const f = form.elements;
  const selectedStats = () => [...form.querySelectorAll('input[name="stats"]:checked')].map((i) => i.value);
  const splitHint = root.querySelector('[data-split]');
  const updateSplit = () => {
    const parts = Object.entries(splitXp(state.settings.xp[f.type.value], selectedStats()));
    splitHint.textContent = parts.length
      ? parts.map(([id, v]) => `+${v} ${statName(id)}`).join(' · ')
      : 'Опыт делится поровну между выбранными.';
  };
  form.addEventListener('change', updateSplit);
  updateSplit();
  if (!quest) f.title.focus();

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const title = f.title.value.trim();
    const stats = selectedStats();
    if (!title) return sheetError(root, 'Введите название квеста.');
    if (!stats.length) return sheetError(root, 'Выберите хотя бы одну характеристику.');
    const data = { title, note: f.note.value.trim(), type: f.type.value, stats, repeat: f.repeat.value };
    if (quest) Object.assign(quest, data);
    else state.quests.push({ id: uid(), createdAt: Date.now(), ...data });
    save();
    closeSheet();
    render();
  });

  const del = root.querySelector('[data-action="delete"]');
  if (del) {
    del.addEventListener('click', () => confirmPress(del, 'Точно удалить? Нажмите ещё раз', () => {
      // Заработанный опыт остаётся в журнале
      state.quests = state.quests.filter((x) => x.id !== quest.id);
      save();
      closeSheet();
      render();
    }));
  }
}

/* ---------- Характеристики ---------- */

function statsView() {
  const xpMap = statXp();
  const cards = session.state.stats.map((s) => {
    const xp = xpMap.get(s.id) || 0;
    const info = levelInfo(xp);
    return `<button class="panel stat" type="button" data-stat="${s.id}">
      <span class="stat-top"><span class="stat-name">${esc(s.name)}</span><span class="stat-lv">Ур. ${info.level}</span></span>
      <span class="bar"><i data-pct="${(info.into / info.need * 100).toFixed(1)}"></i></span>
      <span class="stat-xp"><span>${fmt(info.into)} / ${fmt(info.need)} XP</span><span>всего ${fmt(xp)}</span></span>
    </button>`;
  }).join('');
  return `<div class="section-h">Характеристики <span class="count">${session.state.stats.length}</span></div>
    ${cards || '<div class="panel empty">Характеристик нет. Добавьте хотя бы одну, чтобы квесты могли её прокачивать.</div>'}
    <button class="btn" type="button" data-action="new-stat">+ Характеристика</button>`;
}

function openStatEditor(stat) {
  const { state } = session;
  const root = openSheet(stat ? 'Характеристика' : 'Новая характеристика', `
    <form novalidate>
      <label class="field"><span>Название</span>
        <input name="name" type="text" maxlength="32" autocomplete="off" autocapitalize="sentences" value="${stat ? esc(stat.name) : ''}">
      </label>
      <p class="error" data-error></p>
      <button class="btn" type="submit">${stat ? 'Сохранить' : 'Добавить'}</button>
      ${stat ? '<button class="btn ghost danger-text" type="button" data-action="delete">Удалить характеристику</button>' : ''}
      <button class="btn ghost" type="button" data-action="close">Отмена</button>
    </form>`);

  const form = root.querySelector('form');
  const input = form.elements.namedItem('name');
  if (!stat) input.focus();

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = input.value.trim();
    if (!name) return sheetError(root, 'Введите название.');
    const taken = state.stats.some((s) => s !== stat && s.name.toLowerCase() === name.toLowerCase());
    if (taken) return sheetError(root, 'Такая характеристика уже есть.');
    if (stat) stat.name = name;
    else state.stats.push({ id: uid(), name });
    save();
    closeSheet();
    render();
  });

  const del = root.querySelector('[data-action="delete"]');
  if (del) {
    del.addEventListener('click', () => confirmPress(del, 'Опыт характеристики пропадёт. Удалить?', () => {
      state.stats = state.stats.filter((s) => s.id !== stat.id);
      for (const q of state.quests) q.stats = q.stats.filter((id) => id !== stat.id);
      save();
      closeSheet();
      render();
    }));
  }
}

/* ---------- Настройки ---------- */

function settingsView() {
  const { state, kdf } = session;
  return `<div class="section-h">Игрок</div>
    <div class="panel pad">
      <label class="field"><span>Имя игрока</span>
        <input data-input="name" type="text" maxlength="40" autocomplete="off" autocapitalize="words" value="${esc(state.profile.name)}">
      </label>
    </div>

    <div class="section-h">Опыт за задачи</div>
    <div class="panel pad">
      ${TASK_TYPES.map((t) => `
        <label class="set-row t-${t.id}">
          <span><b>${t.name}</b><small>${t.hint}</small></span>
          <span class="xp-input"><input type="number" inputmode="numeric" min="1" max="10000" step="1" data-xp="${t.id}" value="${state.settings.xp[t.id]}">XP</span>
        </label>`).join('')}
      <button class="btn ghost" type="button" data-action="reset-xp">Вернуть значения по умолчанию</button>
    </div>

    <div class="section-h">Безопасность</div>
    <div class="panel pad">
      <div class="stat-row"><span>Хранилище</span><span class="ok">Зашифровано</span></div>
      <div class="stat-row"><span>Шифр</span><span class="mono">AES-GCM-256</span></div>
      <div class="stat-row"><span>Ключ</span><span class="mono">PBKDF2 · ${fmt(kdf.iter)}</span></div>
      <div class="stat-row"><span>Сохранено</span><span class="mono" data-bind="saved">—</span></div>
      <div class="stat-row"><span>Автоблокировка</span><span>5 мин или сворачивание</span></div>
      <button class="btn" type="button" data-action="lock">Заблокировать</button>
    </div>
    <p class="footer-note">Этап 2 из 6 · общий уровень и ранги — на этапе 3</p>`;
}

function wireSettings(view) {
  renderSavedAt();
  const nameIn = view.querySelector('[data-input="name"]');
  nameIn.addEventListener('input', () => {
    app.querySelector('.topbar [data-bind="name"]').textContent = nameIn.value.trim() || 'Игрок';
    commitLater(() => {
      if (!session) return;
      session.state.profile.name = nameIn.value.trim() || 'Игрок';
      save();
    });
  });
  view.querySelectorAll('[data-xp]').forEach((input) => {
    input.addEventListener('change', () => {
      const value = Math.min(10000, Math.max(1, Math.round(Number(input.value)) || TYPE_BY_ID[input.dataset.xp].xp));
      input.value = value;
      session.state.settings.xp[input.dataset.xp] = value;
      save();
    });
  });
}

function resetXp() {
  session.state.settings.xp = Object.fromEntries(TASK_TYPES.map((t) => [t.id, t.xp]));
  save();
  render();
  toast({ title: 'Настройки', main: 'Опыт по умолчанию', ms: 2500 });
}

function renderSavedAt() {
  const el = app.querySelector('[data-bind="saved"]');
  if (el && lastSavedAt) el.textContent = new Date(lastSavedAt).toLocaleTimeString('ru-RU');
}

/* =====================================================================
   ЗАПУСК
   ===================================================================== */

function boot() {
  if (!window.isSecureContext || !window.crypto || !crypto.subtle) return mount('tpl-unsupported');
  if (Vault.exists()) showLogin();
  else showSetup();
}

boot();
</script>
