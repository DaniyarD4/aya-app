<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">

<meta name="theme-color" content="#05070d">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Система">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2305070d'/%3E%3Crect x='10' y='10' width='44' height='44' rx='4' fill='none' stroke='%2366d0ff' stroke-width='4'/%3E%3Cpath d='M32 19v18' stroke='%2366d0ff' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='45' r='3.5' fill='%2366d0ff'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Система</title>
<style>
:root {
  --bg: #05070d;
  --bg-2: #0a1222;
  --panel: rgba(8, 18, 36, 0.86);
  --line: rgba(120, 205, 255, 0.75);
  --line-soft: rgba(120, 205, 255, 0.28);
  --glow: rgba(64, 170, 255, 0.55);
  --accent: #66d0ff;
  --accent-2: #a9e6ff;
  --text: #e6f4ff;
  --text-dim: #8fb0c8;
  --text-faint: #56738a;
  --danger: #ff5f7a;
  --danger-glow: rgba(255, 80, 110, 0.45);
  --warn: #ffc56b;
  --ok: #6dffc0;
  --font: -apple-system, "SF Pro Display", system-ui, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(40, 110, 220, 0.28), transparent 60%),
    radial-gradient(90% 60% at 50% 115%, rgba(30, 80, 190, 0.22), transparent 60%),
    var(--bg);
}

/* Тонкая голографическая сетка на фоне */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(100, 190, 255, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(100, 190, 255, 0.05) 1px, transparent 1px);
  background-size: 32px 32px;
  mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
}

button, input { font: inherit; color: inherit; }
button { touch-action: manipulation; }

#app {
  position: relative;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: calc(24px + var(--safe-t)) 16px calc(24px + var(--safe-b));
}

/* ---------- Окно «Система» ---------- */

.sys {
  position: relative;
  width: 100%;
  max-width: 440px;
  padding: 22px 20px 24px;
  background:
    linear-gradient(180deg, rgba(110, 200, 255, 0.07), transparent 40%),
    var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  box-shadow:
    0 0 0 1px rgba(120, 205, 255, 0.12),
    0 0 18px var(--glow),
    0 0 60px rgba(40, 130, 255, 0.18),
    inset 0 0 28px rgba(70, 170, 255, 0.14);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  animation: sys-open 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  transform-origin: center;
}

/* Уголки-скобки */
.sys::before, .sys::after {
  content: "";
  position: absolute;
  width: 18px;
  height: 18px;
  border: 2px solid var(--accent-2);
  filter: drop-shadow(0 0 6px var(--accent));
  pointer-events: none;
}
.sys::before { top: -3px; left: -3px; border-right: 0; border-bottom: 0; }
.sys::after { bottom: -3px; right: -3px; border-left: 0; border-top: 0; }

/* Бегущая полоса сканирования */
.sys > .scan {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: inherit;
  pointer-events: none;
}
.sys > .scan::after {
  content: "";
  position: absolute;
  left: 0; right: 0;
  height: 40%;
  top: -40%;
  background: linear-gradient(180deg, transparent, rgba(120, 210, 255, 0.07), transparent);
  animation: scan 5s linear infinite;
}

.sys > *:not(.scan) { animation: sys-content 0.4s 0.35s ease-out both; }

.sys-head {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding-bottom: 14px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line-soft);
}
.sys-icon {
  flex: none;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border: 1.5px solid var(--accent-2);
  border-radius: 4px;
  font-weight: 800;
  color: var(--accent-2);
  text-shadow: 0 0 8px var(--accent);
  box-shadow: 0 0 10px var(--glow), inset 0 0 8px rgba(100, 200, 255, 0.25);
}
.sys-title {
  margin: 0;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--accent-2);
  text-shadow: 0 0 10px var(--accent);
}

.sys p { margin: 0 0 12px; line-height: 1.5; color: var(--text); }
.sys .lead { font-size: 17px; text-align: center; }
.sys .dim { color: var(--text-dim); font-size: 14px; }
.sys .hl { color: var(--accent-2); text-shadow: 0 0 8px rgba(102, 208, 255, 0.6); font-weight: 600; }
.center { text-align: center; }

/* ---------- Поля ---------- */

.field { display: block; margin: 16px 0 0; }
.field > span {
  display: block;
  margin-bottom: 6px;
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-dim);
}
.input-wrap { position: relative; }
.field input {
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  font-size: 17px; /* ≥16px: iOS не зумит при фокусе */
  background: rgba(4, 10, 22, 0.75);
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.field input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), 0 0 14px var(--glow);
}
.input-wrap input { padding-right: 56px; }
.reveal {
  position: absolute;
  top: 0; right: 0;
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  background: none;
  border: 0;
  color: var(--text-dim);
  cursor: pointer;
}
.reveal svg { width: 22px; height: 22px; }
.reveal[aria-pressed="true"] { color: var(--accent); }

.hint { margin-top: 6px; font-size: 13px; color: var(--text-faint); }

.warn {
  margin: 20px 0 0;
  padding: 14px;
  border: 1px solid rgba(255, 95, 122, 0.55);
  border-radius: 4px;
  background: rgba(255, 60, 90, 0.08);
  box-shadow: inset 0 0 18px rgba(255, 60, 90, 0.08);
}
.warn b {
  display: block;
  margin-bottom: 4px;
  color: var(--danger);
  letter-spacing: 0.12em;
  font-size: 13px;
  text-transform: uppercase;
}
.warn p { margin: 0; font-size: 14px; color: #ffd6dd; }

.check {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  margin-top: 14px;
  min-height: 44px;
  cursor: pointer;
  font-size: 15px;
  line-height: 1.4;
}
.check input {
  flex: none;
  appearance: none;
  -webkit-appearance: none;
  width: 26px;
  height: 26px;
  margin: 0;
  border: 1.5px solid var(--line);
  border-radius: 4px;
  background: rgba(4, 10, 22, 0.75);
  display: grid;
  place-items: center;
  cursor: pointer;
}
.check input::after {
  content: "";
  width: 12px;
  height: 7px;
  border-left: 2.5px solid var(--bg);
  border-bottom: 2.5px solid var(--bg);
  transform: translateY(-2px) rotate(-45deg) scale(0);
  transition: transform 0.15s;
}
.check input:checked { background: var(--accent); box-shadow: 0 0 12px var(--glow); }
.check input:checked::after { transform: translateY(-2px) rotate(-45deg) scale(1); }

/* ---------- Кнопки ---------- */

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  min-height: 54px;
  margin-top: 22px;
  padding: 12px 18px;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--accent-2);
  background: linear-gradient(180deg, rgba(80, 180, 255, 0.18), rgba(40, 120, 220, 0.1));
  border: 1px solid var(--accent);
  border-radius: 4px;
  box-shadow: 0 0 14px var(--glow), inset 0 0 14px rgba(100, 200, 255, 0.18);
  text-shadow: 0 0 8px var(--accent);
  cursor: pointer;
  transition: transform 0.12s, box-shadow 0.2s, opacity 0.2s;
}
.btn:active { transform: scale(0.98); box-shadow: 0 0 24px var(--glow), inset 0 0 20px rgba(100, 200, 255, 0.3); }
.btn:disabled { opacity: 0.45; cursor: default; transform: none; }
.btn.danger {
  color: #ffd6dd;
  border-color: var(--danger);
  background: rgba(255, 60, 90, 0.12);
  box-shadow: 0 0 14px var(--danger-glow), inset 0 0 14px rgba(255, 80, 110, 0.15);
  text-shadow: 0 0 8px var(--danger);
}
.btn.ghost {
  min-height: 48px;
  margin-top: 12px;
  font-size: 14px;
  letter-spacing: 0.08em;
  text-transform: none;
  font-weight: 500;
  color: var(--text-dim);
  background: none;
  border-color: transparent;
  box-shadow: none;
  text-shadow: none;
}
.btn .spin {
  width: 16px;
  height: 16px;
  border: 2px solid currentColor;
  border-right-color: transparent;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

.error {
  min-height: 1.4em;
  margin: 12px 0 0;
  font-size: 14px;
  color: var(--danger);
  text-align: center;
  text-shadow: 0 0 8px var(--danger-glow);
}
.shake { animation: shake 0.4s; }

/* ---------- Статус (временный главный экран этапа 1) ---------- */

.stat-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid rgba(120, 205, 255, 0.12);
  font-size: 15px;
}
.stat-row:last-of-type { border-bottom: 0; }
.stat-row > span:first-child { color: var(--text-dim); }
.stat-row > span:last-child { text-align: right; }
.mono { font-family: var(--mono); font-size: 13px; }
.ok { color: var(--ok); text-shadow: 0 0 8px rgba(109, 255, 192, 0.5); }

.footer-note {
  margin: 22px 0 0;
  font-size: 12px;
  color: var(--text-faint);
  text-align: center;
  letter-spacing: 0.06em;
}

/* ---------- Оболочка приложения ---------- */

#app.shell { justify-content: flex-start; padding: 0; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: calc(10px + var(--safe-t)) 16px 10px;
  background: linear-gradient(180deg, rgba(5, 7, 13, 0.97), rgba(5, 7, 13, 0.85));
  border-bottom: 1px solid var(--line-soft);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
.topbar .who { flex: 1; min-width: 0; }
.topbar .who small {
  display: block;
  font-size: 11px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--accent);
  text-shadow: 0 0 8px var(--glow);
}
.topbar .who b {
  display: block;
  font-size: 17px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.xp-total {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 700;
  color: var(--accent-2);
  text-shadow: 0 0 8px var(--glow);
  white-space: nowrap;
}
.icon-btn {
  flex: none;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  background: none;
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  color: var(--accent-2);
  cursor: pointer;
}
.icon-btn svg { width: 20px; height: 20px; }

.view {
  width: 100%;
  max-width: 560px;
  padding: 8px 16px calc(100px + var(--safe-b));
}

.section-h {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 24px 0 10px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--accent);
  text-shadow: 0 0 8px var(--glow);
}
.section-h::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--line-soft), transparent);
}
.section-h .count { color: var(--text-faint); letter-spacing: 0.08em; text-shadow: none; }

.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  display: flex;
  justify-content: center;
  padding: 4px 8px calc(4px + var(--safe-b));
  background: rgba(5, 7, 13, 0.95);
  border-top: 1px solid var(--line-soft);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
.tabbar button {
  flex: 1;
  max-width: 170px;
  min-height: 56px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  background: none;
  border: 0;
  color: var(--text-faint);
  font-size: 11px;
  letter-spacing: 0.06em;
  cursor: pointer;
}
.tabbar svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--accent-2); text-shadow: 0 0 8px var(--glow); }
.tabbar button[aria-current="page"] svg { filter: drop-shadow(0 0 6px var(--accent)); }

/* Панель — рамка окна Системы без анимации открытия */
.panel {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--line-soft);
  border-radius: 6px;
  box-shadow: 0 0 12px rgba(40, 140, 255, 0.12), inset 0 0 20px rgba(70, 170, 255, 0.06);
}
.panel.pad { padding: 4px 16px 16px; }

.empty { padding: 26px 18px; text-align: center; color: var(--text-dim); line-height: 1.5; }
.empty b { display: block; margin-bottom: 4px; color: var(--accent-2); letter-spacing: 0.1em; }

/* ---------- Квесты ---------- */

.btn.add { margin-top: 16px; }

.quest {
  display: flex;
  align-items: flex-start;
  gap: 4px;
  margin-bottom: 10px;
  padding: 8px 12px 10px 4px;
  transition: border-color 0.25s, opacity 0.3s;
}
.qcheck {
  flex: none;
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  padding: 0;
  background: none;
  border: 0;
  cursor: pointer;
}
.qbox {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border: 1.5px solid var(--line);
  border-radius: 4px;
  background: rgba(4, 10, 22, 0.75);
  box-shadow: inset 0 0 8px rgba(100, 200, 255, 0.15);
  transition: background 0.2s, box-shadow 0.2s;
}
.qbox::after {
  content: "";
  width: 13px;
  height: 7px;
  border-left: 2.5px solid var(--bg);
  border-bottom: 2.5px solid var(--bg);
  transform: translateY(-2px) rotate(-45deg) scale(0);
  transition: transform 0.18s cubic-bezier(0.3, 1.6, 0.5, 1);
}
.quest.done .qbox { background: var(--accent); box-shadow: 0 0 14px var(--glow); }
.quest.done .qbox::after { transform: translateY(-2px) rotate(-45deg) scale(1); }
.qbody {
  flex: 1;
  min-width: 0;
  padding: 12px 0 2px;
  background: none;
  border: 0;
  text-align: left;
  cursor: pointer;
}
.qtitle { display: block; font-size: 16px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.quest.done .qtitle { color: var(--text-dim); text-decoration: line-through; text-decoration-color: rgba(120, 205, 255, 0.55); }
.qnote {
  display: block;
  margin-top: 3px;
  font-size: 13px;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.qxp {
  flex: none;
  padding-top: 15px;
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 700;
  color: var(--accent-2);
  text-shadow: 0 0 8px var(--glow);
}
.quest.done .qxp { color: var(--text-faint); text-shadow: none; }
.quest.flash { animation: quest-flash 0.7s ease-out; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip {
  padding: 3px 8px;
  font-size: 12px;
  line-height: 1.3;
  color: var(--text-dim);
  border: 1px solid var(--line-soft);
  border-radius: 3px;
  background: rgba(80, 170, 255, 0.06);
}
.t-chore { --tc: #9fb6c8; }
.t-normal { --tc: #66d0ff; }
.t-goal { --tc: #b99bff; }
.t-epic { --tc: #ffc56b; }
.chip[class*="t-"] { color: var(--tc); border-color: var(--tc); background: none; }

.more {
  display: block;
  width: 100%;
  min-height: 44px;
  background: none;
  border: 0;
  color: var(--text-dim);
  font-size: 14px;
  cursor: pointer;
}

/* ---------- Характеристики ---------- */

.stat {
  display: block;
  width: 100%;
  margin-bottom: 10px;
  padding: 14px 16px;
  text-align: left;
  cursor: pointer;
}
.stat-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.stat-name { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
.stat-lv {
  flex: none;
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 700;
  color: var(--accent-2);
  text-shadow: 0 0 8px var(--glow);
}
.bar {
  position: relative;
  display: block;
  height: 8px;
  margin-top: 10px;
  overflow: hidden;
  border: 1px solid rgba(120, 205, 255, 0.2);
  border-radius: 4px;
  background: rgba(100, 190, 255, 0.08);
}
.bar > i {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0;
  border-radius: inherit;
  background: linear-gradient(90deg, #2f7fff, var(--accent-2));
  box-shadow: 0 0 10px var(--accent);
  transition: width 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.stat-xp {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 6px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-faint);
}

/* ---------- Статус ---------- */

.r-E { --rc: #9fb6c8; }
.r-D { --rc: #6dffc0; }
.r-C { --rc: #66d0ff; }
.r-B { --rc: #b99bff; }
.r-A { --rc: #ff8a5c; }
.r-S { --rc: #ffd36b; }
b[class^="r-"] { color: var(--rc); text-shadow: 0 0 8px var(--rc); }

.status {
  margin-top: 16px;
  padding: 0 16px 16px;
  border-color: var(--line);
  box-shadow:
    0 0 18px var(--glow),
    0 0 50px rgba(40, 130, 255, 0.16),
    inset 0 0 28px rgba(70, 170, 255, 0.12);
}
.status::before, .status::after {
  content: "";
  position: absolute;
  width: 16px;
  height: 16px;
  border: 2px solid var(--accent-2);
  filter: drop-shadow(0 0 6px var(--accent));
}
.status::before { top: -3px; left: -3px; border-right: 0; border-bottom: 0; }
.status::after { bottom: -3px; right: -3px; border-left: 0; border-top: 0; }
.status-head {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 0 12px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--line-soft);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--accent-2);
  text-shadow: 0 0 10px var(--accent);
}
.status-head .sys-icon { width: 26px; height: 26px; }

.status-main { display: flex; align-items: center; gap: 14px; }
.rank-badge {
  flex: none;
  width: 76px;
  height: 76px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--rc);
  border-radius: 6px;
  background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--rc) 22%, transparent), transparent 70%);
  box-shadow: 0 0 16px color-mix(in srgb, var(--rc) 55%, transparent), inset 0 0 16px color-mix(in srgb, var(--rc) 25%, transparent);
}
.rank-badge small { font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--rc); opacity: 0.85; }
.rank-badge b { font-size: 40px; line-height: 1; font-weight: 900; color: var(--rc); text-shadow: 0 0 14px var(--rc); }
.r-S .rank-badge { animation: rank-pulse 2.4s ease-in-out infinite; }

.status-who { flex: 1; min-width: 0; }
.status-name { font-size: 21px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.status-title { margin-top: 4px; font-size: 13px; color: var(--rc); letter-spacing: 0.04em; }
.status-level { flex: none; text-align: center; }
.status-level small { display: block; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-dim); }
.status-level b {
  display: block;
  font-family: var(--mono);
  font-size: 40px;
  line-height: 1;
  font-weight: 800;
  color: var(--accent-2);
  text-shadow: 0 0 14px var(--accent);
}
.bar.big { height: 12px; margin-top: 18px; border-radius: 6px; }
.status-next { margin: 12px 0 0; font-size: 14px; color: var(--text-dim); text-align: center; }

.counters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.counters > div {
  padding: 10px 8px;
  text-align: center;
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  background: rgba(4, 10, 22, 0.5);
}
.counters b { display: block; font-family: var(--mono); font-size: 18px; color: var(--accent-2); }
.counters small { display: block; margin-top: 2px; font-size: 11px; color: var(--text-faint); letter-spacing: 0.04em; }

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat-grid .stat { margin: 0; padding: 12px; }
.stat-grid .stat-name { font-size: 14px; line-height: 1.25; }
.stat-grid .stat-lv { font-size: 18px; }
.stat-lv small { margin-right: 3px; font-size: 11px; font-weight: 400; color: var(--text-dim); text-shadow: none; }
.stat-grid + .btn { margin-top: 16px; }
@media (max-width: 340px) { .stat-grid { grid-template-columns: 1fr; } }

/* ---------- Журнал и статистика ---------- */

.counters.four { grid-template-columns: 1fr 1fr; }
.counters .streak b { color: #ffc56b; text-shadow: 0 0 10px rgba(255, 197, 107, 0.6); }
.counters .streak.cold b { color: var(--text-dim); text-shadow: none; }
.streak-hint { margin: 10px 0 0; font-size: 13px; text-align: center; color: var(--text-dim); }
.streak-hint.warn { color: var(--warn); }

.chart { padding: 14px 16px 12px; margin-top: 12px; }
.chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.chart-head b { font-size: 14px; font-weight: 600; }
.chart-head span { font-family: var(--mono); font-size: 13px; color: var(--text-dim); }
.bars {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  align-items: end;
  height: 150px;
  margin-top: 10px;
  border-bottom: 1px solid rgba(120, 205, 255, 0.18);
}
.bar-col {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding: 0;
  background: none;
  border: 0;
  cursor: pointer;
}
.bar-val {
  min-height: 18px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text);
  visibility: hidden;
}
.bar-col.lbl .bar-val, .bar-col.sel .bar-val { visibility: visible; }
.bar-track { position: relative; width: 22px; height: calc(100% - 22px); display: flex; align-items: flex-end; }
.bar-track > i {
  display: block;
  width: 100%;
  height: 0;
  border-radius: 4px 4px 0 0;
  background: var(--accent);
  box-shadow: 0 0 10px rgba(102, 208, 255, 0.45);
  transition: height 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.bar-col.sel .bar-track > i { background: var(--accent-2); }
.bar-days { display: grid; grid-template-columns: repeat(7, 1fr); margin-top: 6px; }
.bar-days span { font-size: 11px; text-align: center; color: var(--text-faint); }
.bar-days span.today { color: var(--text); font-weight: 600; }

.day-h {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  margin: 22px 0 8px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}
.day-h span { font-family: var(--mono); font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--text-dim); }
.log-list { padding: 2px 14px; }
.log-row {
  display: grid;
  grid-template-columns: 44px 1fr auto;
  gap: 4px 10px;
  align-items: baseline;
  padding: 11px 0;
  border-bottom: 1px solid rgba(120, 205, 255, 0.1);
}
.log-row:last-child { border-bottom: 0; }
.log-time { font-family: var(--mono); font-size: 12px; color: var(--text-faint); }
.log-title { font-size: 15px; overflow-wrap: anywhere; }
.log-xp { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--accent-2); }
.log-sub { grid-column: 2 / 4; font-size: 12px; color: var(--text-faint); }
.log-sub .chip { margin-right: 6px; padding: 1px 6px; font-size: 11px; }

/* ---------- Бэкап ---------- */

.backup-banner {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 16px;
  padding: 12px 12px 12px 16px;
  border-color: rgba(255, 197, 107, 0.55);
  box-shadow: 0 0 14px rgba(255, 197, 107, 0.18), inset 0 0 16px rgba(255, 197, 107, 0.06);
}
.backup-banner p { flex: 1; margin: 0; font-size: 14px; line-height: 1.4; color: #ffe2b0; }
.backup-banner p b { display: block; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--warn); }
.backup-banner .btn { width: auto; min-height: 44px; margin: 0; padding: 8px 14px; font-size: 13px; letter-spacing: 0.08em; }
.warn-text { color: var(--warn); }
.ios-hint { color: var(--text-dim); margin-top: 14px !important; padding: 12px; border: 1px dashed var(--line-soft); border-radius: 4px; font-size: 13px !important; }

/* ---------- Настройки ---------- */

.set-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid rgba(120, 205, 255, 0.12);
}
.set-row b { display: block; font-size: 15px; color: var(--tc, var(--text)); }
.set-row small { display: block; margin-top: 2px; font-size: 12px; color: var(--text-faint); }
.xp-input { flex: none; display: flex; align-items: center; gap: 8px; color: var(--text-dim); font-size: 13px; }
.xp-input input {
  width: 92px;
  min-height: 44px;
  padding: 8px 10px;
  font-family: var(--mono);
  font-size: 17px;
  text-align: right;
  background: rgba(4, 10, 22, 0.75);
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  outline: none;
}
.xp-input input:disabled { opacity: 0.5; }
.xp-input input:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 12px var(--glow); }

/* ---------- Окна поверх экрана ---------- */

.layer {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  padding: calc(16px + var(--safe-t)) 12px calc(12px + var(--safe-b));
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  background: rgba(2, 4, 10, 0.82);
  animation: fade 0.2s both;
}
.layer > .sys {
  margin-top: auto;
  align-self: center;
  max-width: 480px;
  background: linear-gradient(180deg, rgba(110, 200, 255, 0.07), transparent 40%), #07101f;
}
@media (min-width: 600px) { .layer > .sys { margin-bottom: auto; } }
html.noscroll, html.noscroll body { overflow: hidden; }

.field textarea {
  width: 100%;
  min-height: 72px;
  padding: 12px 14px;
  font-size: 17px;
  line-height: 1.4;
  resize: vertical;
  background: rgba(4, 10, 22, 0.75);
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  outline: none;
}
.field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 14px var(--glow); }

.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choices.types { display: grid; grid-template-columns: 1fr 1fr; }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice > span {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 46px;
  height: 100%;
  padding: 8px 14px;
  font-size: 15px;
  color: var(--text);
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  background: rgba(4, 10, 22, 0.75);
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s, color 0.15s;
}
.choice b { font-weight: 600; color: var(--tc, inherit); }
.choice small { font-family: var(--mono); font-size: 12px; color: var(--text-faint); }
.choice input:checked + span {
  color: var(--accent-2);
  border-color: var(--tc, var(--accent));
  box-shadow: 0 0 12px var(--glow), inset 0 0 10px rgba(100, 200, 255, 0.18);
}
.choice input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn.ghost.danger-text { color: var(--danger); }
.btn.armed { color: #fff; border-color: var(--danger); background: rgba(255, 60, 90, 0.2); text-shadow: 0 0 8px var(--danger); }

/* ---------- Уведомления ---------- */

.toasts {
  position: fixed;
  z-index: 60;
  top: calc(74px + var(--safe-t));
  left: 0;
  right: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 0 16px;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  width: 100%;
  max-width: 420px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 12px 12px 16px;
  background: #081325;
  border: 1px solid var(--line);
  border-radius: 6px;
  box-shadow: 0 0 18px var(--glow), inset 0 0 16px rgba(70, 170, 255, 0.15);
  animation: toast-in 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
.toast.out { animation: toast-out 0.25s ease-in both; }
.toast .t-body { flex: 1; min-width: 0; }
.toast .t-title { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); }
.toast .t-main { font-size: 18px; font-weight: 800; color: var(--accent-2); text-shadow: 0 0 10px var(--accent); }
.toast .t-sub { margin-top: 2px; font-size: 13px; color: var(--text-dim); }
.toast button {
  flex: none;
  min-height: 44px;
  padding: 0 14px;
  font-size: 14px;
  color: var(--accent-2);
  background: none;
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  cursor: pointer;
}
.toast.up { border-color: var(--warn); box-shadow: 0 0 18px rgba(255, 197, 107, 0.45), inset 0 0 16px rgba(255, 197, 107, 0.12); }
.toast.up .t-title { color: var(--warn); }
.toast.up .t-main { color: #ffe2b0; text-shadow: 0 0 10px var(--warn); }
.toast.minus { border-color: rgba(255, 95, 122, 0.6); box-shadow: 0 0 14px var(--danger-glow); }
.toast.minus .t-title { color: var(--danger); }
.toast.minus .t-main { color: #ffd6dd; text-shadow: none; }

/* ---------- Отклик: полоса опыта в шапке, всплывающий опыт ---------- */

.topbar-xp {
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 2px;
  background: rgba(100, 190, 255, 0.1);
}
.topbar-xp > i {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0;
  background: linear-gradient(90deg, #2f7fff, var(--accent-2));
  box-shadow: 0 0 8px var(--accent), 0 0 2px var(--accent-2);
  transition: width 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.float-xp {
  position: fixed;
  z-index: 95;
  pointer-events: none;
  transform: translate(-50%, -50%);
  font-family: var(--mono);
  font-size: 20px;
  font-weight: 800;
  white-space: nowrap;
  color: var(--accent-2);
  text-shadow: 0 0 10px var(--accent), 0 0 22px var(--accent);
  animation: float-xp 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
.quest.flash .qbox { animation: check-pop 0.45s cubic-bezier(0.3, 1.6, 0.5, 1); }

#fx-canvas {
  position: fixed;
  inset: 0;
  z-index: 90;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* ---------- Полноэкранные окна «Система» ---------- */

.fx-overlay {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b));
  overflow: hidden;
  background: radial-gradient(70% 55% at 50% 50%, color-mix(in srgb, var(--fxc) 22%, transparent), transparent 70%), rgba(2, 4, 10, 0.9);
  animation: fade 0.3s both;
  --fxc: var(--accent);
}
.fx-overlay.rank { --fxc: var(--rc); }
.fx-overlay.out { animation: fade-out 0.3s both; }
.fx-overlay .fx-win {
  max-width: 400px;
  text-align: center;
  border-color: var(--fxc);
  box-shadow: 0 0 24px color-mix(in srgb, var(--fxc) 60%, transparent), 0 0 80px color-mix(in srgb, var(--fxc) 25%, transparent), inset 0 0 30px color-mix(in srgb, var(--fxc) 18%, transparent);
}
.fx-overlay.rank .fx-win { animation-delay: 0.55s; }
.fx-overlay.rank .fx-win > *:not(.scan) { animation-delay: 0.9s; }
.fx-overlay.rank.shake-hard .fx-win { animation: sys-open 0.55s 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both, hard-shake 0.5s 1.25s; }

.fx-beam {
  position: absolute;
  left: 50%;
  top: -10%;
  bottom: -10%;
  width: 180px;
  margin-left: -90px;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--fxc) 35%, transparent), transparent);
  filter: blur(6px);
  transform-origin: 50% 100%;
  animation: beam 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) both, beam-breathe 3s 1.2s ease-in-out infinite;
  pointer-events: none;
}
.fx-big {
  margin: 4px 0 6px;
  font-size: 44px;
  font-weight: 900;
  font-style: italic;
  line-height: 1.05;
  letter-spacing: 0.08em;
  color: #fff;
  text-shadow: 0 0 10px var(--fxc), 0 0 28px var(--fxc), 0 0 54px var(--fxc);
}
.fx-overlay .sys > .fx-big { animation: big-in 0.7s 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both, glow-pulse 2s 1.1s ease-in-out infinite; }
.fx-level {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 14px;
  margin: 6px 0 4px;
  font-family: var(--mono);
}
.fx-level .from { font-size: 26px; color: var(--text-faint); }
.fx-level .arrow { font-size: 22px; color: var(--accent); }
.fx-level .to {
  font-size: 54px;
  font-weight: 800;
  color: var(--accent-2);
  text-shadow: 0 0 16px var(--accent);
  animation: num-pop 0.6s 0.85s cubic-bezier(0.3, 1.6, 0.5, 1) both;
}
.fx-sub { margin: 10px 0 0 !important; color: var(--text-dim) !important; font-size: 15px; }
.fx-list {
  margin: 14px 0 0;
  padding: 10px 12px;
  list-style: none;
  font-size: 14px;
  line-height: 1.7;
  color: #ffe2b0;
  border: 1px solid rgba(255, 197, 107, 0.35);
  border-radius: 4px;
  background: rgba(255, 197, 107, 0.06);
}
.fx-list li::before { content: "▲ "; color: var(--warn); }
.fx-overlay .btn[disabled] { opacity: 0.35; }

.fx-flash {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 50%, #fff, color-mix(in srgb, var(--fxc) 70%, #fff) 40%, transparent 75%);
  animation: flash 0.9s ease-out both;
  pointer-events: none;
}
.fx-ring {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 160px;
  height: 160px;
  margin: -80px 0 0 -80px;
  border: 3px solid var(--fxc);
  border-radius: 50%;
  box-shadow: 0 0 30px var(--fxc), inset 0 0 30px var(--fxc);
  animation: ring 1.3s 0.1s cubic-bezier(0.1, 0.7, 0.3, 1) both;
  pointer-events: none;
}
.fx-ring.d2 { animation-delay: 0.35s; border-width: 2px; }
.fx-rank {
  position: relative;
  height: 120px;
  margin: 4px 0;
  display: grid;
  place-items: center;
}
.fx-rank > * {
  grid-area: 1 / 1;
  font-size: 104px;
  font-weight: 900;
  line-height: 1;
}
.fx-rank .old { color: var(--text-faint); animation: rank-old 0.8s 0.9s ease-in both; }
.fx-rank .new {
  color: var(--rc);
  text-shadow: 0 0 18px var(--rc), 0 0 44px var(--rc), 0 0 90px var(--rc);
  animation: rank-new 0.75s 1.45s cubic-bezier(0.2, 1.4, 0.4, 1) both, rank-glow 2.4s 2.2s ease-in-out infinite;
}
.fx-big.small { font-size: 30px; letter-spacing: 0.2em; }
.fx-overlay.rank .sys > .fx-big { animation-delay: 1.7s, 2.4s; }
.fx-title { margin: 8px 0 0 !important; font-size: 18px; font-weight: 700; color: var(--rc) !important; text-shadow: 0 0 10px var(--rc); }

/* ---------- Достижение за целевой и эпический квест ---------- */

.fx-overlay.ach { --fxc: #b99bff; flex-direction: column; }
.fx-overlay.ach.epic { --fxc: #ffc56b; }
.ach-rays {
  position: absolute;
  left: 50%;
  top: 34%;
  width: 1000px;
  height: 1000px;
  margin: -500px 0 0 -500px;
  pointer-events: none;
  animation: rays-in 0.9s 0.75s ease-out both;
}
.ach-rays > i {
  position: absolute;
  inset: 0;
  background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--fxc) 30%, transparent) 0deg 7deg, transparent 7deg 18deg);
  mask-image: radial-gradient(circle, #000 0, rgba(0, 0, 0, 0.6) 22%, transparent 55%);
  -webkit-mask-image: radial-gradient(circle, #000 0, rgba(0, 0, 0, 0.6) 22%, transparent 55%);
  animation: rays-spin 18s linear infinite;
}
.ach-stage { position: relative; z-index: 1; width: 100%; max-width: 400px; }
.ach-medal {
  position: relative;
  z-index: 2;
  width: 136px;
  height: 136px;
  margin: 0 auto -26px;
  perspective: 700px;
}
.ach-medal svg {
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 0 14px var(--fxc)) drop-shadow(0 0 34px color-mix(in srgb, var(--fxc) 60%, transparent));
  animation: medal-drop 1s 0.15s cubic-bezier(0.25, 1.25, 0.45, 1) both, medal-glow 2.4s 1.3s ease-in-out infinite;
}
.ach-medal .fx-ring { animation-delay: 0.95s; }
.ach-medal .fx-ring.d2 { animation-delay: 1.15s; }
.fx-overlay.ach .fx-flash { animation-delay: 0.9s; }
.fx-overlay.ach .ach-win { padding-top: 40px; animation-delay: 0.55s; }
.fx-overlay.ach .ach-win > *:not(.scan) { animation-delay: 1s; }
.fx-overlay.ach.epic.shake-hard .ach-stage { animation: hard-shake 0.5s 1s; }
.ach-label {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--fxc);
  text-shadow: 0 0 12px var(--fxc);
}
.ach-title {
  margin: 10px 0 0;
  font-size: 24px;
  font-weight: 800;
  line-height: 1.25;
  color: #fff;
  overflow-wrap: anywhere;
  text-shadow: 0 0 14px color-mix(in srgb, var(--fxc) 70%, transparent);
}
.fx-overlay .sys > .ach-xp {
  margin-top: 10px;
  font-family: var(--mono);
  font-size: 30px;
  font-weight: 800;
  color: var(--accent-2);
  text-shadow: 0 0 14px var(--accent);
  animation: num-pop 0.6s 1.3s cubic-bezier(0.3, 1.6, 0.5, 1) both;
}
.ach-num { margin: 12px 0 0 !important; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-faint) !important; }

/* ---------- Главные цели ---------- */

.goal {
  display: block;
  width: 100%;
  margin-bottom: 12px;
  padding: 16px;
  text-align: left;
  cursor: pointer;
  border-color: color-mix(in srgb, var(--gc) 45%, transparent);
  box-shadow: 0 0 16px color-mix(in srgb, var(--gc) 16%, transparent), inset 0 0 24px color-mix(in srgb, var(--gc) 7%, transparent);
}
.goal-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.goal-name { font-size: 17px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.goal-pct {
  flex: none;
  font-family: var(--mono);
  font-size: 26px;
  font-weight: 800;
  color: var(--gc);
  text-shadow: 0 0 12px var(--gc);
}
.goal-bar {
  position: relative;
  display: block;
  height: 16px;
  margin-top: 12px;
  overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--gc) 30%, transparent);
  border-radius: 8px;
  background: rgba(100, 190, 255, 0.07);
}
.goal-bar > i {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0;
  overflow: hidden;
  border-radius: inherit;
  background: linear-gradient(90deg, color-mix(in srgb, var(--gc) 45%, #0b1830), var(--gc));
  box-shadow: 0 0 14px var(--gc);
  transition: width 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.goal-bar > i::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: -40%;
  width: 40%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
  animation: goal-shine 3.2s 1.4s ease-in-out infinite;
}
.goal-bar > b { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--bg); z-index: 1; }
.goal-bar > b.q { width: 1px; background: color-mix(in srgb, var(--gc) 25%, transparent); }
.goal-sub { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: 13px; color: var(--text-dim); }
.goal-sub span:last-child { font-family: var(--mono); color: var(--text-faint); text-align: right; }
.goal.done .goal-name::after { content: " ✓"; color: var(--gc); }
.goal-empty { color: var(--warn); }
.chip.goal-chip { color: var(--gc); border-color: color-mix(in srgb, var(--gc) 60%, transparent); background: none; }
.link-list {
  max-height: 300px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 2px 12px 10px;
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  background: rgba(4, 10, 22, 0.5);
}
.link-list .check { margin-top: 10px; font-size: 14px; }
.link-list .check input { width: 26px; height: 26px; min-height: 0; padding: 0; }
.link-list small { display: block; font-size: 12px; color: var(--text-faint); }
.btn.gold {
  color: #ffe2b0;
  border-color: var(--warn);
  background: rgba(255, 197, 107, 0.12);
  box-shadow: 0 0 14px rgba(255, 197, 107, 0.35), inset 0 0 14px rgba(255, 197, 107, 0.12);
  text-shadow: 0 0 8px var(--warn);
}

/* ---------- Колесо баланса ---------- */

.radar { padding: 14px 10px 14px; }
.radar .chart-head { padding: 0 6px; }
.radar svg { display: block; width: 100%; max-width: 480px; height: auto; margin: 4px auto 0; }
.radar .grid polygon { fill: none; stroke: rgba(120, 205, 255, 0.14); stroke-width: 1; }
.radar .grid polygon.outer { stroke: rgba(120, 205, 255, 0.28); }
.radar .grid line { stroke: rgba(120, 205, 255, 0.14); stroke-width: 1; }
.radar .shape-g {
  transform-box: view-box;
  transform-origin: 50% 50%;
  animation: radar-grow 1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
.radar .shape {
  fill: rgba(102, 208, 255, 0.16);
  stroke: var(--accent);
  stroke-width: 2;
  stroke-linejoin: round;
  filter: drop-shadow(0 0 8px rgba(102, 208, 255, 0.6));
}
.radar .pt { fill: var(--accent-2); stroke: var(--bg); stroke-width: 2; }
.radar .pt.weak { fill: var(--warn); }
.radar .hit { fill: transparent; cursor: pointer; }
.radar text { fill: var(--text-dim); font-family: var(--font); font-size: 16px; }
.radar text.weak { fill: var(--warn); }
.radar text.sel { fill: var(--text); font-weight: 700; }
.radar-caption { min-height: 20px; margin: 6px 6px 0; font-size: 13px; line-height: 1.45; text-align: center; color: var(--text-dim); }
.radar-caption b { color: var(--text); font-weight: 600; }

/* ---------- Переключатели ---------- */

.toggle {
  flex: none;
  appearance: none;
  -webkit-appearance: none;
  position: relative;
  width: 54px;
  height: 32px;
  margin: 0;
  border: 1px solid var(--line-soft);
  border-radius: 16px;
  background: rgba(4, 10, 22, 0.75);
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
}
.toggle::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--text-dim);
  transition: transform 0.2s cubic-bezier(0.3, 1.4, 0.5, 1), background 0.2s;
}
.toggle:checked { background: rgba(80, 180, 255, 0.25); border-color: var(--accent); box-shadow: 0 0 12px var(--glow); }
.toggle:checked::after { transform: translateX(22px); background: var(--accent-2); box-shadow: 0 0 10px var(--accent); }
.btn-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn-pair .btn { margin-top: 16px; font-size: 13px; letter-spacing: 0.1em; min-height: 48px; padding: 8px; }

/* ---------- Анимации ---------- */

@keyframes sys-open {
  0%   { opacity: 0; transform: scaleX(0.02) scaleY(0.006); }
  45%  { opacity: 1; transform: scaleX(1) scaleY(0.006); }
  100% { opacity: 1; transform: scale(1); }
}

@keyframes scan { to { top: 100%; } }
@keyframes spin { to { transform: rotate(360deg); } }

@keyframes fade-out { to { opacity: 0; } }
@keyframes float-xp {
  0% { opacity: 0; transform: translate(-50%, -30%) scale(0.6); }

  100% { opacity: 0; transform: translate(-50%, -260%) scale(1); }
}
@keyframes check-pop { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
@keyframes beam { from { transform: scaleY(0); opacity: 0; } 40% { opacity: 1; } to { transform: scaleY(1); opacity: 0.7; } }

}
@keyframes glow-pulse { 50% { text-shadow: 0 0 14px var(--fxc), 0 0 40px var(--fxc), 0 0 80px var(--fxc); } }
@keyframes num-pop { from { opacity: 0; transform: scale(0.3); } }

}

<script>
'use strict';

/* =====================================================================
   НАСТРОЙКИ
   ===================================================================== */

const CONFIG = {
  storageKey: 'system.vault.v1',
  kdfIterations: 310000,        // PBKDF2-SHA-256, ТЗ требует ≥ 200 000
  minPasswordLength: 8,
  autoLockMs: 5 * 60 * 1000,    // 5 минут бездействия
};

/* =====================================================================
   КРИПТОГРАФИЯ (Web Crypto API)
   Ключ AES-GCM-256 выводится из пароля через PBKDF2 со случайной солью.
   На каждое сохранение — новый случайный IV. Пароль нигде не хранится;
   в памяти живёт только неизвлекаемый CryptoKey, пока сессия открыта.
   ===================================================================== */

const AAD = new TextEncoder().encode('system-vault-v1');

const b64 = {
  encode(bytes) {
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  },
  decode(str) {
    const s = atob(str);
    const out = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  },
};

async function deriveKey(password, salt, iterations) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', hash: 'SHA-256', salt, iterations },
    base,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt'],
  );
}

async function encryptJSON(key, kdf, data) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const plain = new TextEncoder().encode(JSON.stringify(data));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: AAD }, key, plain));
  return { v: 1, kdf, iv: b64.encode(iv), ct: b64.encode(ct) };
}

/** Бросает ошибку, если пароль неверный (не сошёлся тег GCM). */
async function decryptJSON(key, record) {
  const plain = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: b64.decode(record.iv), additionalData: AAD },
    key,
    b64.decode(record.ct),
  );
  return JSON.parse(new TextDecoder().decode(plain));
}

function newKdfParams() {
  return {
    name: 'PBKDF2',
    hash: 'SHA-256',
    iter: CONFIG.kdfIterations,
    salt: b64.encode(crypto.getRandomValues(new Uint8Array(16))),
  };
}

/* =====================================================================
   ХРАНИЛИЩЕ
   В localStorage лежит только зашифрованная запись { v, kdf, iv, ct }.
   ===================================================================== */

const Vault = {
  read() {
    const raw = localStorage.getItem(CONFIG.storageKey);
    return raw ? JSON.parse(raw) : null;
  },
  exists() {
    return localStorage.getItem(CONFIG.storageKey) !== null;
  },
  write(record) {
    localStorage.setItem(CONFIG.storageKey, JSON.stringify(record));
  },
  wipe() {
    localStorage.removeItem(CONFIG.storageKey);
  },
};

/* =====================================================================
   ДАННЫЕ ИГРОКА
   ===================================================================== */

/** Типы задач. Опыт по умолчанию; текущие значения — в state.settings.xp. */
const TASK_TYPES = [
  { id: 'chore', name: 'Бытовая', xp: 10, hint: 'Покупки, мелкие дела' },
  { id: 'normal', name: 'Обычная', xp: 25, hint: 'Средние задачи' },
  { id: 'goal', name: 'Целевая', xp: 60, hint: 'Блог, деньги, карьера' },
  { id: 'epic', name: 'Эпическая', xp: 200, hint: 'Босс: крупный рубеж' },
];
const TYPE_BY_ID = Object.fromEntries(TASK_TYPES.map((t) => [t.id, t]));

const DEFAULT_STATS = ['Сила', 'Интеллект', 'Креатив', 'Дисциплина', 'Карьера', 'Творческая реализация', 'Проявленность', 'Харизма'];

const REPEATS = { none: 'Разовый', daily: 'Каждый день', weekly: 'Каждую неделю' };

/** Ранги охотника и общий уровень, с которого они даются. Текущие пороги — в state.settings.ranks. */
const RANKS = [
  { id: 'E', from: 1 },
  { id: 'D', from: 5 },
  { id: 'C', from: 10 },
  { id: 'B', from: 15 },
  { id: 'A', from: 20 },
  { id: 'S', from: 30 },
];
const defaultRankThresholds = () => Object.fromEntries(RANKS.slice(1).map((r) => [r.id, r.from]));

function uid() {
  return Array.from(crypto.getRandomValues(new Uint8Array(8)), (b) => b.toString(16).padStart(2, '0')).join('');
}

function defaultState(name) {
  return migrate({ schema: 1, createdAt: Date.now(), profile: { name: name || 'Игрок' } });
}

/**
 * Доводит расшифрованные данные до текущей схемы.
 * quests — список задач; log — журнал выполнений, из которого считается весь опыт:
 * { id, questId, title, type, xp, stats: { statId: xp }, period, at }.
 */
function migrate(state) {
  state.settings = state.settings || {};
  state.settings.xp = Object.assign(Object.fromEntries(TASK_TYPES.map((t) => [t.id, t.xp])), state.settings.xp);
  state.stats = state.stats || DEFAULT_STATS.map((name) => ({ id: uid(), name }));
  state.quests = state.quests || [];
  state.log = state.log || [];
  state.settings.ranks = Object.assign(defaultRankThresholds(), state.settings.ranks);
  if (state.settings.sound === undefined) state.settings.sound = true;
  if (state.settings.haptics === undefined) state.settings.haptics = true;
  state.goals = state.goals || [];
  state.schema = 5;
  return state;
}

/* =====================================================================
   ПРОКАЧКА
   ===================================================================== */

/** Опыт, нужный для перехода с уровня level на следующий. */
function xpToNext(level) {
  return Math.round(100 * Math.pow(level, 1.5));
}

function levelInfo(xp) {
  let level = 1;
  let into = xp;
  while (into >= xpToNext(level)) {
    into -= xpToNext(level);
    level++;
  }
  return { level, into, need: xpToNext(level) };
}

/** Делит опыт поровну между характеристиками; остаток раздаётся по единице первым. */
function splitXp(xp, statIds) {
  const out = {};
  if (!statIds.length) return out;
  const base = Math.floor(xp / statIds.length);
  let rest = xp - base * statIds.length;
  for (const id of statIds) out[id] = base + (rest-- > 0 ? 1 : 0);
  return out;
}

function totalXp() {
  return session.state.log.reduce((sum, e) => sum + e.xp, 0);
}

function statXp() {
  const map = new Map();
  for (const e of session.state.log) {
    for (const [id, xp] of Object.entries(e.stats)) map.set(id, (map.get(id) || 0) + xp);
  }
  return map;
}

function rankOf(level) {
  const thresholds = session.state.settings.ranks;
  let rank = RANKS[0].id;
  for (const r of RANKS.slice(1)) if (level >= thresholds[r.id]) rank = r.id;
  return rank;
}

/** Общий уровень и ранг персонажа. */
function playerInfo(xp = totalXp()) {
  const info = levelInfo(xp);
  return { ...info, xp, rank: rankOf(info.level) };
}

function statName(id) {
  const stat = session.state.stats.find((s) => s.id === id);
  return stat ? stat.name : '—';
}

/* ---------- Статистика: опыт за день и неделю, серия дней ---------- */

/** Русское склонение: plural(3, ['день', 'дня', 'дней']) → 'дня'. */
function plural(n, forms) {
  const m10 = n % 10;
  const m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return forms[0];
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return forms[1];
  return forms[2];
}

function addDays(d, n) {
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() + n);
  return t;
}

/** dayKey → { xp, count } по журналу. */
const isPrologue = (e) => e.source === 'prologue';

/** dayKey → { xp, count } по журналу. Пролог — прошлые достижения без дат — сюда не входит. */
function xpByDay() {
  const map = new Map();
  for (const e of session.state.log) {
    if (isPrologue(e)) continue;
    const key = dayKey(new Date(e.at));
    const day = map.get(key) || { xp: 0, count: 0 };
    day.xp += e.xp;
    day.count++;
    map.set(key, day);
  }
  return map;
}

function weekXp(now = new Date()) {
  const week = weekKey(now);
  return session.state.log.reduce((sum, e) => sum + (!isPrologue(e) && weekKey(new Date(e.at)) === week ? e.xp : 0), 0);
}

/**
 * Серия — дни подряд хотя бы с одним выполненным квестом.
 * Если сегодня ещё ничего не сделано, серия жива до конца дня и считается со вчера.
 */
function streakInfo(now = new Date()) {
  const days = xpByDay();
  const todayDone = days.has(dayKey(now));
  let d = todayDone ? now : addDays(now, -1);
  let current = 0;
  while (days.has(dayKey(d))) {
    current++;
    d = addDays(d, -1);
  }
  let best = 0;
  let run = 0;
  let prev = null;
  for (const key of [...days.keys()].sort()) {
    const [y, m, dd] = key.split('-').map(Number);
    const date = new Date(y, m - 1, dd);
    run = prev && dayKey(addDays(prev, 1)) === key ? run + 1 : 1;
    best = Math.max(best, run);
    prev = date;
  }
  return { current, best, todayDone };
}

/* ---------- Периоды повторяющихся квестов ---------- */

const pad = (n) => String(n).padStart(2, '0');

function dayKey(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

/** ISO-неделя: начинается в понедельник. */
function weekKey(d) {
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() - ((t.getDay() + 6) % 7) + 3); // четверг этой недели
  const jan4 = new Date(t.getFullYear(), 0, 4);
  const week = 1 + Math.round(((t - jan4) / 864e5 - 3 + ((jan4.getDay() + 6) % 7)) / 7);
  return `${t.getFullYear()}-W${pad(week)}`;
}

/** Текущий период квеста: null для разовых. */
function periodKey(repeat, d = new Date()) {
  if (repeat === 'daily') return 'd:' + dayKey(d);
  if (repeat === 'weekly') return 'w:' + weekKey(d);
  return null;
}

/** questId → запись журнала, которая отмечает квест выполненным сейчас. */
function completionIndex() {
  const { quests, log } = session.state;
  const now = new Date();
  const periods = new Map(quests.map((q) => [q.id, periodKey(q.repeat, now)]));
  const map = new Map();
  for (const e of log) {
    if (periods.has(e.questId) && periods.get(e.questId) === e.period) map.set(e.questId, e);
  }
  return map;
}

/* =====================================================================
   СЕССИЯ
   session = { key, kdf, state } пока приложение разблокировано, иначе null.
   ===================================================================== */

let session = null;
let saveChain = Promise.resolve();
let lastSavedAt = null;

async function createVault(password, name) {
  const kdf = newKdfParams();
  const key = await deriveKey(password, b64.decode(kdf.salt), kdf.iter);
  const state = defaultState(name);
  Vault.write(await encryptJSON(key, kdf, state));
  lastSavedAt = Date.now();
  session = { key, kdf, state };
  // Просим браузер не вычищать хранилище при нехватке места
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}

async function unlockVault(password) {
  const record = Vault.read();
  const kdf = record.kdf;
  const key = await deriveKey(password, b64.decode(kdf.salt), kdf.iter);
  const state = migrate(await decryptJSON(key, record)); // неверный пароль → исключение
  session = { key, kdf, state };
  lastSavedAt = null;
}

/**
 * Шифрует и сохраняет текущее состояние. Снимок и ключ берутся синхронно,
 * поэтому сохранение завершится, даже если сразу после вызова сработает блокировка.
 */
function save() {
  if (!session) return saveChain;
  const { key, kdf } = session;
  const snapshot = JSON.parse(JSON.stringify(session.state));
  saveChain = saveChain
    .then(() => encryptJSON(key, kdf, snapshot))
    .then((record) => {
      Vault.write(record);
      lastSavedAt = Date.now();
      if (session) renderSavedAt();
    })
    .catch((err) => {
      console.error(err);
      showError('Не удалось сохранить данные: ' + (err && err.name === 'QuotaExceededError' ? 'нет места в хранилище.' : 'ошибка записи.'));
    });
  return saveChain;
}

function lock(reason) {
  if (!session) return;
  endSession();
  showLogin(reason);
}

/** Закрывает сессию: забывает ключ и данные, убирает всё, что было на экране. */
function endSession() {
  flushInputs();
  session = null; // ключ и расшифрованные данные больше недоступны
  clearTimeout(renderTimer);
  closeSheet();
  closeFx();
  clearToasts();
  if (document.activeElement) document.activeElement.blur();
}

for (const ev of ['pointerdown', 'keydown', 'touchstart', 'wheel', 'scroll', 'input']) {

const app = document.getElementById('app');

function mount(templateId) {
  const node = document.getElementById(templateId).content.cloneNode(true);
  app.className = '';
  app.replaceChildren(node);
  wireRevealButtons(app);
  return app.firstElementChild;
}

const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';

function wireRevealButtons(root) {
  root.querySelectorAll('.reveal').forEach((btn) => {
    btn.innerHTML = EYE;
    btn.addEventListener('click', () => {
      const input = btn.previousElementSibling;
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.setAttribute('aria-pressed', String(show));
      btn.setAttribute('aria-label', show ? 'Скрыть пароль' : 'Показать пароль');
    });
  });
}

function showError(message, shakeEl) {
  const el = app.querySelector('[data-error]');
  if (el) el.textContent = message;
  const target = shakeEl || app.querySelector('.sys');
  if (message && target) {
    target.classList.remove('shake');
    void target.offsetWidth;
    target.classList.add('shake');
  }
}

function setBusy(button, busyText) {
  if (busyText) {
    button.dataset.label = button.textContent;
    button.disabled = true;
    button.innerHTML = '<span class="spin"></span>';
    button.append(busyText);
  } else {
    button.disabled = false;
    button.textContent = button.dataset.label;
  }
}

/* ---------- Первый запуск ---------- */

function showSetup() {
  const root = mount('tpl-setup');
  const form = root.querySelector('form');
  root.querySelector('[data-action="restore"]').addEventListener('click', pickBackup);
  if (isIOS() && !isStandalone()) root.querySelector('[data-ios-hint]').hidden = false;
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = form.player.value.trim();
    const pw = form.pw.value;
    if (pw.length < CONFIG.minPasswordLength) return showError(`Пароль должен быть не короче ${CONFIG.minPasswordLength} символов.`);
    if (pw !== form.pw2.value) return showError('Пароли не совпадают.');
    if (!form.ack.checked) return showError('Подтвердите, что понимаете: пароль восстановить нельзя.');
    const btn = form.querySelector('[data-submit]');
    setBusy(btn, 'Инициализация…');
    try {
      await createVault(pw, name);
      showHome();
    } catch (err) {
      console.error(err);
      setBusy(btn, null);
      showError('Не удалось создать хранилище. Проверьте, что приватный режим выключен.');
    }
  });
}

/* ---------- Вход ---------- */

const LOCK_REASONS = {
  idle: 'Сеанс заблокирован: 5 минут без активности.',
  hidden: 'Сеанс заблокирован при сворачивании.',
  manual: 'Сеанс заблокирован.',
};

function showLogin(reason) {
  const root = mount('tpl-login');
  const form = root.querySelector('form');
  const reasonEl = root.querySelector('[data-reason]');
  if (reason && LOCK_REASONS[reason]) {
    reasonEl.textContent = LOCK_REASONS[reason];
    reasonEl.hidden = false;
  }
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = form.pw.value;
    if (!pw) return showError('Введите пароль.');
    const btn = form.querySelector('[data-submit]');
    setBusy(btn, 'Расшифровка…');
    try {
      await unlockVault(pw);
      showHome();
    } catch (err) {
      setBusy(btn, null);
      if (err && err.name === 'OperationError') {
        form.pw.value = '';
        showError('Неверный пароль.');
        form.pw.focus();
      } else {
        console.error(err);
        showError('Хранилище повреждено или в неизвестном формате.');
      }
    }
  });
  root.querySelector('[data-action="forgot"]').addEventListener('click', showWipe);
  root.querySelector('[data-action="restore"]').addEventListener('click', pickBackup);
}

/* ---------- Сброс ---------- */

function showWipe() {
  const root = mount('tpl-wipe');
  const form = root.querySelector('form');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (form.confirm.value.trim().toUpperCase() !== 'СТЕРЕТЬ') return showError('Введите слово «СТЕРЕТЬ».');
    Vault.wipe();
    showSetup();
  });
  root.querySelector('[data-action="back"]').addEventListener('click', () => showLogin());
}

/* ---------- Мелкие помощники интерфейса ---------- */

const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ESC[c]);
const fmt = (n) => n.toLocaleString('ru-RU');

/** Отложенное сохранение поля ввода; flushInputs() дописывает его перед блокировкой. */
let pendingCommit = null;

function commitLater(fn) {
  if (pendingCommit) clearTimeout(pendingCommit.timer);
  pendingCommit = { fn, timer: setTimeout(flushInputs, 500) };
}

function flushInputs() {
  if (!pendingCommit) return;
  const { fn, timer } = pendingCommit;
  clearTimeout(timer);
  pendingCommit = null;
  fn();
}

/** Кнопка опасного действия: первое нажатие спрашивает, второе выполняет. */
function confirmPress(btn, question, action) {
  if (btn.dataset.armed) return action();
  const label = btn.textContent;
  btn.dataset.armed = '1';
  btn.classList.add('armed');
  btn.textContent = question;
  setTimeout(() => {
    if (!btn.isConnected) return;
    delete btn.dataset.armed;
    btn.classList.remove('armed');
    btn.textContent = label;
  }, 3000);
}

/* ---------- Всплывающие уведомления ---------- */

function toast({ title, main, sub, kind, action, ms = 4000 }) {
  let box = document.getElementById('toasts');
  if (!box) {
    box = document.createElement('div');
    box.id = 'toasts';
    box.className = 'toasts';
    document.body.append(box);
  }
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.setAttribute('role', 'status');
  el.innerHTML = '<div class="t-body"><div class="t-title"></div><div class="t-main"></div><div class="t-sub"></div></div>';
  el.querySelector('.t-title').textContent = title;
  el.querySelector('.t-main').textContent = main;
  if (sub) el.querySelector('.t-sub').textContent = sub;
  else el.querySelector('.t-sub').remove();

  const dismiss = () => {
    if (!el.isConnected || el.classList.contains('out')) return;
    el.classList.add('out');
    setTimeout(() => el.remove(), 250);
  };
  if (action) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = action.label;
    btn.addEventListener('click', () => { action.run(); dismiss(); });
    el.append(btn);
  }
  box.append(el);
  while (box.children.length > 3) box.firstElementChild.remove();
  setTimeout(dismiss, ms);
}

function clearToasts() {
  const box = document.getElementById('toasts');
  if (box) box.replaceChildren();
}

/* ---------- Окно поверх экрана ---------- */

let sheet = null;

function openSheet(title, body) {
  closeSheet();
  sheet = document.createElement('div');
  sheet.className = 'layer';
  sheet.innerHTML = `<section class="sys" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="scan"></div>
      <header class="sys-head"><div class="sys-icon">!</div><h2 class="sys-title">${esc(title)}</h2></header>
      ${body}
    </section>`;
  sheet.addEventListener('click', (e) => {
    if (e.target === sheet || e.target.closest('[data-action="close"]')) closeSheet();
  });
  document.body.append(sheet);
  document.documentElement.classList.add('noscroll');
  return sheet.querySelector('.sys');
}

function closeSheet() {
  if (!sheet) return;
  sheet.remove();
  sheet = null;
  document.documentElement.classList.remove('noscroll');
}

addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeSheet();
});

function sheetError(root, message) {
  root.querySelector('[data-error]').textContent = message;
  root.classList.remove('shake');
  void root.offsetWidth;
  root.classList.add('shake');
}

   ОТКЛИК: звук, вибрация, частицы, окна «Система»
   ===================================================================== */

const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

/* ---------- Звук: синтез через Web Audio, без файлов ---------- */

const Sound = {
  ctx: null,
  master: null,

  /** Контекст создаётся и «будится» по нажатию — иначе iOS не даст играть звук. */
  context() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.55;
      this.master.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },

  tone(at, freq, dur, { type = 'sine', gain = 0.2, attack = 0.008, to = null } = {}) {
    const osc = this.ctx.createOscillator();
    const amp = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, at);
    if (to) osc.frequency.exponentialRampToValueAtTime(to, at + dur);
    amp.gain.setValueAtTime(0.0001, at);
    amp.gain.exponentialRampToValueAtTime(gain, at + attack);
    amp.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    osc.connect(amp).connect(this.master);
    osc.start(at);
    osc.stop(at + dur + 0.05);
  },

  /** delay — в секундах; отсчёт по часам аудио, поэтому звук сыграет и без нового нажатия. */
  play(name, delay = 0) {
    if (!session || !session.state.settings.sound) return;
    const ctx = this.context();
    if (!ctx) return;
    SOUNDS[name](ctx.currentTime + 0.02 + delay);
  },
};

const SOUNDS = {
  quest(t) {
    Sound.tone(t, 1318.5, 0.16, { gain: 0.16 });
    Sound.tone(t + 0.07, 1975.5, 0.32, { gain: 0.14 });
    Sound.tone(t, 659.25, 0.2, { type: 'triangle', gain: 0.06 });
  },
  undo(t) {
    Sound.tone(t, 740, 0.18, { gain: 0.1, to: 420 });
  },
  levelUp(t) {
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
      Sound.tone(t + i * 0.075, f, 0.42, { type: 'triangle', gain: 0.16 });
    });
    Sound.tone(t + 0.38, 2093, 0.9, { gain: 0.05, attack: 0.05 });
    Sound.tone(t + 0.38, 1046.5, 1.0, { gain: 0.07, attack: 0.05 });
  },
  /** Фанфара достижения; land — когда медаль приземляется. */
  achievement(t, land = 0.9) {
    Sound.tone(t, 320, 0.8, { gain: 0.05, attack: 0.5, to: 1300 });
    [783.99, 1046.5, 1318.5, 1568].forEach((f, i) => {
      Sound.tone(t + land + i * 0.085, f, 0.34, { type: 'triangle', gain: 0.15 });
    });
    [1046.5, 1318.5, 1568].forEach((f) => {
      Sound.tone(t + land + 0.36, f, 1.4, { type: 'triangle', gain: 0.06, attack: 0.03 });

/* ---------- Частицы: один холст поверх всего, работает только пока есть искры ---------- */

const FX = {
  canvas: null,
  ctx: null,
  parts: [],
  emitter: null,
  frame: 0,
  last: 0,

  ensure() {
    if (this.canvas) return;
    this.canvas = document.createElement('canvas');
    this.canvas.id = 'fx-canvas';
    document.body.append(this.canvas);
    this.ctx = this.canvas.getContext('2d');
    this.resize();
    addEventListener('resize', () => this.resize());
  },

  resize() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    this.dpr = dpr;
    this.canvas.width = innerWidth * dpr;
    this.canvas.height = innerHeight * dpr;
  },

  /** Взрыв искр из точки. */
  burst(x, y, { count = 24, color = '#66d0ff', speed = 260, life = 0.9, size = 2.4, gravity = 220, up = 0 } = {}) {
    if (reducedMotion.matches) return;
    this.ensure();
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = speed * (0.35 + Math.random() * 0.65);
      this.parts.push({
        x, y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v - up,
        g: gravity,
        life: life * (0.6 + Math.random() * 0.4),
        age: 0,
        size: size * (0.6 + Math.random() * 0.8),
        color,
      });
    }
    this.start();
  },

  /** Поток искр, поднимающихся снизу, — фон окна LEVEL UP. */
  rise(color, perSecond = 40) {
    if (reducedMotion.matches) return;
    this.ensure();
    this.emitter = (dt) => {
      const n = perSecond * dt + Math.random() * 0.5;
      for (let i = 0; i < n; i++) {
        this.parts.push({
          x: Math.random() * innerWidth,
          y: innerHeight + 10,
          vx: (Math.random() - 0.5) * 30,
          vy: -(90 + Math.random() * 180),
          g: 0,
          life: 2 + Math.random() * 1.8,
          age: 0,
          size: 0.8 + Math.random() * 1.6,
          color,
        });
      }
    };
    this.start();
  },

  start() {
    if (this.frame) return;
    this.last = performance.now();
    this.frame = requestAnimationFrame((t) => this.tick(t));
  },

  tick(now) {
    const dt = Math.min(0.05, (now - this.last) / 1000);
    this.last = now;
    if (this.emitter) this.emitter(dt);
    const { ctx, dpr } = this;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ctx.globalCompositeOperation = 'lighter';
    this.parts = this.parts.filter((p) => (p.age += dt) < p.life);
    for (const p of this.parts) {
      p.vy += p.g * dt;
      p.vx *= 0.985;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      const k = 1 - p.age / p.life;
      ctx.fillStyle = p.color;
      ctx.globalAlpha = k * 0.16;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 2.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = k;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (this.parts.length || this.emitter) {
      this.frame = requestAnimationFrame((t) => this.tick(t));
    } else {
      this.frame = 0;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
    }
  },

  stopRise() {
    this.emitter = null;
  },

  clear() {
    this.emitter = null;
    this.parts = [];
  },
};

let fxOverlay = null;
const fxQueue = [];

function closeFx() {
  fxQueue.length = 0;
  FX.clear();
  if (fxOverlay) fxOverlay.remove();
  fxOverlay = null;
}

/** Окна идут по очереди: следующее открывается, когда закрыли предыдущее. */
function queueFx(show) {
  if (!session) return;
  fxQueue.push(show);
  if (!fxOverlay) fxQueue.shift()();
}

function openFx(className, html, armAfterMs) {
  fxOverlay = document.createElement('div');
  fxOverlay.className = 'fx-overlay ' + className;
  fxOverlay.setAttribute('role', 'alertdialog');
  fxOverlay.innerHTML = html;
  document.body.append(fxOverlay);
  const btn = fxOverlay.querySelector('[data-action="accept"]');
  btn.disabled = true;
  setTimeout(() => { btn.disabled = false; }, reducedMotion.matches ? 0 : armAfterMs);
  btn.addEventListener('click', () => {
    const el = fxOverlay;
    fxOverlay = null;
    FX.stopRise();
    el.classList.add('out');
    setTimeout(() => el.remove(), 300);
    if (fxQueue.length) setTimeout(() => fxQueue.shift()(), 320);
  });
  return fxOverlay;
}

/** Счётчик опыта плавно докручивается до нового значения. */
function countTo(el, to) {
  const from = el.dataset.value === undefined ? to : Number(el.dataset.value);
  el.dataset.value = to;
  const token = (el._count = (el._count || 0) + 1);
  if (from === to || reducedMotion.matches) {
    el.textContent = fmt(to) + ' XP';
    return;
  }
  const t0 = performance.now();
  const step = (now) => {
    if (el._count !== token) return;
    const k = Math.min(1, (now - t0) / 800);
    el.textContent = fmt(Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)))) + ' XP';
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/** Полоса уровня в шапке; при повышении сначала доливается до конца. */
function setTopbarBar(level, pct) {
  const bar = app.querySelector('.topbar-xp > i');
  const prev = bar.dataset.level === undefined ? level : Number(bar.dataset.level);
  bar.dataset.level = level;
  clearTimeout(bar._reset);
  if (level > prev && !reducedMotion.matches) {
    bar.style.width = '100%';
    bar._reset = setTimeout(() => {
      bar.style.transition = 'none';
      bar.style.width = '0%';
      void bar.offsetWidth;
      bar.style.transition = '';
      bar.style.width = pct + '%';
    }, 900);
  } else {
    requestAnimationFrame(() => { bar.style.width = pct + '%'; });
  }
}
