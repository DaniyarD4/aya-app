<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">

<meta name="theme-color" content="#05070d">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Система">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2305070d'/%3E%3Crect x='10' y='10' width='44' height='44' rx='4' fill='none' stroke='%2366d0ff' stroke-width='4'/%3E%3Cpath d='M32 19v18' stroke='%2366d0ff' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='45' r='3.5' fill='%2366d0ff'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Система</title>
<style>
:root {
  --bg: #05070d;
  --bg-2: #0a1222;
  --panel: rgba(8, 18, 36, 0.86);
  --line: rgba(120, 205, 255, 0.75);
  --line-soft: rgba(120, 205, 255, 0.28);
  --glow: rgba(64, 170, 255, 0.55);
  --accent: #66d0ff;
  --accent-2: #a9e6ff;
  --text: #e6f4ff;
  --text-dim: #8fb0c8;
  --text-faint: #56738a;
  --danger: #ff5f7a;
  --danger-glow: rgba(255, 80, 110, 0.45);
  --warn: #ffc56b;
  --ok: #6dffc0;
  --font: -apple-system, "SF Pro Display", system-ui, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(40, 110, 220, 0.28), transparent 60%),
    radial-gradient(90% 60% at 50% 115%, rgba(30, 80, 190, 0.22), transparent 60%),
    var(--bg);
}

/* Тонкая голографическая сетка на фоне */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(100, 190, 255, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(100, 190, 255, 0.05) 1px, transparent 1px);
  background-size: 32px 32px;
  mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
}

button, input { font: inherit; color: inherit; }
button { touch-action: manipulation; }

#app {
  position: relative;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: calc(24px + var(--safe-t)) 16px calc(24px + var(--safe-b));
}

/* ---------- Окно «Система» ---------- */

.sys {
  position: relative;
  width: 100%;
  max-width: 440px;
  padding: 22px 20px 24px;
  background:
    linear-gradient(180deg, rgba(110, 200, 255, 0.07), transparent 40%),
    var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  box-shadow:
    0 0 0 1px rgba(120, 205, 255, 0.12),
    0 0 18px var(--glow),
    0 0 60px rgba(40, 130, 255, 0.18),
    inset 0 0 28px rgba(70, 170, 255, 0.14);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  animation: sys-open 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  transform-origin: center;
}

/* Уголки-скобки */
.sys::before, .sys::after {
  content: "";
  position: absolute;
  width: 18px;
  height: 18px;
  border: 2px solid var(--accent-2);
  filter: drop-shadow(0 0 6px var(--accent));
  pointer-events: none;
}
.sys::before { top: -3px; left: -3px; border-right: 0; border-bottom: 0; }
.sys::after { bottom: -3px; right: -3px; border-left: 0; border-top: 0; }

/* Бегущая полоса сканирования */
.sys > .scan {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: inherit;
  pointer-events: none;
}
.sys > .scan::after {
  content: "";
  position: absolute;
  left: 0; right: 0;
  height: 40%;
  top: -40%;
  background: linear-gradient(180deg, transparent, rgba(120, 210, 255, 0.07), transparent);
  animation: scan 5s linear infinite;
}

.sys > *:not(.scan) { animation: sys-content 0.4s 0.35s ease-out both; }

.sys-head {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding-bottom: 14px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line-soft);
}
.sys-icon {
  flex: none;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border: 1.5px solid var(--accent-2);
  border-radius: 4px;
  font-weight: 800;
  color: var(--accent-2);
  text-shadow: 0 0 8px var(--accent);
  box-shadow: 0 0 10px var(--glow), inset 0 0 8px rgba(100, 200, 255, 0.25);
}
.sys-title {
  margin: 0;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--accent-2);
  text-shadow: 0 0 10px var(--accent);
}

.sys p { margin: 0 0 12px; line-height: 1.5; color: var(--text); }
.sys .lead { font-size: 17px; text-align: center; }
.sys .dim { color: var(--text-dim); font-size: 14px; }
.sys .hl { color: var(--accent-2); text-shadow: 0 0 8px rgba(102, 208, 255, 0.6); font-weight: 600; }
.center { text-align: center; }

/* ---------- Поля ---------- */

.field { display: block; margin: 16px 0 0; }
.field > span {
  display: block;
  margin-bottom: 6px;
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-dim);
}
.input-wrap { position: relative; }
.field input {
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  font-size: 17px; /* ≥16px: iOS не зумит при фокусе */
  background: rgba(4, 10, 22, 0.75);
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.field input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), 0 0 14px var(--glow);
}
.input-wrap input { padding-right: 56px; }
.reveal {
  position: absolute;
  top: 0; right: 0;
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  background: none;
  border: 0;
  color: var(--text-dim);
  cursor: pointer;
}
.reveal svg { width: 22px; height: 22px; }
.reveal[aria-pressed="true"] { color: var(--accent); }

.hint { margin-top: 6px; font-size: 13px; color: var(--text-faint); }

.warn {
  margin: 20px 0 0;
  padding: 14px;
  border: 1px solid rgba(255, 95, 122, 0.55);
  border-radius: 4px;
  background: rgba(255, 60, 90, 0.08);
  box-shadow: inset 0 0 18px rgba(255, 60, 90, 0.08);
}
.warn b {
  display: block;
  margin-bottom: 4px;
  color: var(--danger);
  letter-spacing: 0.12em;
  font-size: 13px;
  text-transform: uppercase;
}
.warn p { margin: 0; font-size: 14px; color: #ffd6dd; }

.check {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  margin-top: 14px;
  min-height: 44px;
  cursor: pointer;
  font-size: 15px;
  line-height: 1.4;
}
.check input {
  flex: none;
  appearance: none;
  -webkit-appearance: none;
  width: 26px;
  height: 26px;
  margin: 0;
  border: 1.5px solid var(--line);
  border-radius: 4px;
  background: rgba(4, 10, 22, 0.75);
  display: grid;
  place-items: center;
  cursor: pointer;
}
.check input::after {
  content: "";
  width: 12px;
  height: 7px;
  border-left: 2.5px solid var(--bg);
  border-bottom: 2.5px solid var(--bg);
  transform: translateY(-2px) rotate(-45deg) scale(0);
  transition: transform 0.15s;
}
.check input:checked { background: var(--accent); box-shadow: 0 0 12px var(--glow); }
.check input:checked::after { transform: translateY(-2px) rotate(-45deg) scale(1); }

/* ---------- Кнопки ---------- */

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  min-height: 54px;
  margin-top: 22px;
  padding: 12px 18px;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--accent-2);
  background: linear-gradient(180deg, rgba(80, 180, 255, 0.18), rgba(40, 120, 220, 0.1));
  border: 1px solid var(--accent);
  border-radius: 4px;
  box-shadow: 0 0 14px var(--glow), inset 0 0 14px rgba(100, 200, 255, 0.18);
  text-shadow: 0 0 8px var(--accent);
  cursor: pointer;
  transition: transform 0.12s, box-shadow 0.2s, opacity 0.2s;
}
.btn:active { transform: scale(0.98); box-shadow: 0 0 24px var(--glow), inset 0 0 20px rgba(100, 200, 255, 0.3); }
.btn:disabled { opacity: 0.45; cursor: default; transform: none; }
.btn.danger {
  color: #ffd6dd;
  border-color: var(--danger);
  background: rgba(255, 60, 90, 0.12);
  box-shadow: 0 0 14px var(--danger-glow), inset 0 0 14px rgba(255, 80, 110, 0.15);
  text-shadow: 0 0 8px var(--danger);
}
.btn.ghost {
  min-height: 48px;
  margin-top: 12px;
  font-size: 14px;
  letter-spacing: 0.08em;
  text-transform: none;
  font-weight: 500;
  color: var(--text-dim);
  background: none;
  border-color: transparent;
  box-shadow: none;
  text-shadow: none;
}
.btn .spin {
  width: 16px;
  height: 16px;
  border: 2px solid currentColor;
  border-right-color: transparent;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

.error {
  min-height: 1.4em;
  margin: 12px 0 0;
  font-size: 14px;
  color: var(--danger);
  text-align: center;
  text-shadow: 0 0 8px var(--danger-glow);
}
.shake { animation: shake 0.4s; }

/* ---------- Статус (временный главный экран этапа 1) ---------- */

.stat-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid rgba(120, 205, 255, 0.12);
  font-size: 15px;
}
.stat-row:last-of-type { border-bottom: 0; }
.stat-row > span:first-child { color: var(--text-dim); }
.stat-row > span:last-child { text-align: right; }
.mono { font-family: var(--mono); font-size: 13px; }
.ok { color: var(--ok); text-shadow: 0 0 8px rgba(109, 255, 192, 0.5); }

.footer-note {
  margin: 22px 0 0;
  font-size: 12px;
  color: var(--text-faint);
  text-align: center;
  letter-spacing: 0.06em;
}

/* ---------- Оболочка приложения ---------- */

#app.shell { justify-content: flex-start; padding: 0; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: calc(10px + var(--safe-t)) 16px 10px;
  background: linear-gradient(180deg, rgba(5, 7, 13, 0.97), rgba(5, 7, 13, 0.85));
  border-bottom: 1px solid var(--line-soft);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
.topbar .who { flex: 1; min-width: 0; }
.topbar .who small {
  display: block;
  font-size: 11px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--accent);
  text-shadow: 0 0 8px var(--glow);
}
.topbar .who b {
  display: block;
  font-size: 17px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.xp-total {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 700;
  color: var(--accent-2);
  text-shadow: 0 0 8px var(--glow);
  white-space: nowrap;
}
.icon-btn {
  flex: none;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  background: none;
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  color: var(--accent-2);
  cursor: pointer;
}
.icon-btn svg { width: 20px; height: 20px; }

.view {
  width: 100%;
  max-width: 560px;
  padding: 8px 16px calc(100px + var(--safe-b));
}

.section-h {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 24px 0 10px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--accent);
  text-shadow: 0 0 8px var(--glow);
}
.section-h::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--line-soft), transparent);
}
.section-h .count { color: var(--text-faint); letter-spacing: 0.08em; text-shadow: none; }

.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  display: flex;
  justify-content: center;
  padding: 4px 8px calc(4px + var(--safe-b));
  background: rgba(5, 7, 13, 0.95);
  border-top: 1px solid var(--line-soft);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
.tabbar button {
  flex: 1;
  max-width: 170px;
  min-height: 56px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  background: none;
  border: 0;
  color: var(--text-faint);
  font-size: 11px;
  letter-spacing: 0.06em;
  cursor: pointer;
}
.tabbar svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--accent-2); text-shadow: 0 0 8px var(--glow); }
.tabbar button[aria-current="page"] svg { filter: drop-shadow(0 0 6px var(--accent)); }

/* Панель — рамка окна Системы без анимации открытия */
.panel {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--line-soft);
  border-radius: 6px;
  box-shadow: 0 0 12px rgba(40, 140, 255, 0.12), inset 0 0 20px rgba(70, 170, 255, 0.06);
}
.panel.pad { padding: 4px 16px 16px; }

.empty { padding: 26px 18px; text-align: center; color: var(--text-dim); line-height: 1.5; }
.empty b { display: block; margin-bottom: 4px; color: var(--accent-2); letter-spacing: 0.1em; }

/* ---------- Квесты ---------- */

.btn.add { margin-top: 16px; }

.quest {
  display: flex;
  align-items: flex-start;
  gap: 4px;
  margin-bottom: 10px;
  padding: 8px 12px 10px 4px;
  transition: border-color 0.25s, opacity 0.3s;
}
.qcheck {
  flex: none;
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  padding: 0;
  background: none;
  border: 0;
  cursor: pointer;
}
.qbox {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border: 1.5px solid var(--line);
  border-radius: 4px;
  background: rgba(4, 10, 22, 0.75);
  box-shadow: inset 0 0 8px rgba(100, 200, 255, 0.15);
  transition: background 0.2s, box-shadow 0.2s;
}
.qbox::after {
  content: "";
  width: 13px;
  height: 7px;
  border-left: 2.5px solid var(--bg);
  border-bottom: 2.5px solid var(--bg);
  transform: translateY(-2px) rotate(-45deg) scale(0);
  transition: transform 0.18s cubic-bezier(0.3, 1.6, 0.5, 1);
}
.quest.done .qbox { background: var(--accent); box-shadow: 0 0 14px var(--glow); }
.quest.done .qbox::after { transform: translateY(-2px) rotate(-45deg) scale(1); }
.qbody {
  flex: 1;
  min-width: 0;
  padding: 12px 0 2px;
  background: none;
  border: 0;
  text-align: left;
  cursor: pointer;
}
.qtitle { display: block; font-size: 16px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.quest.done .qtitle { color: var(--text-dim); text-decoration: line-through; text-decoration-color: rgba(120, 205, 255, 0.55); }
.qnote {
  display: block;
  margin-top: 3px;
  font-size: 13px;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.qxp {
  flex: none;
  padding-top: 15px;
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 700;
  color: var(--accent-2);
  text-shadow: 0 0 8px var(--glow);
}
.quest.done .qxp { color: var(--text-faint); text-shadow: none; }
.quest.flash { animation: quest-flash 0.7s ease-out; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip {
  padding: 3px 8px;
  font-size: 12px;
  line-height: 1.3;
  color: var(--text-dim);
  border: 1px solid var(--line-soft);
  border-radius: 3px;
  background: rgba(80, 170, 255, 0.06);
}
.t-chore { --tc: #9fb6c8; }
.t-normal { --tc: #66d0ff; }
.t-goal { --tc: #b99bff; }
.t-epic { --tc: #ffc56b; }
.chip[class*="t-"] { color: var(--tc); border-color: var(--tc); background: none; }

.more {
  display: block;
  width: 100%;
  min-height: 44px;
  background: none;
  border: 0;
  color: var(--text-dim);
  font-size: 14px;
  cursor: pointer;
}

/* ---------- Характеристики ---------- */

.stat {
  display: block;
  width: 100%;
  margin-bottom: 10px;
  padding: 14px 16px;
  text-align: left;
  cursor: pointer;
}
.stat-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.stat-name { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
.stat-lv {
  flex: none;
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 700;
  color: var(--accent-2);
  text-shadow: 0 0 8px var(--glow);
}
.bar {
  position: relative;
  display: block;
  height: 8px;
  margin-top: 10px;
  overflow: hidden;
  border: 1px solid rgba(120, 205, 255, 0.2);
  border-radius: 4px;
  background: rgba(100, 190, 255, 0.08);
}
.bar > i {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0;
  border-radius: inherit;
  background: linear-gradient(90deg, #2f7fff, var(--accent-2));
  box-shadow: 0 0 10px var(--accent);
  transition: width 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.stat-xp {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 6px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-faint);
}

/* ---------- Статус ---------- */

.r-E { --rc: #9fb6c8; }
.r-D { --rc: #6dffc0; }
.r-C { --rc: #66d0ff; }
.r-B { --rc: #b99bff; }
.r-A { --rc: #ff8a5c; }
.r-S { --rc: #ffd36b; }
b[class^="r-"] { color: var(--rc); text-shadow: 0 0 8px var(--rc); }

.status {
  margin-top: 16px;
  padding: 0 16px 16px;
  border-color: var(--line);
  box-shadow:
    0 0 18px var(--glow),
    0 0 50px rgba(40, 130, 255, 0.16),
    inset 0 0 28px rgba(70, 170, 255, 0.12);
}
.status::before, .status::after {
  content: "";
  position: absolute;
  width: 16px;
  height: 16px;
  border: 2px solid var(--accent-2);
  filter: drop-shadow(0 0 6px var(--accent));
}
.status::before { top: -3px; left: -3px; border-right: 0; border-bottom: 0; }
.status::after { bottom: -3px; right: -3px; border-left: 0; border-top: 0; }
.status-head {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 0 12px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--line-soft);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--accent-2);
  text-shadow: 0 0 10px var(--accent);
}
.status-head .sys-icon { width: 26px; height: 26px; }

.status-main { display: flex; align-items: center; gap: 14px; }
.rank-badge {
  flex: none;
  width: 76px;
  height: 76px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--rc);
  border-radius: 6px;
  background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--rc) 22%, transparent), transparent 70%);
  box-shadow: 0 0 16px color-mix(in srgb, var(--rc) 55%, transparent), inset 0 0 16px color-mix(in srgb, var(--rc) 25%, transparent);
}
.rank-badge small { font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--rc); opacity: 0.85; }
.rank-badge b { font-size: 40px; line-height: 1; font-weight: 900; color: var(--rc); text-shadow: 0 0 14px var(--rc); }
.r-S .rank-badge { animation: rank-pulse 2.4s ease-in-out infinite; }

.status-who { flex: 1; min-width: 0; }
.status-name { font-size: 21px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.status-title { margin-top: 4px; font-size: 13px; color: var(--rc); letter-spacing: 0.04em; }
.status-level { flex: none; text-align: center; }
.status-level small { display: block; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-dim); }
.status-level b {
  display: block;
  font-family: var(--mono);
  font-size: 40px;
  line-height: 1;
  font-weight: 800;
  color: var(--accent-2);
  text-shadow: 0 0 14px var(--accent);
}
.bar.big { height: 12px; margin-top: 18px; border-radius: 6px; }
.status-next { margin: 12px 0 0; font-size: 14px; color: var(--text-dim); text-align: center; }

.counters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.counters > div {
  padding: 10px 8px;
  text-align: center;
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  background: rgba(4, 10, 22, 0.5);
}
.counters b { display: block; font-family: var(--mono); font-size: 18px; color: var(--accent-2); }
.counters small { display: block; margin-top: 2px; font-size: 11px; color: var(--text-faint); letter-spacing: 0.04em; }

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat-grid .stat { margin: 0; padding: 12px; }
.stat-grid .stat-name { font-size: 14px; line-height: 1.25; }
.stat-grid .stat-lv { font-size: 18px; }
.stat-lv small { margin-right: 3px; font-size: 11px; font-weight: 400; color: var(--text-dim); text-shadow: none; }
.stat-grid + .btn { margin-top: 16px; }
@media (max-width: 340px) { .stat-grid { grid-template-columns: 1fr; } }

/* ---------- Журнал и статистика ---------- */

.counters.four { grid-template-columns: 1fr 1fr; }
.counters .streak b { color: #ffc56b; text-shadow: 0 0 10px rgba(255, 197, 107, 0.6); }
.counters .streak.cold b { color: var(--text-dim); text-shadow: none; }
.streak-hint { margin: 10px 0 0; font-size: 13px; text-align: center; color: var(--text-dim); }
.streak-hint.warn { color: var(--warn); }

.chart { padding: 14px 16px 12px; margin-top: 12px; }
.chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.chart-head b { font-size: 14px; font-weight: 600; }
.chart-head span { font-family: var(--mono); font-size: 13px; color: var(--text-dim); }
.bars {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  align-items: end;
  height: 150px;
  margin-top: 10px;
  border-bottom: 1px solid rgba(120, 205, 255, 0.18);
}
.bar-col {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding: 0;
  background: none;
  border: 0;
  cursor: pointer;
}
.bar-val {
  min-height: 18px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text);
  visibility: hidden;
}
.bar-col.lbl .bar-val, .bar-col.sel .bar-val { visibility: visible; }
.bar-track { position: relative; width: 22px; height: calc(100% - 22px); display: flex; align-items: flex-end; }
.bar-track > i {
  display: block;
  width: 100%;
  height: 0;
  border-radius: 4px 4px 0 0;
  background: var(--accent);
  box-shadow: 0 0 10px rgba(102, 208, 255, 0.45);
  transition: height 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.bar-col.sel .bar-track > i { background: var(--accent-2); }
.bar-days { display: grid; grid-template-columns: repeat(7, 1fr); margin-top: 6px; }
.bar-days span { font-size: 11px; text-align: center; color: var(--text-faint); }
.bar-days span.today { color: var(--text); font-weight: 600; }

.day-h {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  margin: 22px 0 8px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}
.day-h span { font-family: var(--mono); font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--text-dim); }
.log-list { padding: 2px 14px; }
.log-row {
  display: grid;
  grid-template-columns: 44px 1fr auto;
  gap: 4px 10px;
  align-items: baseline;
  padding: 11px 0;
  border-bottom: 1px solid rgba(120, 205, 255, 0.1);
}
.log-row:last-child { border-bottom: 0; }
.log-time { font-family: var(--mono); font-size: 12px; color: var(--text-faint); }
.log-title { font-size: 15px; overflow-wrap: anywhere; }
.log-xp { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--accent-2); }
.log-sub { grid-column: 2 / 4; font-size: 12px; color: var(--text-faint); }
.log-sub .chip { margin-right: 6px; padding: 1px 6px; font-size: 11px; }

/* ---------- Бэкап ---------- */

.backup-banner {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 16px;
  padding: 12px 12px 12px 16px;
  border-color: rgba(255, 197, 107, 0.55);
  box-shadow: 0 0 14px rgba(255, 197, 107, 0.18), inset 0 0 16px rgba(255, 197, 107, 0.06);
}
.backup-banner p { flex: 1; margin: 0; font-size: 14px; line-height: 1.4; color: #ffe2b0; }
.backup-banner p b { display: block; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--warn); }
.backup-banner .btn { width: auto; min-height: 44px; margin: 0; padding: 8px 14px; font-size: 13px; letter-spacing: 0.08em; }
.warn-text { color: var(--warn); }
.ios-hint { color: var(--text-dim); margin-top: 14px !important; padding: 12px; border: 1px dashed var(--line-soft); border-radius: 4px; font-size: 13px !important; }

/* ---------- Настройки ---------- */

.set-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid rgba(120, 205, 255, 0.12);
}
.set-row b { display: block; font-size: 15px; color: var(--tc, var(--text)); }
.set-row small { display: block; margin-top: 2px; font-size: 12px; color: var(--text-faint); }
.xp-input { flex: none; display: flex; align-items: center; gap: 8px; color: var(--text-dim); font-size: 13px; }
.xp-input input {
  width: 92px;
  min-height: 44px;
  padding: 8px 10px;
  font-family: var(--mono);
  font-size: 17px;
  text-align: right;
  background: rgba(4, 10, 22, 0.75);
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  outline: none;
}
.xp-input input:disabled { opacity: 0.5; }
.xp-input input:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 12px var(--glow); }

/* ---------- Окна поверх экрана ---------- */

.layer {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  padding: calc(16px + var(--safe-t)) 12px calc(12px + var(--safe-b));
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  background: rgba(2, 4, 10, 0.82);
  animation: fade 0.2s both;
}
.layer > .sys {
  margin-top: auto;
  align-self: center;
  max-width: 480px;
  background: linear-gradient(180deg, rgba(110, 200, 255, 0.07), transparent 40%), #07101f;
}
@media (min-width: 600px) { .layer > .sys { margin-bottom: auto; } }
html.noscroll, html.noscroll body { overflow: hidden; }

.field textarea {
  width: 100%;
  min-height: 72px;
  padding: 12px 14px;
  font-size: 17px;
  line-height: 1.4;
  resize: vertical;
  background: rgba(4, 10, 22, 0.75);
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  outline: none;
}
.field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 14px var(--glow); }

.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choices.types { display: grid; grid-template-columns: 1fr 1fr; }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice > span {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 46px;
  height: 100%;
  padding: 8px 14px;
  font-size: 15px;
  color: var(--text);
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  background: rgba(4, 10, 22, 0.75);
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s, color 0.15s;
}
.choice b { font-weight: 600; color: var(--tc, inherit); }
.choice small { font-family: var(--mono); font-size: 12px; color: var(--text-faint); }
.choice input:checked + span {
  color: var(--accent-2);
  border-color: var(--tc, var(--accent));
  box-shadow: 0 0 12px var(--glow), inset 0 0 10px rgba(100, 200, 255, 0.18);
}
.choice input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn.ghost.danger-text { color: var(--danger); }
.btn.armed { color: #fff; border-color: var(--danger); background: rgba(255, 60, 90, 0.2); text-shadow: 0 0 8px var(--danger); }

/* ---------- Уведомления ---------- */

.toasts {
  position: fixed;
  z-index: 60;
  top: calc(74px + var(--safe-t));
  left: 0;
  right: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 0 16px;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  width: 100%;
  max-width: 420px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 12px 12px 16px;
  background: #081325;
  border: 1px solid var(--line);
  border-radius: 6px;
  box-shadow: 0 0 18px var(--glow), inset 0 0 16px rgba(70, 170, 255, 0.15);
  animation: toast-in 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
.toast.out { animation: toast-out 0.25s ease-in both; }
.toast .t-body { flex: 1; min-width: 0; }
.toast .t-title { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); }
.toast .t-main { font-size: 18px; font-weight: 800; color: var(--accent-2); text-shadow: 0 0 10px var(--accent); }
.toast .t-sub { margin-top: 2px; font-size: 13px; color: var(--text-dim); }
.toast button {
  flex: none;
  min-height: 44px;
  padding: 0 14px;
  font-size: 14px;
  color: var(--accent-2);
  background: none;
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  cursor: pointer;
}
.toast.up { border-color: var(--warn); box-shadow: 0 0 18px rgba(255, 197, 107, 0.45), inset 0 0 16px rgba(255, 197, 107, 0.12); }
.toast.up .t-title { color: var(--warn); }
.toast.up .t-main { color: #ffe2b0; text-shadow: 0 0 10px var(--warn); }
.toast.minus { border-color: rgba(255, 95, 122, 0.6); box-shadow: 0 0 14px var(--danger-glow); }
.toast.minus .t-title { color: var(--danger); }
.toast.minus .t-main { color: #ffd6dd; text-shadow: none; }

/* ---------- Отклик: полоса опыта в шапке, всплывающий опыт ---------- */

.topbar-xp {
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 2px;
  background: rgba(100, 190, 255, 0.1);
}
.topbar-xp > i {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0;
  background: linear-gradient(90deg, #2f7fff, var(--accent-2));
  box-shadow: 0 0 8px var(--accent), 0 0 2px var(--accent-2);
  transition: width 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.float-xp {
  position: fixed;
  z-index: 95;
  pointer-events: none;
  transform: translate(-50%, -50%);
  font-family: var(--mono);
  font-size: 20px;
  font-weight: 800;
  white-space: nowrap;
  color: var(--accent-2);
  text-shadow: 0 0 10px var(--accent), 0 0 22px var(--accent);
  animation: float-xp 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
.quest.flash .qbox { animation: check-pop 0.45s cubic-bezier(0.3, 1.6, 0.5, 1); }

#fx-canvas {
  position: fixed;
  inset: 0;
  z-index: 90;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* ---------- Полноэкранные окна «Система» ---------- */

.fx-overlay {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b));
  overflow: hidden;
  background: radial-gradient(70% 55% at 50% 50%, color-mix(in srgb, var(--fxc) 22%, transparent), transparent 70%), rgba(2, 4, 10, 0.9);
  animation: fade 0.3s both;
  --fxc: var(--accent);
}
.fx-overlay.rank { --fxc: var(--rc); }
.fx-overlay.out { animation: fade-out 0.3s both; }
.fx-overlay .fx-win {
  max-width: 400px;
  text-align: center;
  border-color: var(--fxc);
  box-shadow: 0 0 24px color-mix(in srgb, var(--fxc) 60%, transparent), 0 0 80px color-mix(in srgb, var(--fxc) 25%, transparent), inset 0 0 30px color-mix(in srgb, var(--fxc) 18%, transparent);
}
.fx-overlay.rank .fx-win { animation-delay: 0.55s; }
.fx-overlay.rank .fx-win > *:not(.scan) { animation-delay: 0.9s; }
.fx-overlay.rank.shake-hard .fx-win { animation: sys-open 0.55s 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both, hard-shake 0.5s 1.25s; }

.fx-beam {
  position: absolute;
  left: 50%;
  top: -10%;
  bottom: -10%;
  width: 180px;
  margin-left: -90px;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--fxc) 35%, transparent), transparent);
  filter: blur(6px);
  transform-origin: 50% 100%;
  animation: beam 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) both, beam-breathe 3s 1.2s ease-in-out infinite;
  pointer-events: none;
}
.fx-big {
  margin: 4px 0 6px;
  font-size: 44px;
  font-weight: 900;
  font-style: italic;
  line-height: 1.05;
  letter-spacing: 0.08em;
  color: #fff;
  text-shadow: 0 0 10px var(--fxc), 0 0 28px var(--fxc), 0 0 54px var(--fxc);
}
.fx-overlay .sys > .fx-big { animation: big-in 0.7s 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both, glow-pulse 2s 1.1s ease-in-out infinite; }
.fx-level {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 14px;
  margin: 6px 0 4px;
  font-family: var(--mono);
}
.fx-level .from { font-size: 26px; color: var(--text-faint); }
.fx-level .arrow { font-size: 22px; color: var(--accent); }
.fx-level .to {
  font-size: 54px;
  font-weight: 800;
  color: var(--accent-2);
  text-shadow: 0 0 16px var(--accent);
  animation: num-pop 0.6s 0.85s cubic-bezier(0.3, 1.6, 0.5, 1) both;
}
.fx-sub { margin: 10px 0 0 !important; color: var(--text-dim) !important; font-size: 15px; }
.fx-list {
  margin: 14px 0 0;
  padding: 10px 12px;
  list-style: none;
  font-size: 14px;
  line-height: 1.7;
  color: #ffe2b0;
  border: 1px solid rgba(255, 197, 107, 0.35);
  border-radius: 4px;
  background: rgba(255, 197, 107, 0.06);
}
.fx-list li::before { content: "▲ "; color: var(--warn); }
.fx-overlay .btn[disabled] { opacity: 0.35; }

.fx-flash {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 50%, #fff, color-mix(in srgb, var(--fxc) 70%, #fff) 40%, transparent 75%);
  animation: flash 0.9s ease-out both;
  pointer-events: none;
}
.fx-ring {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 160px;
  height: 160px;
  margin: -80px 0 0 -80px;
  border: 3px solid var(--fxc);
  border-radius: 50%;
  box-shadow: 0 0 30px var(--fxc), inset 0 0 30px var(--fxc);
  animation: ring 1.3s 0.1s cubic-bezier(0.1, 0.7, 0.3, 1) both;
  pointer-events: none;
}
.fx-ring.d2 { animation-delay: 0.35s; border-width: 2px; }
.fx-rank {
  position: relative;
  height: 120px;
  margin: 4px 0;
  display: grid;
  place-items: center;
}
.fx-rank > * {
  grid-area: 1 / 1;
  font-size: 104px;
  font-weight: 900;
  line-height: 1;
}
.fx-rank .old { color: var(--text-faint); animation: rank-old 0.8s 0.9s ease-in both; }
.fx-rank .new {
  color: var(--rc);
  text-shadow: 0 0 18px var(--rc), 0 0 44px var(--rc), 0 0 90px var(--rc);
  animation: rank-new 0.75s 1.45s cubic-bezier(0.2, 1.4, 0.4, 1) both, rank-glow 2.4s 2.2s ease-in-out infinite;
}
.fx-big.small { font-size: 30px; letter-spacing: 0.2em; }
.fx-overlay.rank .sys > .fx-big { animation-delay: 1.7s, 2.4s; }
.fx-title { margin: 8px 0 0 !important; font-size: 18px; font-weight: 700; color: var(--rc) !important; text-shadow: 0 0 10px var(--rc); }

/* ---------- Достижение за целевой и эпический квест ---------- */

.fx-overlay.ach { --fxc: #b99bff; flex-direction: column; }
.fx-overlay.ach.epic { --fxc: #ffc56b; }
.ach-rays {
  position: absolute;
  left: 50%;
  top: 34%;
  width: 1000px;
  height: 1000px;
  margin: -500px 0 0 -500px;
  pointer-events: none;
  animation: rays-in 0.9s 0.75s ease-out both;
}
.ach-rays > i {
  position: absolute;
  inset: 0;
  background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--fxc) 30%, transparent) 0deg 7deg, transparent 7deg 18deg);
  mask-image: radial-gradient(circle, #000 0, rgba(0, 0, 0, 0.6) 22%, transparent 55%);
  -webkit-mask-image: radial-gradient(circle, #000 0, rgba(0, 0, 0, 0.6) 22%, transparent 55%);
  animation: rays-spin 18s linear infinite;
}
.ach-stage { position: relative; z-index: 1; width: 100%; max-width: 400px; }
.ach-medal {
  position: relative;
  z-index: 2;
  width: 136px;
  height: 136px;
  margin: 0 auto -26px;
  perspective: 700px;
}
.ach-medal svg {
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 0 14px var(--fxc)) drop-shadow(0 0 34px color-mix(in srgb, var(--fxc) 60%, transparent));
  animation: medal-drop 1s 0.15s cubic-bezier(0.25, 1.25, 0.45, 1) both, medal-glow 2.4s 1.3s ease-in-out infinite;
}
.ach-medal .fx-ring { animation-delay: 0.95s; }
.ach-medal .fx-ring.d2 { animation-delay: 1.15s; }
.fx-overlay.ach .fx-flash { animation-delay: 0.9s; }
.fx-overlay.ach .ach-win { padding-top: 40px; animation-delay: 0.55s; }
.fx-overlay.ach .ach-win > *:not(.scan) { animation-delay: 1s; }
.fx-overlay.ach.epic.shake-hard .ach-stage { animation: hard-shake 0.5s 1s; }
.ach-label {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--fxc);
  text-shadow: 0 0 12px var(--fxc);
}
.ach-title {
  margin: 10px 0 0;
  font-size: 24px;
  font-weight: 800;
  line-height: 1.25;
  color: #fff;
  overflow-wrap: anywhere;
  text-shadow: 0 0 14px color-mix(in srgb, var(--fxc) 70%, transparent);
}
.fx-overlay .sys > .ach-xp {
  margin-top: 10px;
  font-family: var(--mono);
  font-size: 30px;
  font-weight: 800;
  color: var(--accent-2);
  text-shadow: 0 0 14px var(--accent);
  animation: num-pop 0.6s 1.3s cubic-bezier(0.3, 1.6, 0.5, 1) both;
}
.ach-num { margin: 12px 0 0 !important; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-faint) !important; }

/* ---------- Главные цели ---------- */

.goal {
  display: block;
  width: 100%;
  margin-bottom: 12px;
  padding: 16px;
  text-align: left;
  cursor: pointer;
  border-color: color-mix(in srgb, var(--gc) 45%, transparent);
  box-shadow: 0 0 16px color-mix(in srgb, var(--gc) 16%, transparent), inset 0 0 24px color-mix(in srgb, var(--gc) 7%, transparent);
}
.goal-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.goal-name { font-size: 17px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.goal-pct {
  flex: none;
  font-family: var(--mono);
  font-size: 26px;
  font-weight: 800;
  color: var(--gc);
  text-shadow: 0 0 12px var(--gc);
}
.goal-bar {
  position: relative;
  display: block;
  height: 16px;
  margin-top: 12px;
  overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--gc) 30%, transparent);
  border-radius: 8px;
  background: rgba(100, 190, 255, 0.07);
}
.goal-bar > i {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0;
  overflow: hidden;
  border-radius: inherit;
  background: linear-gradient(90deg, color-mix(in srgb, var(--gc) 45%, #0b1830), var(--gc));
  box-shadow: 0 0 14px var(--gc);
  transition: width 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.goal-bar > i::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: -40%;
  width: 40%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
  animation: goal-shine 3.2s 1.4s ease-in-out infinite;
}
.goal-bar > b { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--bg); z-index: 1; }
.goal-bar > b.q { width: 1px; background: color-mix(in srgb, var(--gc) 25%, transparent); }
.goal-sub { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: 13px; color: var(--text-dim); }
.goal-sub span:last-child { font-family: var(--mono); color: var(--text-faint); text-align: right; }
.goal.done .goal-name::after { content: " ✓"; color: var(--gc); }
.goal-empty { color: var(--warn); }
.chip.goal-chip { color: var(--gc); border-color: color-mix(in srgb, var(--gc) 60%, transparent); background: none; }
.link-list {
  max-height: 300px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 2px 12px 10px;
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  background: rgba(4, 10, 22, 0.5);
}
.link-list .check { margin-top: 10px; font-size: 14px; }
.link-list .check input { width: 26px; height: 26px; min-height: 0; padding: 0; }
.link-list small { display: block; font-size: 12px; color: var(--text-faint); }
.btn.gold {
  color: #ffe2b0;
  border-color: var(--warn);
  background: rgba(255, 197, 107, 0.12);
  box-shadow: 0 0 14px rgba(255, 197, 107, 0.35), inset 0 0 14px rgba(255, 197, 107, 0.12);
  text-shadow: 0 0 8px var(--warn);
}

/* ---------- Колесо баланса ---------- */

.radar { padding: 14px 10px 14px; }
.radar .chart-head { padding: 0 6px; }
.radar svg { display: block; width: 100%; max-width: 480px; height: auto; margin: 4px auto 0; }
.radar .grid polygon { fill: none; stroke: rgba(120, 205, 255, 0.14); stroke-width: 1; }
.radar .grid polygon.outer { stroke: rgba(120, 205, 255, 0.28); }
.radar .grid line { stroke: rgba(120, 205, 255, 0.14); stroke-width: 1; }
.radar .shape-g {
  transform-box: view-box;
  transform-origin: 50% 50%;
  animation: radar-grow 1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
.radar .shape {
  fill: rgba(102, 208, 255, 0.16);
  stroke: var(--accent);
  stroke-width: 2;
  stroke-linejoin: round;
  filter: drop-shadow(0 0 8px rgba(102, 208, 255, 0.6));
}
.radar .pt { fill: var(--accent-2); stroke: var(--bg); stroke-width: 2; }
.radar .pt.weak { fill: var(--warn); }
.radar .hit { fill: transparent; cursor: pointer; }
.radar text { fill: var(--text-dim); font-family: var(--font); font-size: 16px; }
.radar text.weak { fill: var(--warn); }
.radar text.sel { fill: var(--text); font-weight: 700; }
.radar-caption { min-height: 20px; margin: 6px 6px 0; font-size: 13px; line-height: 1.45; text-align: center; color: var(--text-dim); }
.radar-caption b { color: var(--text); font-weight: 600; }

/* ---------- Состояние ---------- */

/* Сфера состояния */
.orb-panel { margin-top: 16px; padding: 14px 12px 16px; overflow: hidden; border-color: color-mix(in srgb, var(--c2) 45%, transparent); box-shadow: 0 0 22px color-mix(in srgb, var(--c2) 22%, transparent), inset 0 0 30px color-mix(in srgb, var(--c2) 8%, transparent); }
.orb-head { display: flex; justify-content: space-between; align-items: baseline; }
.orb-head small { font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--text-dim); }
.orb-wrap { --orb: 132px; position: relative; display: grid; grid-template-columns: minmax(0, 1fr) var(--orb) minmax(0, 1fr); column-gap: 16px; min-height: 236px; margin-top: 4px; }
@media (min-width: 420px) { .orb-wrap { --orb: 150px; column-gap: 24px; } }
@media (max-width: 359px) { .orb-wrap { --orb: 104px; column-gap: 12px; min-height: 210px; } .orb-panel { padding-left: 10px; padding-right: 10px; } .orb-txt b { font-size: 26px; } }
.orb-lines { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.orb-lines polyline { fill: none; stroke: var(--ok); stroke-width: 1; opacity: 0.7; stroke-dasharray: 400; stroke-dashoffset: 400; animation: orb-draw 0.9s ease-out forwards; }
.orb-lines circle { fill: var(--ok); }
.orb-lines .k-drain { stroke: var(--danger); } .orb-lines circle.k-drain { fill: var(--danger); }
.orb-lines .k-miss { stroke: var(--warn); } .orb-lines circle.k-miss { fill: var(--warn); }
.orb-lines .k-empty, .orb-lines .k-calm { stroke: var(--text-faint); } .orb-lines circle.k-empty, .orb-lines circle.k-calm { fill: var(--text-faint); }
.orb-side { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 10px; padding: 22px 0 6px; min-width: 0; }
.orb-side.l { text-align: right; }
.orb-cap { position: absolute; top: 2px; left: 0; right: 0; font-size: 9.5px; letter-spacing: 0.12em; white-space: nowrap; text-transform: uppercase; color: var(--text-faint); }
.orb-lbl { animation: orb-fade 0.5s ease-out both; }
.orb-lbl { hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word; }
.orb-lbl b { display: block; font-size: 12.5px; line-height: 1.25; font-weight: 600; color: var(--ok); }
.orb-lbl small { display: block; margin-top: 2px; font-size: 11px; line-height: 1.3; color: var(--text-dim); }
.orb-lbl.k-drain b { color: var(--danger); }
.orb-lbl.k-miss b { color: var(--warn); }
.orb-lbl.k-empty b, .orb-lbl.k-calm b { color: var(--text-dim); }
.orb-core { position: relative; align-self: center; width: var(--orb); height: var(--orb); animation: orb-breathe calc(var(--spin) * 0.5) ease-in-out infinite; }
.orb-halo { position: absolute; inset: -38%; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--c2) 60%, transparent) 0%, transparent 62%); opacity: var(--glow); filter: blur(8px); pointer-events: none; }
.orb-ring { position: absolute; inset: -9px; border-radius: 50%; border: 1px dashed color-mix(in srgb, var(--c1) 55%, transparent); animation: orb-spin 40s linear infinite; }
.orb-ring.r2 { inset: -17px; border: 1px solid color-mix(in srgb, var(--c2) 35%, transparent); border-left-color: transparent; border-right-color: transparent; animation-duration: 26s; animation-direction: reverse; }
.orb { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; isolation: isolate; background: radial-gradient(circle at 35% 30%, var(--c1) 0%, var(--c2) 45%, var(--c3) 80%, #070a16 100%); box-shadow: 0 0 34px -4px var(--c2), inset -14px -20px 40px rgba(0, 0, 0, 0.5), inset 6px 8px 24px rgba(255, 255, 255, 0.16); }
.orb::before { content: ''; position: absolute; inset: -35%; z-index: 0; background: conic-gradient(from 0deg, var(--c1), var(--c3), var(--c2), var(--c1), var(--c3), var(--c1)); filter: blur(16px); opacity: 0.7; mix-blend-mode: screen; animation: orb-spin var(--spin) linear infinite; }
.orb .blob { position: absolute; z-index: 1; width: 62%; height: 62%; border-radius: 50%; filter: blur(14px); mix-blend-mode: screen; opacity: 0.75; }
.orb .b1 { top: 4%; left: 8%; background: var(--c1); animation: orb-drift1 calc(var(--spin) * 0.9) ease-in-out infinite alternate; }
.orb .b2 { right: 4%; bottom: 0; background: var(--c3); animation: orb-drift2 calc(var(--spin) * 1.1) ease-in-out infinite alternate; }
.orb .b3 { top: 32%; left: 38%; width: 30%; height: 30%; background: #fff; opacity: 0.22; animation: orb-drift1 calc(var(--spin) * 0.7) ease-in-out infinite alternate-reverse; }
.orb::after { content: ''; position: absolute; inset: 0; z-index: 2; border-radius: 50%; background: radial-gradient(circle at 30% 24%, rgba(255, 255, 255, 0.85) 0, rgba(255, 255, 255, 0.22) 11%, transparent 28%), radial-gradient(circle at 70% 86%, rgba(0, 0, 0, 0.45), transparent 58%); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16), inset 0 0 22px rgba(255, 255, 255, 0.1); }
.orb-txt { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-align: center; text-shadow: 0 1px 10px rgba(0, 0, 0, 0.6); }
.orb-txt b { font-family: var(--mono); font-size: 32px; font-weight: 800; line-height: 1; }
.orb-txt small { margin-top: 5px; font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; }
.orb-txt em { margin-top: 4px; font-size: 12px; font-style: normal; opacity: 0.9; }
.orb-core.surge::after { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--c1); box-shadow: 0 0 18px var(--c1); animation: orb-wave 1.2s ease-out forwards; pointer-events: none; }
.bubble-gl, .bubble-drops { position: absolute; inset: -45%; width: 190%; height: 190%; }
.bubble-gl { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.bubble-drops { pointer-events: none; }
.orb-core.gl .orb { background: none; box-shadow: none; overflow: visible; pointer-events: none; }
.orb-core.gl .orb::before, .orb-core.gl .orb::after, .orb-core.gl .blob { display: none; }
.orb-core.gl .orb-ring { opacity: 0.55; }
.orb-panel .goal-sub { margin-top: 12px; }
.orb-panel .hint { margin: 8px 0 0; }
@keyframes orb-spin { to { transform: rotate(360deg); } }
@keyframes orb-drift1 { from { transform: translate(0, 0) scale(1); } to { transform: translate(35%, 45%) scale(1.25); } }
@keyframes orb-drift2 { from { transform: translate(0, 0) scale(1.1); } to { transform: translate(-45%, -35%) scale(0.85); } }
@keyframes orb-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
@keyframes orb-draw { to { stroke-dashoffset: 0; } }
@keyframes orb-fade { from { opacity: 0; transform: translateY(4px); } }
@keyframes orb-wave { from { transform: scale(1); opacity: 0.9; } to { transform: scale(1.9); opacity: 0; } }
.state-card { margin-top: 16px; padding: 16px; --sc: var(--accent); }
.state-card.low { --sc: var(--danger); }
.state-card.mid { --sc: var(--warn); }
.state-card.good { --sc: var(--accent); }
.state-card.full { --sc: var(--ok); }
.state-card { border-color: color-mix(in srgb, var(--sc) 50%, transparent); box-shadow: 0 0 18px color-mix(in srgb, var(--sc) 20%, transparent), inset 0 0 24px color-mix(in srgb, var(--sc) 8%, transparent); }
.state-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.state-top small { display: block; font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--text-dim); }
.state-top b { display: block; margin-top: 2px; font-size: 20px; color: var(--sc); text-shadow: 0 0 10px var(--sc); }
.state-pct { font-family: var(--mono); font-size: 44px; font-weight: 800; line-height: 1; color: var(--sc); text-shadow: 0 0 16px var(--sc); }
.state-card .goal-bar { --gc: var(--sc); height: 18px; }
.state-card .goal-sub { margin-top: 10px; }

.energy-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 4px; }
.energy-row button {
  min-height: 52px;
  font-family: var(--mono);
  font-size: 20px;
  font-weight: 700;
  color: var(--text-dim);
  background: rgba(4, 10, 22, 0.75);
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s, color 0.15s;
}
.energy-row button[aria-pressed="true"] { color: var(--accent-2); border-color: var(--accent); box-shadow: 0 0 12px var(--glow), inset 0 0 10px rgba(100, 200, 255, 0.18); }
.energy-scale { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: var(--text-faint); }

.drain {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  margin-bottom: 8px;
  padding: 10px 14px;
  font-size: 15px;
  text-align: left;
  cursor: pointer;
}
.drain span:last-child { flex: none; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-faint); }
.drain[aria-pressed="true"] { border-color: rgba(255, 95, 122, 0.7); background: rgba(255, 60, 90, 0.1); box-shadow: 0 0 12px var(--danger-glow); }
.drain[aria-pressed="true"] span:last-child { color: var(--danger); }

.insight { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid rgba(120, 205, 255, 0.1); }
.insight:last-child { border-bottom: 0; }
.insight b { font-weight: 600; }
.insight .diff { font-family: var(--mono); font-weight: 700; color: var(--ok); }
.insight .diff.neg { color: var(--danger); }
.insight small { grid-column: 1 / 3; font-size: 12px; color: var(--text-faint); }

.state-banner { border-color: rgba(255, 95, 122, 0.6); box-shadow: 0 0 14px var(--danger-glow), inset 0 0 16px rgba(255, 60, 90, 0.06); }
.state-banner p { color: #ffd6dd; }
.state-banner p b { color: var(--danger); }
.row-fields { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
.row-fields input { flex: 1; min-height: 48px; padding: 10px 12px; font-size: 16px; background: rgba(4, 10, 22, 0.75); border: 1px solid var(--line-soft); border-radius: 4px; outline: none; }
.row-fields input:focus { border-color: var(--accent); }
.row-fields button { flex: none; width: 48px; height: 48px; font-size: 22px; color: var(--danger); background: none; border: 1px solid var(--line-soft); border-radius: 4px; cursor: pointer; }

/* ---------- Финансы ---------- */

.fin-input { display: flex; gap: 8px; margin-top: 16px; padding: 8px; }

  flex: 1;
  min-width: 0;
  min-height: 52px;
  padding: 10px 14px;
  font-size: 17px;
  background: rgba(4, 10, 22, 0.75);
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  outline: none;
}
.fin-input input:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 14px var(--glow); }
.fin-input .btn { width: 56px; min-height: 52px; margin: 0; padding: 0; font-size: 26px; letter-spacing: 0; }
.fin-limits { margin-top: 12px; padding: 16px; }
.fin-left small { display: block; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-dim); }
.fin-left b { display: block; margin-top: 4px; font-family: var(--mono); font-size: 34px; line-height: 1.1; color: var(--fc, var(--accent-2)); text-shadow: 0 0 14px var(--fc, var(--accent)); }
.fin-left span { display: block; margin-top: 4px; font-size: 13px; color: var(--text-dim); }
.fin-row-limit { margin-top: 14px; --fc: var(--accent); }
.fin-row-limit.near { --fc: var(--warn); }
.fin-row-limit.over { --fc: var(--danger); }
.fin-row-limit .fin-head { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--text-dim); }
.fin-row-limit .fin-head span:last-child { font-family: var(--mono); color: var(--text); }
.fin-bar { position: relative; display: block; height: 10px; margin-top: 6px; overflow: hidden; border-radius: 5px; background: rgba(100, 190, 255, 0.08); border: 1px solid rgba(120, 205, 255, 0.18); }
.fin-bar > i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit; background: var(--fc); box-shadow: 0 0 10px var(--fc); transition: width 1s cubic-bezier(0.2, 0.8, 0.2, 1); }
.fin-streak { margin-top: 14px; font-size: 13px; color: var(--text-dim); text-align: center; }

.exp-row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 2px 12px;
  align-items: center;
  width: 100%;
  padding: 12px 0;
  text-align: left;
  background: none;
  border: 0;
  border-bottom: 1px solid rgba(120, 205, 255, 0.1);
  cursor: pointer;
}
.exp-row:last-child { border-bottom: 0; }
.exp-row .ic { grid-row: 1 / 3; font-size: 20px; }
.exp-row .t { font-size: 15px; overflow-wrap: anywhere; }
.exp-row .a { font-family: var(--mono); font-weight: 700; }
.exp-row .m { grid-column: 2 / 4; font-size: 12px; color: var(--text-faint); }
.fin-sum { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 13px; color: var(--text-dim); }
.fin-sum b { font-family: var(--mono); color: var(--text); }
.cat-row { margin-top: 12px; }
.cat-row .fin-head { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.cat-row .fin-head span:last-child { font-family: var(--mono); color: var(--text-dim); }

.q-options { display: grid; gap: 8px; margin-top: 16px; }
.q-options.cats { grid-template-columns: 1fr 1fr; }
.q-options .btn { margin: 0; min-height: 50px; font-size: 14px; letter-spacing: 0.04em; text-transform: none; }

/* ---------- Дофаминовое меню, вечер, магазин ---------- */

.fab {
  position: fixed;
  right: 16px;

  align-items: center;

  padding: 0 18px 0 14px;

}

.view { padding-bottom: calc(160px + var(--safe-b)); }

  margin-top: 16px;
  padding: 12px 12px 12px 16px;

}
.active-item > div { flex: 1; min-width: 0; }
.active-item small { display: block; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--warn); }
.active-item b { display: block; font-size: 16px; overflow-wrap: anywhere; }
.active-item span { display: block; font-family: var(--mono); font-size: 13px; color: var(--text-dim); }

.slot {
  margin: 8px 0 4px;
  padding: 22px 12px;
  text-align: center;
  font-size: 24px;
  font-weight: 800;
  line-height: 1.25;
  border: 1px solid var(--line);

}

.breath { display: grid; place-items: center; height: 230px; margin: 4px 0; }

  transition-timing-function: ease-in-out;
}

.evening-card { margin-top: 16px; padding: 16px; border-color: rgba(185, 155, 255, 0.6); box-shadow: 0 0 16px rgba(185, 155, 255, 0.25), inset 0 0 20px rgba(185, 155, 255, 0.07); }
.evening-card small { display: block; font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: #b99bff; }
.evening-card b { display: block; margin-top: 2px; font-size: 20px; }
.evening-card p { margin: 6px 0 0; font-size: 13px; color: var(--text-dim); }
.evening-card .fin-bar { --fc: #b99bff; margin-top: 12px; }
.evening-card .btn-pair .btn { margin-top: 14px; }

.menu-row .t small { display: block; margin-top: 2px; font-size: 12px; color: var(--text-faint); }
.menu-row .a { font-size: 13px; color: var(--warn); }
.gold-line { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; font-size: 15px; border-bottom: 1px solid rgba(120, 205, 255, 0.1); }
.gold-line b { font-family: var(--mono); color: var(--warn); }
.shop-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(120, 205, 255, 0.1); }
.shop-row:last-child { border-bottom: 0; }
.shop-row b { font-size: 15px; }
.shop-row small { grid-column: 1; font-size: 12px; color: var(--text-faint); }
.shop-row .btn { grid-row: 1 / 3; grid-column: 2; width: auto; margin: 0; min-height: 44px; padding: 8px 14px; font-size: 13px; letter-spacing: 0.06em; }
.worry { padding: 12px 0; border-bottom: 1px solid rgba(120, 205, 255, 0.1); }
.worry:last-child { border-bottom: 0; }
.worry p { margin: 0 0 4px !important; white-space: pre-wrap; overflow-wrap: anywhere; }
.worry small { display: block; font-size: 12px; color: var(--text-faint); }
.worry .btn-pair { grid-template-columns: 1fr 1fr 1fr; }
.worry .btn-pair .btn { margin-top: 8px; min-height: 42px; font-size: 12px; letter-spacing: 0.02em; text-transform: none; }

/* ---------- Сверка баланса и продукты ---------- */

.bal-card.stale { border-color: rgba(255, 197, 107, 0.55); }
.leak { display: block; width: 100%; text-align: left; padding: 12px 0; border: 0; border-bottom: 1px solid rgba(120, 205, 255, 0.1); background: none; color: var(--text); font: inherit; cursor: pointer; }
.leak:last-of-type { border-bottom: 0; }
.leak .fin-head b { color: var(--warn); font-family: var(--mono); font-weight: 600; }
.leak small { display: block; margin-top: 4px; color: var(--text-dim); font-size: 13px; line-height: 1.4; }
.leak .guess { color: var(--accent-2); }
.facts { margin: 12px 0 4px; padding: 0 0 0 18px; color: var(--text-dim); font-size: 14px; line-height: 1.5; }
.facts li + li { margin-top: 4px; }
.why-chips button.guess { border-color: var(--accent); color: var(--accent-2); }
.why-chips button.guess::after { content: ' · похоже'; color: var(--text-faint); font-size: 12px; }
.swap { display: block; width: 100%; margin-top: 10px; padding: 14px; text-align: left; border: 1px solid rgba(120, 205, 255, 0.25); border-radius: 12px; background: rgba(10, 20, 36, 0.6); color: var(--text); font: inherit; cursor: pointer; }
.swap b { display: block; color: var(--accent-2); }
.swap small { display: block; margin-top: 4px; color: var(--text-dim); font-size: 13px; line-height: 1.4; }
.xp-card { padding: 4px 0 14px; margin-bottom: 4px; border-bottom: 1px solid rgba(120, 205, 255, 0.1); }
.xp-card .fin-head span:first-child { color: var(--accent-2); }
.xp-card small { display: block; margin-top: 6px; color: var(--text-dim); font-size: 13px; }
.xp-card.over .fin-bar { --fc: var(--danger); }
.xp-card .link { margin-top: 6px; padding: 0; border: 0; background: none; color: var(--text-faint); font: inherit; font-size: 13px; text-decoration: underline; cursor: pointer; }
.rec-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.rec-chips button {
  min-height: 42px;
  padding: 8px 12px;
  font-size: 14px;
  color: var(--text);
  background: rgba(4, 10, 22, 0.75);
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  cursor: pointer;
}
.rec-chips button[aria-pressed="true"] { color: var(--accent-2); border-color: var(--accent); box-shadow: 0 0 10px var(--glow); }
.rec-chips small { color: var(--text-faint); font-family: var(--mono); }
.rec-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.rec-row span { flex: 1; min-width: 0; font-size: 15px; overflow-wrap: anywhere; }
.rec-row input { width: 120px; min-height: 46px; padding: 8px 10px; font-family: var(--mono); font-size: 16px; text-align: right; background: rgba(4, 10, 22, 0.75); border: 1px solid var(--line-soft); border-radius: 4px; outline: none; }
.rec-left { margin: 14px 0 0 !important; text-align: center; font-size: 14px; color: var(--text-dim) !important; }
.rec-left b { font-family: var(--mono); color: var(--warn); }
.basket-row { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(120, 205, 255, 0.1); cursor: pointer; }
.basket-row:last-child { border-bottom: 0; }
.basket-row input { width: 24px; height: 24px; margin: 0; accent-color: var(--accent); }
.basket-row b { font-size: 15px; font-weight: 600; }
.basket-row.got b { color: var(--text-faint); text-decoration: line-through; }
.basket-row .a { font-family: var(--mono); font-size: 14px; }
.basket-row small { grid-column: 2 / 4; font-size: 12px; color: var(--text-faint); }
.cover { margin-top: 12px; }
.cover .fin-head { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-dim); }
.cover .fin-bar { --fc: var(--ok); }
.cover.short .fin-bar { --fc: var(--warn); }
.price-row { display: grid; grid-template-columns: auto 1fr 110px; gap: 8px; align-items: center; padding: 6px 0; }
.price-row input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); }
.price-row span { font-size: 14px; }
.price-row span small { display: block; font-size: 11px; color: var(--text-faint); }
.price-row input[type="number"] { min-height: 42px; padding: 6px 8px; font-family: var(--mono); font-size: 15px; text-align: right; background: rgba(4, 10, 22, 0.75); border: 1px solid var(--line-soft); border-radius: 4px; outline: none; }

/* ---------- Переключатели ---------- */

.toggle {
  flex: none;
  appearance: none;
  -webkit-appearance: none;
  position: relative;
  width: 54px;
  height: 32px;
  margin: 0;
  border: 1px solid var(--line-soft);
  border-radius: 16px;
  background: rgba(4, 10, 22, 0.75);
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
}
.toggle::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--text-dim);
  transition: transform 0.2s cubic-bezier(0.3, 1.4, 0.5, 1), background 0.2s;
}
.toggle:checked { background: rgba(80, 180, 255, 0.25); border-color: var(--accent); box-shadow: 0 0 12px var(--glow); }
.toggle:checked::after { transform: translateX(22px); background: var(--accent-2); box-shadow: 0 0 10px var(--accent); }
.btn-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn-pair .btn { margin-top: 16px; font-size: 13px; letter-spacing: 0.1em; min-height: 48px; padding: 8px; }

/* ---------- Анимации ---------- */

@keyframes sys-open {
  0%   { opacity: 0; transform: scaleX(0.02) scaleY(0.006); }
  45%  { opacity: 1; transform: scaleX(1) scaleY(0.006); }
  100% { opacity: 1; transform: scale(1); }
}
@keyframes sys-content { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes scan { to { top: 100%; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fade { from { opacity: 0; } }
@keyframes fade-out { to { opacity: 0; } }
@keyframes float-xp {
  0% { opacity: 0; transform: translate(-50%, -30%) scale(0.6); }
  20% { opacity: 1; transform: translate(-50%, -80%) scale(1.15); }
  100% { opacity: 0; transform: translate(-50%, -260%) scale(1); }
}
@keyframes check-pop { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
@keyframes beam { from { transform: scaleY(0); opacity: 0; } 40% { opacity: 1; } to { transform: scaleY(1); opacity: 0.7; } }
@keyframes beam-breathe { 50% { opacity: 0.35; } }
@keyframes big-in {
  from { opacity: 0; transform: scale(1.8); letter-spacing: 0.5em; filter: blur(8px); }
  to { opacity: 1; transform: none; letter-spacing: 0.08em; filter: none; }
}
@keyframes glow-pulse { 50% { text-shadow: 0 0 14px var(--fxc), 0 0 40px var(--fxc), 0 0 80px var(--fxc); } }
@keyframes num-pop { from { opacity: 0; transform: scale(0.3); } }
@keyframes flash { 0% { opacity: 0; } 12% { opacity: 1; } 100% { opacity: 0; } }
@keyframes ring { from { transform: scale(0); opacity: 1; } to { transform: scale(6); opacity: 0; } }
@keyframes rank-old {
  0% { transform: none; opacity: 1; }
  30% { transform: translateX(-4px) rotate(-3deg); }
  50% { transform: translateX(4px) rotate(3deg); opacity: 1; filter: none; }
  100% { transform: scale(1.8); opacity: 0; filter: blur(12px); }
}
@keyframes rank-new {
  from { opacity: 0; transform: scale(3.2); filter: blur(10px); }
  to { opacity: 1; transform: none; filter: none; }
}
@keyframes radar-grow { from { transform: scale(0); opacity: 0; } }
@keyframes goal-shine { 0% { transform: translateX(0); } 55%, 100% { transform: translateX(360%); } }
@keyframes rays-in { from { opacity: 0; transform: scale(0.3); } }
@keyframes rays-spin { to { transform: rotate(360deg); } }
@keyframes medal-drop {
  0% { opacity: 0; transform: translateY(-160px) scale(0.2) rotateY(720deg); }
  60% { opacity: 1; }
  100% { opacity: 1; transform: none; }
}
@keyframes medal-glow {
  50% { filter: drop-shadow(0 0 22px var(--fxc)) drop-shadow(0 0 60px color-mix(in srgb, var(--fxc) 75%, transparent)); }
}
@keyframes rank-glow { 50% { text-shadow: 0 0 24px var(--rc), 0 0 60px var(--rc), 0 0 120px var(--rc); } }
@keyframes hard-shake {
  10%, 50% { transform: translate(-6px, 3px); }
  30%, 70% { transform: translate(6px, -3px); }
  90% { transform: translate(-2px, 1px); }
}
@keyframes rank-pulse {
  50% { box-shadow: 0 0 30px color-mix(in srgb, var(--rc) 80%, transparent), inset 0 0 22px color-mix(in srgb, var(--rc) 40%, transparent); }
}
@keyframes toast-in { from { opacity: 0; transform: translateY(-14px) scaleY(0.6); } }
@keyframes toast-out { to { opacity: 0; transform: translateY(-10px); } }
@keyframes quest-flash {
  0%   { box-shadow: 0 0 0 rgba(102, 208, 255, 0); }
  30%  { box-shadow: 0 0 28px rgba(102, 208, 255, 0.85), inset 0 0 24px rgba(102, 208, 255, 0.35); border-color: var(--accent-2); }
  100% { box-shadow: 0 0 12px rgba(40, 140, 255, 0.12); }
}
@keyframes shake {
  20% { transform: translateX(-8px); }
  40% { transform: translateX(7px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(3px); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>

<!-- ===== Экраны (клонируются в #app) ===== -->

<template id="tpl-unsupported">
  <section class="sys">
    <div class="scan"></div>
    <header class="sys-head"><div class="sys-icon">!</div><h1 class="sys-title">Ошибка</h1></header>
    <p class="lead">Шифрование недоступно в этом браузере.</p>
    <p class="dim center">Откройте приложение по адресу <span class="hl">https://</span> или через <span class="hl">localhost</span> в Safari или Chrome — без этого Web Crypto API отключён.</p>
  </section>
</template>

<template id="tpl-setup">
  <section class="sys">
    <div class="scan"></div>
    <header class="sys-head"><div class="sys-icon">!</div><h1 class="sys-title">Уведомление</h1></header>
    <p class="lead">Вы выполнили скрытые условия,<br>чтобы стать <span class="hl">Игроком</span>.</p>
    <p class="dim center">Задайте мастер-пароль. Он шифрует все данные на этом устройстве и нигде не сохраняется.</p>
    <form data-form="setup" novalidate>
      <label class="field"><span>Имя игрока</span>
        <input name="player" type="text" autocomplete="nickname" autocapitalize="words" maxlength="40" placeholder="Игрок">
      </label>
      <!-- Скрытый логин нужен, чтобы Связка ключей iOS могла предложить сохранить пароль -->
      <input type="text" name="username" autocomplete="username" value="Система" hidden>
      <label class="field"><span>Мастер-пароль</span>
        <span class="input-wrap"><input name="pw" type="password" autocomplete="new-password" minlength="8" required><button type="button" class="reveal" aria-label="Показать пароль" aria-pressed="false"></button></span>
      </label>
      <div class="hint">Минимум 8 символов. Лучше — фраза из нескольких слов.</div>
      <label class="field"><span>Повторите пароль</span>
        <span class="input-wrap"><input name="pw2" type="password" autocomplete="new-password" required><button type="button" class="reveal" aria-label="Показать пароль" aria-pressed="false"></button></span>
      </label>
      <div class="warn" role="note">
        <b>Внимание</b>
        <p>Забытый пароль восстановить невозможно. Копии нет ни у кого — без пароля данные останутся зашифрованными навсегда.</p>
      </div>
      <label class="check"><input name="ack" type="checkbox"><span>Я понимаю, что восстановить пароль нельзя</span></label>
      <p class="error" data-error></p>
      <button class="btn" type="submit" data-submit>Принять</button>
    </form>
    <button class="btn ghost" type="button" data-action="restore">Восстановить из бэкапа</button>
    <p class="dim center ios-hint" data-ios-hint hidden>На iPhone сначала добавьте приложение на экран «Домой» (Поделиться → На экран «Домой») и задайте пароль уже там: у иконки своё хранилище, отдельное от Safari.</p>
  </section>
</template>

<template id="tpl-login">
  <section class="sys">
    <div class="scan"></div>
    <header class="sys-head"><div class="sys-icon">!</div><h1 class="sys-title">Система</h1></header>
    <p class="lead">Подтвердите личность <span class="hl">Игрока</span>.</p>
    <p class="dim center" data-reason hidden></p>
    <form data-form="login" novalidate>
      <input type="text" name="username" autocomplete="username" value="Система" hidden>
      <label class="field"><span>Мастер-пароль</span>
        <span class="input-wrap"><input name="pw" type="password" autocomplete="current-password" required><button type="button" class="reveal" aria-label="Показать пароль" aria-pressed="false"></button></span>
      </label>
      <p class="error" data-error></p>
      <button class="btn" type="submit" data-submit>Войти</button>
    </form>
    <button class="btn ghost" type="button" data-action="restore">Восстановить из бэкапа</button>
    <button class="btn ghost" type="button" data-action="forgot">Забыли пароль?</button>
  </section>
</template>

<template id="tpl-wipe">
  <section class="sys">
    <div class="scan"></div>
    <header class="sys-head"><div class="sys-icon">!</div><h1 class="sys-title">Предупреждение</h1></header>
    <p class="lead">Пароль восстановить нельзя.</p>
    <p class="dim center">Можно только стереть все данные на этом устройстве и начать заново. Если есть файл бэкапа, его можно будет импортировать — но тоже только с паролем, которым он зашифрован.</p>
    <form data-form="wipe" novalidate>
      <label class="field"><span>Введите «СТЕРЕТЬ» для подтверждения</span>
        <input name="confirm" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false">
      </label>
      <p class="error" data-error></p>
      <button class="btn danger" type="submit" data-submit>Стереть всё</button>
    </form>
    <button class="btn ghost" type="button" data-action="back">Назад</button>
  </section>
</template>

<template id="tpl-import">
  <section class="sys">
    <div class="scan"></div>
    <header class="sys-head"><div class="sys-icon">!</div><h1 class="sys-title">Восстановление</h1></header>
    <p class="lead">Найден бэкап Системы.</p>
    <p class="dim center" data-bind="exported"></p>
    <form data-form="import" novalidate>
      <input type="text" name="username" autocomplete="username" value="Система" hidden>
      <label class="field"><span>Пароль бэкапа</span>
        <span class="input-wrap"><input name="pw" type="password" autocomplete="current-password" required><button type="button" class="reveal" aria-label="Показать пароль" aria-pressed="false"></button></span>
      </label>
      <div class="warn" role="note" data-replace hidden>
        <b>Замена данных</b>
        <p>Данные на этом устройстве заменятся данными из бэкапа. Мастер-паролем станет пароль бэкапа.</p>
      </div>
      <p class="error" data-error></p>
      <button class="btn" type="submit" data-submit>Восстановить</button>
    </form>
    <button class="btn ghost" type="button" data-action="back">Отмена</button>
  </section>
</template>

<template id="tpl-shell">
  <header class="topbar">
    <div class="who"><small data-bind="rankline"></small><b data-bind="name"></b></div>
    <div class="xp-total" data-bind="xp"></div>
    <button class="icon-btn" type="button" data-action="open-settings" aria-label="Настройки">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <button class="icon-btn" type="button" data-action="lock" aria-label="Заблокировать">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </button>
    <span class="topbar-xp" aria-hidden="true"><i></i></span>
  </header>
  <div class="view" data-view></div>
  <nav class="tabbar" aria-label="Разделы">
    <button type="button" data-tab="status">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8.5 5v10L12 22l-8.5-5V7z"/><path d="M12 7l4 2.5v5L12 17l-4-2.5v-5z"/></svg>
      <span>Статус</span>
    </button>
    <button type="button" data-tab="quests">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12l3 3 5-6"/></svg>
      <span>Квесты</span>
    </button>
    <button type="button" data-tab="state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6 5 12 2.5-6h4"/></svg>
      <span>Состояние</span>
    </button>
    <button type="button" data-tab="finance">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M16 14.5h2"/></svg>
      <span>Финансы</span>
    </button>
    <button type="button" data-tab="journal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 16v-4"/><path d="M12 16V8"/><path d="M16 16v-6"/></svg>
      <span>Журнал</span>
    </button>
  </nav>
  <button class="fab" type="button" data-action="need" aria-label="Мне нужно…">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>
    <span>Мне нужно</span>
  </button>
</template>

<script>
'use strict';

/* =====================================================================
   НАСТРОЙКИ
   ===================================================================== */

const CONFIG = {
  storageKey: 'system.vault.v1',
  kdfIterations: 310000,        // PBKDF2-SHA-256, ТЗ требует ≥ 200 000
  minPasswordLength: 8,
  autoLockMs: 5 * 60 * 1000,    // 5 минут бездействия
};

/* =====================================================================
   КРИПТОГРАФИЯ (Web Crypto API)
   Ключ AES-GCM-256 выводится из пароля через PBKDF2 со случайной солью.
   На каждое сохранение — новый случайный IV. Пароль нигде не хранится;
   в памяти живёт только неизвлекаемый CryptoKey, пока сессия открыта.
   ===================================================================== */

const AAD = new TextEncoder().encode('system-vault-v1');

const b64 = {
  encode(bytes) {
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  },
  decode(str) {
    const s = atob(str);
    const out = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  },
};

async function deriveKey(password, salt, iterations) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', hash: 'SHA-256', salt, iterations },
    base,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt'],
  );
}

async function encryptJSON(key, kdf, data) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const plain = new TextEncoder().encode(JSON.stringify(data));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: AAD }, key, plain));
  return { v: 1, kdf, iv: b64.encode(iv), ct: b64.encode(ct) };
}

/** Бросает ошибку, если пароль неверный (не сошёлся тег GCM). */
async function decryptJSON(key, record) {
  const plain = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: b64.decode(record.iv), additionalData: AAD },
    key,
    b64.decode(record.ct),
  );
  return JSON.parse(new TextDecoder().decode(plain));
}

function newKdfParams() {
  return {
    name: 'PBKDF2',
    hash: 'SHA-256',
    iter: CONFIG.kdfIterations,
    salt: b64.encode(crypto.getRandomValues(new Uint8Array(16))),
  };
}

/* =====================================================================
   ХРАНИЛИЩЕ
   В localStorage лежит только зашифрованная запись { v, kdf, iv, ct }.
   ===================================================================== */

const Vault = {
  read() {
    const raw = localStorage.getItem(CONFIG.storageKey);
    return raw ? JSON.parse(raw) : null;
  },
  exists() {
    return localStorage.getItem(CONFIG.storageKey) !== null;
  },
  write(record) {
    localStorage.setItem(CONFIG.storageKey, JSON.stringify(record));
  },
  wipe() {
    localStorage.removeItem(CONFIG.storageKey);
  },
};
