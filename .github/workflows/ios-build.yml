name: iOS build (unsigned, for Sideloadly)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [app/**]

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx cap sync ios

      - name: Build unsigned .app for a real device
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -target App \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$(pwd)/build"

      - name: Package as .ipa (Sideloadly signs it on install)
        run: |
          set -e
          mkdir -p Payload
          cp -r build/App.app Payload/
          zip -qr Aya.ipa Payload
          mkdir -p out && mv Aya.ipa out/

      - uses: actions/upload-artifact@v4
        with:
          name: Aya-ipa
          path: app/out/Aya.ipa
          retention-days: 14
