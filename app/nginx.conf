server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: любой неизвестный путь отдаём как index.html (vue-router history mode)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # service worker не должен кэшироваться агрессивно
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
